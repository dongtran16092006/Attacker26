<script>
(function(){
  'use strict';
  const AUTH_KEY='decifin.auth.session.v1';
  const ACCOUNT_KEY='decifin.auth.account.v1';
  const API_BASE=(window.DECIFIN_API_BASE||'').replace(/\/$/,'');

  const $=(s,r=document)=>r.querySelector(s);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const get=(k)=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
  const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
  const del=(k)=>{try{localStorage.removeItem(k)}catch{}};

  async function api(path, options={}){
    const headers={'Content-Type':'application/json'};
    const session=get(AUTH_KEY);
    if(session?.token) headers.Authorization=`Bearer ${session.token}`;
    const response=await fetch(`${API_BASE}${path}`,{...options,headers:{...headers,...(options.headers||{})},body:options.body?JSON.stringify(options.body):undefined});
    if(response.status===204)return null;
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||`Lỗi máy chủ (${response.status}).`);
    return data;
  }

  async function hash(value){
    if(window.crypto?.subtle){
      const data=new TextEncoder().encode(value);
      const digest=await crypto.subtle.digest('SHA-256',data);
      return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
    return btoa(unescape(encodeURIComponent(value)));
  }

  function authShell(mode='login'){
    const register=mode==='register', forgot=mode==='forgot';
    const account=get(ACCOUNT_KEY)||{};
    return `<div class="df-auth" id="df-auth">
      <section class="df-auth__hero">
        <span class="df-auth__particle" style="left:18%;bottom:18%;animation-delay:0s"></span>
        <span class="df-auth__particle" style="left:42%;bottom:9%;animation-delay:2s"></span>
        <span class="df-auth__particle" style="left:70%;bottom:24%;animation-delay:4s"></span>
        <div class="df-auth__content">
          <div class="df-auth__brand"><span class="df-auth__mark">D</span> DeciFin</div>
          <h1>Đừng chỉ nhìn số dư. Hãy nhìn thấy tương lai.</h1>
          <p class="df-auth__tagline">DeciFin giúp bạn mô phỏng những hệ quả tài chính trước khi đưa ra quyết định.</p>
          <div class="df-auth__visual">
            <div class="df-auth__visual-top"><div><div style="font-size:11px;color:rgba(255,255,255,.62)">FINANCIAL HEALTH</div><div class="df-auth__visual-score">72 <span style="font-size:14px;font-weight:500;color:rgba(255,255,255,.6)">/100</span></div></div><div style="font-size:12px;color:#7ED6C3">● Tương đối an toàn</div></div>
            <div class="df-auth__mini-grid">
              <div class="df-auth__mini"><span>Dòng tiền dư</span><b>5,5 triệu / tháng</b></div>
              <div class="df-auth__mini"><span>Quỹ dự phòng</span><b>3,2 tháng</b></div>
              <div class="df-auth__mini"><span>Mục tiêu</span><b>Du học · 63%</b></div>
            </div>
            <div class="df-auth__chart"><svg viewBox="0 0 520 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 51 C55 48,70 55,112 40 S176 46,214 28 S278 35,315 22 S390 30,427 12 S482 18,520 5"/></svg></div>
          </div>
        </div>
      </section>
      <section class="df-auth__right"><div class="df-auth__panel" id="df-auth-panel">
        ${forgot?forgotView(account):register?registerView():loginView()}
      </div></section>
    </div>`;
  }

  function loginView(){
    return `<div class="df-auth__eyebrow">YOUR MONEY · YOUR DECISIONS</div>
      <h2>Chào mừng trở lại 👋</h2>
      <p class="df-auth__sub">Đăng nhập để tiếp tục hành trình quản lý tài chính của bạn.</p>
      <form id="df-login-form">
        ${field('Email','df-email','email','you@example.com')}
        ${passwordField('Mật khẩu','df-password','Nhập mật khẩu')}
        <div class="df-auth__row"><label class="df-auth__check"><input type="checkbox" id="df-remember"> Ghi nhớ đăng nhập</label><button type="button" class="df-auth__link" data-auth="forgot">Quên mật khẩu?</button></div>
        <div id="df-auth-msg"></div>
        <button class="df-auth__primary" id="df-login-btn">Đăng nhập →</button>
      </form>
      <div class="df-demo-account" role="note">
        <div><strong>🧪 Tài khoản demo</strong><span>Email: <b>demo@decifin.vn</b></span><span>Mật khẩu: <b>Demo@12345</b></span></div>
        <button type="button" class="df-auth__link" data-fill-demo>Điền nhanh</button>
      </div>
      <p class="df-auth__switch">Chưa có tài khoản? <button class="df-auth__link" data-auth="register">Đăng ký miễn phí</button></p>
      `;
  }
  function registerView(){
    return `<button class="df-auth__back" type="button" data-auth="login">← Quay lại đăng nhập</button>
      <div class="df-auth__eyebrow">START YOUR FINANCIAL JOURNEY</div>
      <h2>Bắt đầu hiểu tiền của bạn.</h2>
      <p class="df-auth__sub">Tạo hồ sơ tài chính cá nhân và bắt đầu mô phỏng trước khi đưa ra quyết định.</p>
      <form id="df-register-form">
        ${field('Họ và tên','df-name','text','Nguyễn Văn A')}
        ${field('Email','df-email','email','you@example.com')}
        ${passwordField('Mật khẩu','df-password','Ít nhất 8 ký tự')}
        ${passwordField('Xác nhận mật khẩu','df-password2','Nhập lại mật khẩu')}
        <div class="df-auth__row"><label class="df-auth__check"><input type="checkbox" id="df-terms"> Tôi đồng ý với Điều khoản sử dụng và Chính sách bảo mật.</label></div>
        <div id="df-auth-msg"></div>
        <button class="df-auth__primary" id="df-register-btn">Tạo tài khoản miễn phí →</button>
      </form>
      <p class="df-auth__switch">Đã có tài khoản? <button class="df-auth__link" data-auth="login">Đăng nhập</button></p>
      `;
  }
  function forgotView(){
    return `<button class="df-auth__back" type="button" data-auth="login">← Quay lại đăng nhập</button>
      <div class="df-auth__eyebrow">ACCOUNT RECOVERY</div>
      <h2>Khôi phục quyền truy cập.</h2>
      <p class="df-auth__sub">Nhập email của bạn. Trong bản demo standalone, DeciFin sẽ xác nhận yêu cầu ngay trên thiết bị.</p>
      <form id="df-forgot-form">${field('Email','df-email','email','you@example.com')}<div id="df-auth-msg"></div><button class="df-auth__primary">Gửi yêu cầu →</button></form>`;
  }
  function field(label,id,type,placeholder){
    return `<div class="df-auth__field"><label for="${id}">${label}</label><input class="df-auth__input" id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" autocomplete="${type==='email'?'email':'name'}" required></div>`;
  }
  function passwordField(label,id,placeholder){
    return `<div class="df-auth__field"><label for="${id}">${label}</label><div class="df-auth__input-wrap"><input class="df-auth__input df-auth__input--password" id="${id}" name="${id}" type="password" placeholder="${placeholder}" autocomplete="current-password" required><button class="df-auth__show" type="button" data-show="${id}" aria-label="Hiện mật khẩu">Hiện</button></div></div>`;
  }
  function msg(text,type='error'){const e=$('#df-auth-msg');if(e)e.innerHTML=`<div class="df-auth__${type}">${esc(text)}</div>`}
  function show(mode){const old=$('#df-auth');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',authShell(mode));bind();setTimeout(()=>$('#df-auth input')?.focus(),80)}
  function finishAuth(isNewUser=false){
    set(AUTH_KEY,{at:new Date().toISOString()});
    const overlay=$('#df-auth');if(overlay)overlay.remove();
    const profile=(()=>{try{return JSON.parse(localStorage.getItem('decifin.profile.v1')||'null')}catch{return null}})();
    if(isNewUser){
      showNewUserWelcome();
      return;
    }
    if(!profile?.income){
      document.querySelector('[data-action="go"][data-view="profile"]')?.click();
    } else if (typeof render === 'function' && window.__decifinRoot) {
      render(window.__decifinRoot);
    }
  }
  function showNewUserWelcome(){
    const old=$('#df-newuser-welcome');if(old)old.remove();
    const account=get(ACCOUNT_KEY)||{};
    document.body.insertAdjacentHTML('beforeend',`
      <div id="df-newuser-welcome" class="df-newuser-backdrop" role="dialog" aria-modal="true" aria-labelledby="df-newuser-title">
        <div class="df-newuser-card">
          <div class="df-newuser-copy">
            <div class="df-newuser-eyebrow">DeciFin · Thành viên mới</div>
            <h2 id="df-newuser-title">Xin chào ${esc(account.name||'bạn')} 👋</h2>
            <p style="margin-top:13px">Chào mừng bạn đến với DeciFin. Trước khi đưa ra một quyết định tài chính, chúng ta sẽ cùng tạo một bức tranh tài chính đủ rõ để mô phỏng các khả năng.</p>
            <div class="df-newuser-steps">
              <div class="df-newuser-step"><span>1</span><div><b>Tạo hồ sơ tài chính</b><small class="muted">Thu nhập, chi phí, tài sản và các khoản nợ.</small></div></div>
              <div class="df-newuser-step"><span>2</span><div><b>Chọn mục tiêu của bạn</b><small class="muted">Ví dụ: mua nhà, du lịch, tiết kiệm hoặc quỹ dự phòng.</small></div></div>
              <div class="df-newuser-step"><span>3</span><div><b>Mô phỏng trước khi quyết định</b><small class="muted">So sánh nhiều phương án và nhìn thấy hệ quả trước khi xuống tiền.</small></div></div>
            </div>
            <div class="df-newuser-actions">
              <button class="btn" id="df-newuser-start">Bắt đầu thiết lập hồ sơ →</button>
              <button class="btn btn--ghost" id="df-newuser-later">Để sau</button>
            </div>
          </div>
          <div class="df-newuser-visual">
            <div>
              <div class="df-decibo" aria-label="Decibo, linh vật DeciFin" role="img">
                <span class="df-decibo__antenna"></span><span class="df-decibo__dot"></span>
                <div class="df-decibo__body"></div><span class="df-decibo__eye df-decibo__eye--l"></span><span class="df-decibo__eye df-decibo__eye--r"></span><span class="df-decibo__mouth"></span>
              </div>
              <div style="font-weight:800;font-size:1.25rem;margin-top:10px">Mình là Decibo</div>
              <p style="margin-top:8px">Mình sẽ hướng dẫn bạn từng bước. Không cần biết tài chính trước — chỉ cần bắt đầu từ những con số bạn đang có.</p>
              <span class="df-newuser-badge">✨ Mất khoảng 2 phút để thiết lập</span>
            </div>
          </div>
        </div>
      </div>`);
    const close=(start)=>{const el=$('#df-newuser-welcome');if(el)el.remove();if(start){localStorage.setItem('DECIFIN_ONBOARDING_STATE','started');document.querySelector('[data-action="go"][data-view="profile"]')?.click();}else{localStorage.setItem('DECIFIN_ONBOARDING_STATE','later');if(typeof update==='function'){update({view:'dashboard'});}else if(typeof render==='function'&&window.__decifinRoot){render(window.__decifinRoot);}setTimeout(()=>window.DecifinRetention?.renderEmpty?.(),120);}};
    $('#df-newuser-start').onclick=()=>close(true);
    $('#df-newuser-later').onclick=()=>close(false);
    $('#df-newuser-welcome').addEventListener('click',e=>{if(e.target.id==='df-newuser-welcome')close(false)});
    $('#df-newuser-start').focus();
  }
  function logout(){
    const session=get(AUTH_KEY);
    if(session?.token) api('/api/auth/logout',{method:'POST'}).catch(()=>{});
    del(AUTH_KEY);
    const overlay=$('#df-auth');if(overlay)overlay.remove();
    if(typeof render === 'function' && window.__decifinRoot) render(window.__decifinRoot);
    show('login');
  }

  /** Hỏi lại trước khi đăng xuất, dựng ngay trong trang thay cho alert()/confirm() của trình duyệt. */
  function confirmLogout(){
    if($('#df-logout-confirm')) return;
    document.body.insertAdjacentHTML('beforeend', `
      <div id="df-logout-confirm" class="df-logout-backdrop">
        <div class="df-logout-modal">
          <h3>Đăng xuất khỏi DeciFin?</h3>
          <p>Dữ liệu tài chính của bạn vẫn được lưu trên thiết bị.</p>
          <div class="df-logout-actions">
            <button type="button" class="btn btn--ghost" data-logout-stay>Ở lại</button>
            <button type="button" class="btn" data-logout-confirm>Đăng xuất</button>
          </div>
        </div>
      </div>`);
    const close=()=>$('#df-logout-confirm')?.remove();
    $('[data-logout-stay]').onclick=close;
    $('[data-logout-confirm]').onclick=()=>{close();logout();};
    document.getElementById('df-logout-confirm').addEventListener('click', (e)=>{ if(e.target.id==='df-logout-confirm') close(); });
  }
  function bind(){
    document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>show(b.dataset.auth));
    document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.show);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Hiện':'Ẩn'});
    $('[data-fill-demo]')?.addEventListener('click',()=>{ $('#df-email').value='demo@decifin.vn'; $('#df-password').value='Demo@12345'; $('#df-email').focus(); });
    $('#df-login-form')?.addEventListener('submit',async e=>{
      e.preventDefault();const btn=$('#df-login-btn');btn.disabled=true;btn.textContent='Đang đưa bạn trở lại DeciFin…';
      const email=$('#df-email').value.trim().toLowerCase();const password=$('#df-password').value;
      try { const data=await api('/api/auth/login',{method:'POST',body:{email,password}}); set(ACCOUNT_KEY,{email}); set(AUTH_KEY,{token:data.token,at:new Date().toISOString()}); finishAuth(); }
      catch(error){btn.disabled=false;btn.textContent='Đăng nhập →';msg(error.message);}
    });
    $('#df-register-form')?.addEventListener('submit',async e=>{
      e.preventDefault();const name=$('#df-name').value.trim();const email=$('#df-email').value.trim().toLowerCase();const p1=$('#df-password').value;const p2=$('#df-password2').value;
      if(name.length<2){msg('Bạn cho DeciFin biết tên của mình nhé.');return}
      if(p1.length<8){msg('Mật khẩu nên có ít nhất 8 ký tự để bảo vệ tài khoản của bạn.');return}
      if(p1!==p2){msg('Hai mật khẩu chưa giống nhau. Kiểm tra lại nhé.');return}
      if(!$('#df-terms').checked){msg('Bạn cần đồng ý với Điều khoản sử dụng và Chính sách bảo mật.');return}
      const btn=$('#df-register-btn');btn.disabled=true;btn.textContent='Đang tạo tài khoản…';
      try { const data=await api('/api/auth/register',{method:'POST',body:{email,password:p1}}); set(ACCOUNT_KEY,{name,email,createdAt:new Date().toISOString()}); set(AUTH_KEY,{token:data.token,at:new Date().toISOString()}); msg('Chào mừng bạn đến với DeciFin 🎉','success'); setTimeout(()=>finishAuth(true),650); }
      catch(error){btn.disabled=false;btn.textContent='Tạo tài khoản miễn phí →';msg(error.message);}
    });
    $('#df-forgot-form')?.addEventListener('submit',e=>{e.preventDefault();msg('Trong bản demo, yêu cầu đã được ghi nhận. Khi triển khai production, email reset sẽ được gửi qua hệ thống xác thực thật.','success')});
  }
  window.DecifinAuth={show,logout,confirmLogout};
  function boot(){
    if(!get(AUTH_KEY))show('login');
  }
  window.addEventListener('load',boot,{once:true});
})();
</script>

<script id="decifin-v3-enhancements-js">
(function(){
  const PLUS_PRICE = "29.000đ/tháng";

  function currentRoot(){ return window.__decifinRoot || document.querySelector('#app') || document.body; }

  // ---------- Decision visual layer ----------
  function injectDecisionEnhancement(){
    const root = currentRoot();
    const heading = [...root.querySelectorAll('h1,h2,h3')].find(el =>
      /quyết định|decision/i.test(el.textContent||''));
    if(!heading) return;
    const container = heading.closest('.shell') || heading.parentElement;
    if(!container || container.querySelector('.df-decision-hero')) return;

    const hero = document.createElement('section');
    hero.className='df-decision-hero';
    hero.innerHTML=`
      <div class="df-hero-row">
        <div class="df-hero-copy">
          <span class="df-pill">🔮 DECISION LAB</span>
          <h2>Nhìn thấy hệ quả trước khi xuống tiền</h2>
          <p>Chọn một quyết định, thử vài kịch bản và để Decibo giúp bạn hiểu điều gì có thể xảy ra.</p>
        </div>
        <div class="df-decibo" aria-label="Decibo">🤖</div>
      </div>
      <div class="df-decision-steps">
        <div class="df-step"><b>01</b><span>Chọn quyết định</span></div>
        <div class="df-step"><b>02</b><span>Điều chỉnh giả định</span></div>
        <div class="df-step"><b>03</b><span>Quan sát tác động</span></div>
        <div class="df-step"><b>04</b><span>So sánh & quyết định</span></div>
      </div>`;
    container.insertBefore(hero, container.firstChild);

    // Add an intuitive scenario chooser when the decision page is present.
    if(!container.querySelector('.df-scenario-card')){
      const card=document.createElement('section');
      card.className='df-scenario-card';
      card.innerHTML=`
        <span class="df-pill">BẮT ĐẦU NHANH</span>
        <h3 style="margin:10px 0 4px">Bạn đang cân nhắc điều gì?</h3>
        <p style="color:#68708a;margin-top:0">Chọn một tình huống để bắt đầu. Bạn vẫn có thể nhập số liệu chi tiết bên dưới.</p>
        <div class="df-choice-grid">
          <button class="df-choice" data-df-choice="laptop"><span class="df-icon">💻</span><h4>Mua laptop</h4><p>Trả thẳng hay trả góp?</p><span class="df-check">✓</span></button>
          <button class="df-choice" data-df-choice="travel"><span class="df-icon">✈️</span><h4>Đi du lịch</h4><p>Chi ngay hay trì hoãn?</p><span class="df-check">✓</span></button>
          <button class="df-choice" data-df-choice="investment"><span class="df-icon">📈</span><h4>Đầu tư / tiết kiệm</h4><p>Cơ hội nào phù hợp hơn?</p><span class="df-check">✓</span></button>
        </div>
        <div class="df-next">
          <div><b>💡 Gợi ý của Decibo</b><p>Thử mô phỏng một quyết định thật bạn đang cân nhắc.</p></div>
          <span class="df-pill">1 phút</span>
        </div>`;
      hero.after(card);
      card.querySelectorAll('.df-choice').forEach(btn=>btn.addEventListener('click',()=>{
        card.querySelectorAll('.df-choice').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        const type=btn.dataset.dfChoice;
        const map={
          laptop:"Mình sẽ giúp bạn xem trả thẳng và trả góp ảnh hưởng thế nào đến dòng tiền.",
          travel:"Hãy thử đặt ngân sách chuyến đi và xem mục tiêu dài hạn bị ảnh hưởng ra sao.",
          investment:"Trước tiên, hãy so sánh lợi suất kỳ vọng với mức an toàn và thanh khoản bạn cần."
        };
        showChat(map[type]||"Hãy bắt đầu với một quyết định cụ thể nhé!");
      }));
    }
  }

  // ---------- Premium Plus layer ----------
  function injectPlusEnhancement(){
    const root=currentRoot();
    const plusText=[...root.querySelectorAll('h1,h2,h3,h4,p,button')].find(el=>/decifin plus|plus/i.test(el.textContent||''));
    if(!plusText) return;
    const parent=plusText.closest('.card,.panel,.section,section,div');
    if(!parent || parent.querySelector('.df-plus-card')) return;
    const card=document.createElement('div');
    card.className='df-plus-card';
    card.innerHTML=`
      <div class="df-plus-top">
        <div><span class="df-plus-badge">✨ PREMIUM</span><h3>DeciFin Plus</h3>
        <p>Trợ lý lập kế hoạch tài chính cá nhân sâu hơn — không chỉ biết hôm nay, mà còn nhìn thấy vài năm tới.</p></div>
        <div style="font-size:42px">🔮</div>
      </div>
      <div class="df-plus-features">
        <div class="df-plus-feature"><b>🔮 Digital Twin</b><span>Mô phỏng tài chính cá nhân động.</span></div>
        <div class="df-plus-feature"><b>🌪 Stress Test</b><span>Thu nhập giảm, chi phí tăng, biến cố bất ngờ.</span></div>
        <div class="df-plus-feature"><b>🎯 Goal Optimizer</b><span>Tìm cách đạt mục tiêu nhanh và hợp lý hơn.</span></div>
        <div class="df-plus-feature"><b>📆 Cash Flow Calendar</b><span>Nhìn dòng tiền theo từng ngày trong tháng.</span></div>
        <div class="df-plus-feature"><b>📊 3–5 Year Forecast</b><span>Mô phỏng dài hạn có lạm phát và tăng trưởng.</span></div>
        <div class="df-plus-feature"><b>📄 Premium Report</b><span>Xuất báo cáo tài chính cá nhân chuyên nghiệp.</span></div>
      </div>
      <div class="df-plus-actions">
        <button class="btn primary" data-df-plus="open">Khám phá Plus — ${PLUS_PRICE}</button>
        <button class="btn" style="background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)" data-df-plus="later">Để sau</button>
      </div>`;
    parent.appendChild(card);
    card.querySelector('[data-df-plus="open"]').addEventListener('click',()=>openPlusModal());
  }

  function openPlusModal(){
    const old=document.querySelector('#df-plus-modal'); if(old) old.remove();
    const modal=document.createElement('div');
    modal.id='df-plus-modal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(8,12,30,.55);backdrop-filter:blur(8px);z-index:2000;display:grid;place-items:center;padding:20px';
    modal.innerHTML=`
      <div style="width:min(680px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.25)">
        <div style="padding:28px;background:linear-gradient(135deg,#111B3A,#6256D9);color:#fff">
          <div style="display:flex;justify-content:space-between;gap:16px"><div><span style="background:#F4C95D;color:#352c00;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px">DECIFIN PLUS</span>
          <h2 style="margin:12px 0 5px">Biết tương lai trước khi quyết định.</h2><p style="color:rgba(255,255,255,.75);margin:0">Mở khóa bộ công cụ lập kế hoạch chuyên sâu.</p></div><button data-df-plus-close style="border:0;background:transparent;color:#fff;font-size:24px">×</button></div>
        </div>
        <div style="padding:24px">
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
            ${["Digital Twin","Unlimited What-if","3–5 year simulation","Goal Optimizer","Opportunity Cost","Cash Flow Calendar","Stress Test","Premium PDF Report"].map(x=>`<div style="padding:13px;border:1px solid #e8e9f3;border-radius:16px">✓ <b>${x}</b></div>`).join('')}
          </div>
          <div style="margin-top:18px;padding:18px;border-radius:18px;background:#f7f8fc;display:flex;justify-content:space-between;align-items:center;gap:15px">
            <div><small style="color:#68708a">Gói năm — tiết kiệm hơn</small><strong style="display:block;font-size:24px;color:#111B3A">249.000đ / năm</strong></div>
            <button class="btn primary" data-df-plus-demo>Trải nghiệm Plus</button>
          </div>
          <p style="font-size:12px;color:#7b8195;margin-bottom:0">Demo prototype: nút thanh toán chưa kết nối cổng thanh toán thật.</p>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('[data-df-plus-close]').onclick=()=>modal.remove();
    modal.querySelector('[data-df-plus-demo]').onclick=()=>{
      modal.remove(); showChat("Bạn vừa mở khu vực Plus. Trong prototype, các tính năng premium đang ở chế độ trải nghiệm.");
    };
  }

  // ---------- Chatbot ----------
  let chatOpen=false;
  function chatContext(){
    let p=null;
    try{
      if(typeof getProfile==='function') p=getProfile();
      if(!p && typeof profile==='function') p=profile();
      if(!p) p=JSON.parse(localStorage.getItem('decifin.profile.v1')||localStorage.getItem('DECIFIN_PROFILE')||'null');
    }catch(e){p=null}
    p=p&&typeof p==='object'?p:null;
    let b={runway:0,dti:0,surplus:0,minimumSpend:0};
    try{if(p&&typeof baseline==='function') b={...b,...baseline(p)}}catch(e){}
    let goals=Array.isArray(p?.goals)?p.goals.filter(g=>g&&g.name):[];
    let wishlist=[];
    try{const w=JSON.parse(localStorage.getItem('DECIFIN_WISHLIST')||'[]');wishlist=Array.isArray(w)?w:[]}catch(e){}
    const focus=window.__decifinFocus===true;
    const displayName=String(p?.name||p?.fullName||p?.userName||'bạn').trim()||'bạn';
    let greeting=`Chào ${escapeHtml(displayName)} 👋 Mình là Decibo. Mình có thể giúp bạn hiểu các chỉ số, mô phỏng quyết định hoặc tìm bài học phù hợp.`;
    if(b.runway<3){
      greeting=`Chào ${escapeHtml(displayName)} 👋 Mình thấy quỹ dự phòng của bạn đang khá mỏng (dưới 3 tháng). Đây là điểm nên ưu tiên trước nhé!`;
    }else if(b.dti>0.4){
      greeting=`Chào ${escapeHtml(displayName)} 👋 Tỷ lệ nợ của bạn đang ở mức cao. Mình khuyên hạn chế thêm cam kết trả góp lúc này.`;
    }else if(focus){
      greeting=`Chào ${escapeHtml(displayName)} 👋 Bạn đang ở Chế độ tập trung. Mình sẽ ưu tiên giúp bạn nhìn rõ một quyết định tại một thời điểm.`;
    }else if(goals.length){
      greeting=`Chào ${escapeHtml(displayName)} 👋 Mình thấy bạn đang hướng tới “${escapeHtml(goals[0].name)}”. Hãy để mình giúp bạn kiểm tra quyết định hiện tại có làm mục tiêu chậm lại không.`;
    }
    const goalName=goals[0]?.name||'';
    let suggestions=[];
    if(goalName) suggestions.push(`Làm sao để đạt “${goalName}” nhanh hơn?`);
    if(b.runway<3) suggestions.push('Làm sao tăng quỹ dự phòng lên 3 tháng?');
    else if(b.dti>0.4) suggestions.push('Làm sao giảm áp lực nợ của mình?');
    else suggestions.push('Quyết định lớn nào mình nên mô phỏng?');
    if(wishlist[0]?.name) suggestions.push(`Món “${wishlist[0].name}” có phù hợp không?`);
    else suggestions.push('Gợi ý bài học phù hợp với mình');
    suggestions.push('DeciFin Plus có gì?');
    return {p,b,goals,wishlist,greeting,suggestions:suggestions.slice(0,4)};
  }
  function createChat(){
    if(document.querySelector('.df-chat-fab')) return;
    const ctx=chatContext();
    const fab=document.createElement('button');
    fab.className='df-chat-fab';fab.setAttribute('aria-label','Mở Decibo');fab.innerHTML='🤖';
    const panel=document.createElement('section');panel.className='df-chat-panel';panel.id='df-chat-panel';
    panel.innerHTML=`
      <div class="df-chat-head"><div class="df-chat-avatar">🤖</div><div><strong>Decibo</strong><small>Trợ lý tài chính hiểu ngữ cảnh</small></div>
      <button class="df-chat-close" aria-label="Đóng">×</button></div>
      <div class="df-chat-disclaimer">Decibo dùng dữ liệu đang có trên thiết bị để giải thích và mô phỏng. Không phải tư vấn tài chính.</div>
      <div class="df-chat-body" id="df-chat-body">
        <div class="df-msg bot">${escapeHtml(ctx.greeting)}</div>
        <div class="df-chat-suggestions">${ctx.suggestions.map((x,i)=>`<button data-chat-context="${i}">${escapeHtml(x)}</button>`).join('')}</div>
      </div>
      <div class="df-chat-input"><input id="df-chat-input" placeholder="Hỏi Decibo..." autocomplete="off"><button id="df-chat-send">➤</button></div>`;
    document.body.append(fab,panel);
    fab.onclick=()=>{chatOpen=!chatOpen;panel.classList.toggle('open',chatOpen);if(chatOpen)document.querySelector('#df-chat-input')?.focus()};
    panel.querySelector('.df-chat-close').onclick=()=>{chatOpen=false;panel.classList.remove('open')};
    panel.querySelectorAll('[data-chat-context]').forEach(btn=>btn.addEventListener('click',()=>chatContextReply(Number(btn.dataset.chatContext))));
    panel.querySelector('#df-chat-send').onclick=()=>sendChat();
    panel.querySelector('#df-chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
  }
  function addMsg(text,type='bot'){
    const body=document.querySelector('#df-chat-body');if(!body)return;
    const el=document.createElement('div');el.className='df-msg '+type;el.textContent=text;body.appendChild(el);body.scrollTop=body.scrollHeight;
  }
  function showChat(text){createChat();chatOpen=true;document.querySelector('#df-chat-panel').classList.add('open');if(text)addMsg(text,'bot')}
  function chatContextReply(index){
    const ctx=chatContext();const goal=ctx.goals[0]?.name;const wish=ctx.wishlist[0]?.name;
    const replies=[];
    replies.push(goal?`Với mục tiêu “${goal}”, mình có thể giúp bạn tính số tiền cần dành mỗi tháng và xem một quyết định mới sẽ làm mục tiêu chậm bao lâu.`:'Hãy thiết lập ít nhất một mục tiêu tài chính để mình có thể cá nhân hóa lộ trình cho bạn.');
    replies.push(ctx.b.runway<3?'Hiện tại ưu tiên hợp lý nhất là làm dày quỹ dự phòng lên ít nhất 3 tháng chi phí tối thiểu trước khi tăng các khoản chi lớn.':'Bạn có thể đưa một khoản mua sắm hoặc trả góp vào Decision Center để xem ảnh hưởng lên thanh khoản và mục tiêu.');
    replies.push(wish?`Bạn đang có “${wish}” trong Giỏ quyết định. Mình khuyên mô phỏng 3 phương án: mua ngay, trả góp và trì hoãn để nhìn rõ trade-off.`:'Mình có thể gợi ý bài học về DTI, lãi suất thực, chi phí cơ hội, lạm phát hoặc compound interest tùy tình huống của bạn.');
    replies.push('Plus mở rộng các câu hỏi sâu hơn như What-if, stress test, mô phỏng 3–5 năm và tối ưu nhiều mục tiêu.');
    addMsg(replies[index]||replies[0]);
  }
  function chatReply(kind){
    const ctx=chatContext();
    const replies={
      health:ctx.b.runway<3?'Quỹ dự phòng đang dưới 3 tháng, nên đây là tín hiệu cần ưu tiên. Mình có thể giúp bạn xem cần thêm bao nhiêu để đạt mốc 3 tháng.':ctx.b.dti>0.4?'DTI đang trên 40%, vì vậy áp lực nợ là tín hiệu chính. Hãy hạn chế thêm cam kết trả góp và tập trung giảm nghĩa vụ hiện tại.':'Các chỉ số nên đọc theo 3 lớp: thanh khoản → nợ → dòng tiền. Mình có thể giải thích từng chỉ số dựa trên hồ sơ hiện tại của bạn.',
      decision:'Hãy chọn một quyết định thật bạn đang cân nhắc. Ví dụ: mua laptop, trả góp, du lịch hoặc trì hoãn mua. DeciFin sẽ giúp bạn nhìn dòng tiền và mục tiêu trước khi quyết định.',
      learn:'Nếu bạn đang quan tâm trả góp, hãy học Lãi suất thực, DTI và Chi phí cơ hội. Nếu đang có mục tiêu dài hạn, hãy bắt đầu với Lạm phát và Compound Interest.',
      plus:'Plus tập trung vào những câu hỏi sâu hơn: “Nếu thu nhập giảm 20% thì sao?”, “Nếu lạm phát tăng thì mục tiêu thay đổi thế nào?” và mô phỏng 3–5 năm.'
    };
    addMsg(replies[kind]||'Mình đang ở đây để giúp bạn hiểu tài chính dễ hơn.');
  }
  function sendChat(){
    const input=document.querySelector('#df-chat-input');if(!input||!input.value.trim())return;
    const q=input.value.trim();input.value='';addMsg(q,'user');
    setTimeout(()=>{
      const s=q.toLowerCase();
      if(/lãi|interest|lạm phát|inflation|chi phí cơ hội|compound/.test(s))chatReply('learn');
      else if(/plus|premium|what-if|stress/.test(s))chatReply('plus');
      else if(/quyết định|mua|trả góp|laptop|xe|du lịch/.test(s))chatReply('decision');
      else if(/chỉ số|sức khỏe|health|điểm|dti|quỹ dự phòng|runway/.test(s))chatReply('health');
      else{
        const ctx=chatContext();
        addMsg(ctx.goals[0]?.name?`Mình đang thấy mục tiêu “${ctx.goals[0].name}”. Bạn có thể hỏi mình mục tiêu này bị ảnh hưởng thế nào bởi một quyết định cụ thể.`:'Mình hiểu câu hỏi của bạn. Hãy hỏi về chỉ số tài chính, một quyết định cụ thể, mục tiêu hoặc DeciFin Learn nhé.');
      }
    },350);
  }

  function run(){
    createChat();
    injectDecisionEnhancement();
    // Plus is handled by the original DeciFin Plus module below. Do not inject a second Plus modal.
  }

  // Existing app renders dynamically; observe it and enhance only when needed.
  const observer=new MutationObserver(()=>{clearTimeout(window.__dfEnhanceTimer);window.__dfEnhanceTimer=setTimeout(run,60)});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(run,250);
})();
</script>

<script id="decifin-retention-features-v6">
(function(){
  'use strict';
  const K={wish:'DECIFIN_WISHLIST',snap:'DECIFIN_SNAPSHOTS',notes:'DECIFIN_NOTIFICATIONS',rewards:'DECIFIN_MILESTONE_REWARDS',challenge:'DECIFIN_CHALLENGES',onboard:'DECIFIN_ONBOARDING_STATE',last:'DECIFIN_RETENTION_LAST_CHECKIN'};
  const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch{return f}};
  const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const profile=()=>read('decifin.profile.v1',null);
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const vn=v=>typeof money==='function'?money(v):new Intl.NumberFormat('vi-VN').format(Math.round(v||0))+'đ';
  const uid=()=> 'w_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  function toast(text){const old=document.querySelector('.df-v6-toast');if(old)old.remove();const e=document.createElement('div');e.className='df-v6-toast';e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}
  function closeModal(){document.querySelectorAll('.df-v6-modal').forEach(x=>x.remove());document.removeEventListener('keydown',escClose)}
  function escClose(e){if(e.key==='Escape')closeModal()}
  function modal(title,body,wide=true){closeModal();const m=document.createElement('div');m.className='df-v6-modal';m.innerHTML=`<div class="df-v6-dialog ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="df-v6-head"><h3>${title}</h3><button type="button" class="df-v6-x" data-v6-close>×</button></div><div class="df-v6-body">${body}</div></div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-v6-close]'))closeModal()});document.addEventListener('keydown',escClose);return m}
  function getBase(p){return typeof baseline==='function'?baseline(p):{surplus:(+p.income||0)-(+p.minimumSpend||0)-(+p.discretionary||0),minimumSpend:+p.minimumSpend||0,runway:(+p.minimumSpend||0)>0?(+p.liquidAssets||0)/(+p.minimumSpend||1):0,dti:+p.dti||0}}
  function wishlist(){return read(K.wish,[])}
  function saveWishlist(v){write(K.wish,v)}
  function normalise(){const p=profile();return p&&typeof normaliseWeights==='function'?normaliseWeights(p.goals||[]):p?.goals||[]}
  function calcWish(item){
    const p=profile()||{};const b=getBase(p);const price=Math.max(0,+item.price||0);const monthlyRate=Math.max(0,+item.rate||1.5)/100;
    const monthly=typeof flatRatePayment==='function'?flatRatePayment(price,12,monthlyRate):price/12+price*monthlyRate;
    const surplus=Math.max(0,+b.surplus||0);const extra=Math.max(100000,Math.min(surplus,Math.round(surplus*.25/100000)*100000||100000));
    const saved=Math.max(0,+item.saved||0);const remaining=Math.max(0,price-saved);const waitMonths=extra>0?Math.ceil(remaining/extra):Infinity;
    const dtiBefore=+b.dti||0;const income=Math.max(1,+p.income||1);const dtiAfter=dtiBefore+monthly/income;
    const runwayBefore=+b.runway||0;const runwayAfter=+b.minimumSpend>0?Math.max(0,((+p.liquidAssets||0)-Math.min(+p.liquidAssets||0,monthly))/b.minimumSpend):runwayBefore;
    const band=runwayAfter<3||dtiAfter>.4?'blocked':(runwayAfter<4||dtiAfter>.3?'caution':'safe');
    const maxDelay=(p.goals||[]).length&&surplus>0?Math.max(0,Math.ceil((monthly/surplus)*3)):0;
    return {price,monthlyRate,installmentMonthly:monthly,surplus,extra,saved,remaining,waitMonths,dtiAfter,runwayAfter,band,maxDelay};
  }
  function wishCard(item){const c=calcWish(item);const pct=Math.min(100,Math.max(0,c.saved/Math.max(c.price,1)*100));const label=c.band==='safe'?'🟢 CÓ THỂ CÂN NHẮC':c.band==='caution'?'⚠️ CẦN CÂN NHẮC':'🚫 KHÔNG NÊN MUA NGAY';const p=profile()||{};const income=Math.max(1,+p.income||0);const workMonths=c.price/income;const workText=workMonths<1?`${Math.round(workMonths*30)} ngày thu nhập`:workMonths<12?`${workMonths.toFixed(1)} tháng thu nhập`:`${(workMonths/12).toFixed(1)} năm thu nhập`;return `<article class="df-v6-wish-card"><div class="df-v6-card-top"><div><span class="df-v6-kicker">GIỎ QUYẾT ĐỊNH</span><h3>${esc(item.name)}</h3></div><span class="df-v6-status ${c.band}">${label}</span></div><div class="df-v6-price">${vn(c.price)}</div><div class="df-v6-regret">🧠 <strong>Regret Minimizer:</strong> Món này tương đương khoảng <span class="df-regret-number">${workText}</span> của bạn. Không phải để bạn thấy “đắt”, mà để nhìn rõ <b>công sức lao động</b> phía sau quyết định.</div><div class="df-v6-sub">Lãi mô phỏng: <b>${(+item.rate||1.5).toFixed(1)}%/tháng</b> · ${esc(item.priority||'Trung bình')} · ${esc(item.targetDate||'Chưa đặt ngày')}</div><div class="df-v6-progress"><i style="width:${pct}%"></i></div><div class="df-v6-spread"><span>Đã sẵn sàng <b>${vn(c.saved)}</b></span><b>${pct.toFixed(0)}%</b></div><div class="df-v6-metrics"><div><span>Nếu chờ</span><b>${Number.isFinite(c.waitMonths)?c.waitMonths+' tháng':'—'}</b></div><div><span>Dành thêm/tháng</span><b>${vn(c.extra)}</b></div><div><span>Runway sau mua</span><b>${c.runwayAfter.toFixed(1)} tháng</b></div></div><div class="df-v6-decibo">🤖 <span>${c.band==='blocked'?'Decibo: “Khoan đã. Món này đang làm thủng vùng an toàn.”':c.band==='caution'?'Decibo: “Mình thấy có trade-off. Hãy mô phỏng sâu trước khi quyết.”':'Decibo: “Bạn đang có khoảng an toàn. Mình vẫn mô phỏng trước cho chắc nhé.”'}</span></div><div class="df-v6-actions"><button class="btn" data-v6-decision="${item.id}">🔮 Đẩy sang Decision Engine</button>   function rescuePlan(def,p){const b=getBase(p),need=Math.max(0,def);const flex=Math.min(Math.max(0,+p.discretionary||0),need);let rem=need-flex;const goalPool=Math.max(0,+b.surplus||0);const goalCut=Math.min(rem,goalPool);rem-=goalCut;const floor=Math.max(3*(+b.minimumSpend||0),0);const reserve=Math.min(rem,Math.max(0,(+p.liquidAssets||0)-floor));rem-=reserve;return {b,need,remaining:rem,actions:[{id:'flex',title:'Cắt chi tiêu linh hoạt tháng sau',desc:'Đòn bẩy ít tổn thương nhất. Không chạm mục tiêu dài hạn.',amount:flex,checked:flex>0},{id:'goals',title:'Tạm dừng mục tiêu không bắt buộc',desc:'Giữ tiền lại 1–2 tháng và tính lại độ trễ mục tiêu.',amount:goalCut,checked:goalCut>0},{id:'reserve',title:'Rút phần quỹ dự phòng vượt đáy an toàn',desc:'Chỉ sử dụng phần còn dư trên runway tối thiểu 3 tháng.',amount:reserve,checked:false}]}}

nst total=plan.actions.filter(a=>selected.includes(a.id)).reduce((s,a)=>s+a.amount,0);const after=plan.b.surplus+total;const reserveAfter=plan.b.minimumSpend>0?Math.max(0,(+p.liquidAssets||0)-(selected.includes('reserve')?plan.actions.find(a=>a.id==='reserve').amount:0))/plan.b.minimumSpend:+plan.b.runway||0;const confirm=modal('🛟 Xác nhận Plan B',`<div class="df-v6-confirm"><div class="df-v6-confirm-main">${after>=0?'🟢':'⚠️'} <b>${after>=0?'Dòng tiền mô phỏng đã về vùng ổn định.':'Phương án vẫn còn thiếu. Hãy cân nhắc giảm mức hụt.'}</b></div><p>Trước: <b>${vn(plan.b.surplus)}/tháng</b> → Sau: <b>${vn(after)}/tháng</b>.</p><p>Runway mô phỏng: <b>${reserveAfter.toFixed(1)} tháng</b>. Chỉ áp dụng khi bạn xác nhận.</p><div class="df-v6-foot"><button class="btn btn--ghost" data-v6-close>Quay lại</button><button class="btn" id="v6-confirm-sos">✓ Áp dụng vào hồ sơ</button></div></div>`);confirm.querySelector('#v6-confirm-sos').onclick=()=>{const cp=JSON.parse(JSON.stringify(p));if(selected.includes('flex'))cp.discretionary=Math.max(0,(+cp.discretionary||0)-plan.actions.find(a=>a.id==='flex').amount);if(selected.includes('goals')){const cut=plan.actions.find(a=>a.id==='goals').amount;cp.goals=(cp.goals||[]).map(g=>({...g,allocWeight:Math.max(0,(+g.allocWeight||0)*(1-cut/Math.max(plan.b.surplus,1)))}));if(typeof normaliseWeights==='function')cp.goals=normaliseWeights(cp.goals)}if(selected.includes('reserve'))cp.liquidAssets=Math.max(0,(+cp.liquidAssets||0)-plan.actions.find(a=>a.id==='reserve').amount);localStorage.setItem('decifin.profile.v1',JSON.stringify(cp));closeModal();if(typeof update==='function')update({view:'dashboard'});else if(typeof rerender==='function')rerender();toast('🛟 Plan B đã được áp dụng. Dashboard đã cập nhật.')};}}
  // ---- Weekly Financial Challenge System -------------------------------
  const CHALLENGE_KEY='DECIFIN_CHALLENGES';
  const CHALLENGE_BADGE={debt:'💳 GIẢM NỢ',runway:'🛡️ QUỸ AN TOÀN',cashflow:'💰 DÒNG TIỀN',impulse:'🧠 CHI TIÊU',longterm:'🎯 MỤC TIÊU DÀI HẠN'};
  const CHALLENGE_SKILL={debt:'Kiểm soát nợ',runway:'Xây quỹ dự phòng',cashflow:'Bảo vệ dòng tiền',impulse:'Kiểm soát chi tiêu bốc đồng',longterm:'Tối ưu tài sản dài hạn'};
  const CHALLENGE_IMPACT={debt:'Giảm khả năng phát sinh nợ mới',runway:'Tăng khả năng chống chịu trước cú sốc tài chính',cashflow:'Duy trì khả năng chi trả khi thu nhập biến động',impulse:'Giảm chi tiêu bốc đồng, bảo vệ mục tiêu dài hạn',longterm:'Tăng tốc độ tích lũy và đầu tư'};

  function mondayOf(d){const dt=new Date(d);const day=dt.getDay();dt.setDate(dt.getDate()-(day===0?6:day-1));dt.setHours(0,0,0,0);return dt}
  function addWeeksTo(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n*7);return dt}
  function weekKeyOf(d){return mondayOf(d).toISOString().slice(0,10)}
  function daysUntilNextChallenge(){const now=new Date();const next=addWeeksTo(mondayOf(now),1);return Math.max(0,Math.ceil((next-now)/86400000))}
  function readChallengeHistory(){try{const raw=localStorage.getItem(CHALLENGE_KEY);const parsed=raw?JSON.parse(raw):[];return Array.isArray(parsed)?parsed:[]}catch(_){return []}}
  function writeChallengeHistory(h){try{localStorage.setItem(CHALLENGE_KEY,JSON.stringify(h))}catch(_){/* quota hoặc private mode */}}
  function computeStreak(history,completedThisWeek){
    const weeks=new Set(history.filter(x=>x&&x.weekKey).map(x=>x.weekKey));
    let ref=completedThisWeek?mondayOf(new Date()):addWeeksTo(mondayOf(new Date()),-1);
    let streak=0;
    while(weeks.has(weekKeyOf(ref))){streak++;ref=addWeeksTo(ref,-1)}
    return streak;
  }

  /** Cây quyết định: ưu tiên rủi ro nghiêm trọng nhất trước. */
  function pickChallengeKey(p,b){
    const dti=Number.isFinite(Number(b.dti))?Number(b.dti):0;
    const runway=Number.isFinite(Number(b.runway))?Number(b.runway):Infinity;
    const income=Math.max(1,+p.income||0);
    const savingsRate=Number.isFinite(Number(b.savingsRate))?Number(b.savingsRate):(Number(b.surplus||0)/income);
    let wishCount=0;
    try{wishCount=(typeof wishlist==='function'?wishlist():[]).length}catch(_){wishCount=0}

    if(dti>0.4) return 'debt';
    if(runway<3) return 'runway';
    if(savingsRate<0.1||Number(b.surplus||0)<=0) return 'cashflow';
    if(wishCount>=2) return 'impulse';
    return 'longterm';
  }

  function challengeScenario(key,p,b){
    const safeP=p&&typeof p==='object'?p:{};
    const safeB=b&&typeof b==='object'?b:{};
    const dtiPct=Math.round((Number(safeB.dti)||0)*100);
    const runwayNum=Number.isFinite(Number(safeB.runway))?Number(safeB.runway):0;
    const runway=runwayNum.toFixed(1);
    const surplus=Number(safeB.surplus)||0;
    const income=Math.max(1,Number(safeP.income)||1);
    const savingsRate=(Number.isFinite(Number(safeB.savingsRate))?Number(safeB.savingsRate):surplus/income)*100;
    const history=readChallengeHistory();
    const weekKey=weekKeyOf(new Date());
    const currentWeek=history.find(x=>x&&x.weekKey===weekKey);

    const scenarios=Array.isArray(bank[key])&&bank[key].length?bank[key]:bank.longterm;
    const seed=Math.abs(Math.floor(mondayOf(new Date()).getTime()/604800000));
    const usedRecent=new Set(history.filter(x=>x&&x.scenarioId&&x.category===key&&x.weekKey!==weekKey).slice(-6).map(x=>x.scenarioId));
    const difficultyTarget=computeStreak(history,false)>=4?'hard':computeStreak(history,false)>=2?'medium':'easy';
    const ranked=[...scenarios].sort((a,z)=>{
      const aUsed=usedRecent.has(a.id)?1:0, zUsed=usedRecent.has(z.id)?1:0;
      const aDiff=a.difficulty===difficultyTarget?0:1, zDiff=z.difficulty===difficultyTarget?0:1;
      return (aUsed-zUsed)||(aDiff-zDiff);
    });
    const pool=ranked.filter(x=>!usedRecent.has(x.id));
    const available=pool.length?pool:ranked;
    const index=available.length?seed%available.length:0;
    const chosen=available[index]||scenarios[0];
    if(currentWeek&&currentWeek.scenarioId===chosen.id){
      const alternate=available.find(x=>x.id!==currentWeek.scenarioId);
      if(alternate)return alternate;
    }
    return chosen;
  }

  function challengeReason(key,p,b){
    const safeB=b&&typeof b==='object'?b:{};
    const dti=Number.isFinite(Number(safeB.dti))?Number(safeB.dti):0;
    const runway=Number.isFinite(Number(safeB.runway))?Number(safeB.runway):0;
    const surplus=Number(safeB.surplus)||0;
    const income=Math.max(1,Number(p&&p.income)||1);
    const rate=Number.isFinite(Number(safeB.savingsRate))?Number(safeB.savingsRate):surplus/income;
    const map={
      debt:{title:'Nghĩa vụ nợ đang là ưu tiên',value:`DTI ${Math.round(dti*100)}%`,description:'DeciFin muốn giúp bạn luyện cách tránh tăng nghĩa vụ nợ và bảo vệ vùng an toàn.'},
      runway:{title:'Quỹ an toàn đang cần được củng cố',value:`Runway ${runway.toFixed(1)} tháng`,description:'DeciFin ưu tiên khả năng chống chịu trước khi theo đuổi lợi nhuận hoặc chi tiêu lớn.'},
      cashflow:{title:'Dòng tiền cần được giữ ổn định',value:`Surplus ${vn(surplus)}/tháng`,description:`Tỷ lệ tích lũy hiện khoảng ${Math.round(rate*100)}%. Thử thách giúp bạn tìm cách giảm rò rỉ dòng tiền.`},
      impulse:{title:'Một chút kỷ luật trước khi xuống tiền',value:'Có tín hiệu mua sắm cần kiểm tra',description:'DeciFin muốn biến một khoảng dừng nhỏ thành thói quen ra quyết định có chủ đích.'},
      longterm:{title:'Nền tảng đang đủ ổn để nghĩ dài hạn',value:'Tập trung vào mục tiêu',description:'DeciFin muốn giúp bạn chuyển surplus thành tiến bộ dài hạn có kế hoạch.'}
    };
    return map[key]||map.longterm;
  }

  function challengeHistoryModal(history){
    const rows=(Array.isArray(history)?history:[]).slice().sort((a,b)=>String(b.completedAt||'').localeCompare(String(a.completedAt||''))).slice(0,12);
    modal('📚 Hành trình thử thách',rows.length?`<div class="df-challenge-history">${rows.map(x=>`<div class="df-challenge-history-item"><div><b>${x.correct?'✓':'•'} ${esc(CHALLENGE_SKILL[x.category]||'Thử thách tài chính')}</b><small>${esc(x.weekKey||'')} · ${x.correct?'Hoàn thành đúng':'Đã hoàn thành'}</small></div><strong>+${Number(x.points)||0} FP</strong></div>`).join('')}</div>`:'<div class="df-ret-empty">Bạn chưa có lịch sử thử thách. Hoàn thành thử thách đầu tiên để bắt đầu hành trình nhé.</div>');
  }

  function challenge(){
    const p=profile();
    const b=getBase(p);
    if(!p||!b||typeof b!=='object'){
      if(typeof notify==='function')notify('Hãy thiết lập hồ sơ để tham gia thử thách nhé.');
      else if(typeof toast==='function')toast('Hãy thiết lập hồ sơ để tham gia thử thách nhé.');
      return;
    }

    const key=pickChallengeKey(p,b);
    const scenario=challengeScenario(key,p,b);
    const badge=CHALLENGE_BADGE[key]||'Thử thách tài chính';
    const skill=CHALLENGE_SKILL[key]||'Kỹ năng tài chính';
    const impact=CHALLENGE_IMPACT[key]||'Cải thiện chất lượng quyết định';
    const history=readChallengeHistory();
    const weekKey=weekKeyOf(new Date());
    const already=history.find(x=>x&&x.weekKey===weekKey);
    const countdown=daysUntilNextChallenge();
    const reason=challengeReason(key,p,b);
    const streak=computeStreak(history,Boolean(already));
    const accuracy=history.length?Math.round(history.filter(x=>x.correct).length/history.length*100):0;
    const progress=already?100:0;
    const weekLabel=(()=>{const d=mondayOf(new Date());const oneJan=new Date(d.getFullYear(),0,1);return Math.ceil((((d-oneJan)/86400000)+oneJan.getDay()+1)/7)})()
    const headerHtml=`
      <div class="df-challenge-shell">
        <div class="df-challenge-header">
          <div><span class="df-ret-badge">⚡ TUẦN ${weekLabel} · ${new Date().getFullYear()}</span><h3>Thử thách được chọn riêng cho bạn</h3><p>DeciFin chọn dựa trên sức khỏe tài chính hiện tại.</p></div>
          <button type="button" class="btn btn--ghost" data-challenge-history aria-label="Xem lịch sử thử thách">📚 Lịch sử</button>
        </div>
        <div class="df-challenge-meta"><span>🔥 ${streak} tuần streak</span><span>🎯 ${already?'1':'0'}/1 tuần này</span><span>+${Number(scenario.reward)||10} FinPoint</span>${accuracy?`<span>📈 ${accuracy}% chính xác</span>`:''}</div>
        <div class="df-challenge-progress"><div><span>Tiến độ tuần</span><b>${progress}%</b></div><i><em style="width:${progress}%"></em></i></div>
      </div>`;

    if(already){
      modal('⚡ Thử thách tuần · dành riêng cho bạn',`${headerHtml}<div class="df-challenge-reason"><span class="df-challenge-kicker">✨ VÌ SAO DECIFIN CHỌN THỬ THÁCH NÀY?</span><b>${esc(reason.title)}</b><strong>${esc(reason.value)}</strong><p>${esc(reason.description)}</p></div><div class="df-ret-result safe"><b>🎉 Bạn đã hoàn thành thử thách tuần này</b><p>Tuần này bạn đã luyện: <strong>${esc(skill)}</strong>.</p><div class="df-ret-row"><span>FinPoint</span><b>+${Number(already.points)||0}</b></div><div class="df-ret-row"><span>🔥 Streak</span><b>${streak} tuần</b></div><div class="df-ret-row"><span>📈 Tác động</span><b>${esc(impact)}</b></div></div><div class="df-challenge-goal"><span>🎯 MỤC TIÊU KỸ NĂNG</span><b>${esc(scenario.goal||'Tiếp tục cải thiện kỹ năng tài chính.')}</b></div><p class="small muted" style="margin-top:12px">Thử thách mới sau ${countdown} ngày.</p>`);
      const hm=document.querySelector('.df-v6-modal');
      hm?.querySelector('[data-challenge-history]')?.addEventListener('click',()=>challengeHistoryModal(readChallengeHistory()));
      return;
    }

    const m=modal('⚡ Thử thách tuần · dành riêng cho bạn',`${headerHtml}<div class="df-challenge-reason"><span class="df-challenge-kicker">✨ VÌ SAO DECIFIN CHỌN THỬ THÁCH NÀY?</span><b>${esc(reason.title)}</b><strong>${esc(reason.value)}</strong><p>${esc(reason.description)}</p><div class="df-challenge-data"><span>DTI <b>${Math.round((Number(b.dti)||0)*100)}%</b></span><span>Runway <b>${(Number.isFinite(Number(b.runway))?Number(b.runway):0).toFixed(1)} tháng</b></span><span>Surplus <b>${vn(Number(b.surplus)||0)}</b></span></div></div><div class="df-challenge-goal"><span>🎯 MỤC TIÊU TUẦN NÀY</span><b>${esc(scenario.goal||'Luyện một kỹ năng tài chính cụ thể.')}</b><small>Độ khó: ${esc(scenario.difficulty||'medium')}</small></div><div class="df-challenge-question"><span class="df-challenge-kicker">CÂU HỎI</span><p>${esc(scenario.question)}</p><div class="df-ret-list">${scenario.options.map(o=>`<button type="button" class="btn btn--ghost df-challenge-option" data-challenge="${esc(o.key)}" style="text-align:left;width:100%;min-height:48px"><strong>${esc(o.key)}.</strong> ${esc(o.text)}</button>`).join('')}</div></div><div class="df-ret-result" data-challenge-result style="display:none"></div><p class="small muted" style="margin-top:12px" data-challenge-countdown>Thử thách mới sau ${countdown} ngày.</p>`);
    if(!m||typeof m.addEventListener!=='function')return;
    m.querySelector('[data-challenge-history]')?.addEventListener('click',()=>challengeHistoryModal(readChallengeHistory()));

    let answered=false;
    m.addEventListener('click',e=>{
      const btn=e.target.closest('[data-challenge]');
      if(!btn||answered)return;
      answered=true;
      const selected=btn.dataset.challenge;
      const correct=Array.isArray(scenario.correct)&&scenario.correct.includes(selected);
      const result=m.querySelector('[data-challenge-result]');
      if(!result)return;
      m.querySelectorAll('[data-challenge]').forEach(x=>{x.disabled=true;x.classList.toggle('is-selected',x===btn);x.style.cursor='default'});
      result.style.display='block';
      result.className=`df-ret-result ${correct?'safe':'risk'}`;
      result.innerHTML=`<b>${correct?'🎉 Chính xác!':'💡 Chưa tối ưu — và đây là cơ hội để học.'}</b><p style="margin:7px 0 0">${esc(correct?scenario.explanation:scenario.wrong)}</p><div class="df-ret-alert ${correct?'safe':''}" style="margin-top:12px;margin-bottom:0"><b>📌 Bài học tuần này:</b> ${esc(scenario.takeaway||'')}</div>`;

      try{
        const hist=readChallengeHistory();
        if(!hist.some(x=>x&&x.weekKey===weekKey)){
          const points=correct?Number(scenario.reward)||10:0;
          const entry={id:`challenge_${Date.now()}`,scenarioId:scenario.id,category:key,weekKey,answer:selected,correct,points,difficulty:scenario.difficulty||'medium',completedAt:new Date().toISOString()};
          hist.push(entry);writeChallengeHistory(hist);
          const nextStreak=computeStreak(hist,true);
          result.insertAdjacentHTML('beforeend',`<div class="df-ret-alert safe" style="margin-top:12px"><div class="df-ret-row"><span>FinPoint</span><b>+${points}</b></div><div class="df-ret-row"><span>🔥 Chuỗi thử thách</span><b>${nextStreak} tuần liên tiếp</b></div><div class="df-ret-row"><span>🎯 Kỹ năng</span><b>${esc(skill)}</b></div><div class="df-ret-row"><span>📈 Tác động</span><b>${esc(impact)}</b></div></div>`);
          const cd=m.querySelector('[data-challenge-countdown]');if(cd)cd.textContent=`Thử thách mới sau ${daysUntilNextChallenge()} ngày.`;
          if(points>0){if(typeof notify==='function')notify(`+${points} FinPoint · Thử thách tuần hoàn thành 🎉`);else if(typeof toast==='function')toast(`+${points} FinPoint · Thử thách tuần hoàn thành 🎉`)}else{if(typeof notify==='function')notify('Thử thách tuần đã hoàn thành. Tuần sau thử lại nhé!');else if(typeof toast==='function')toast('Thử thách tuần đã hoàn thành. Tuần sau thử lại nhé!')}
        }
      }catch(err){console.warn('[DeciFin] Không thể lưu DECIFIN_CHALLENGES:',err)}
    });
  }

  document.addEventListener('click',e=>{const add=e.target.closest('[data-v6-add]');if(add){e.preventDefault();addWishModal();return}const sim=e.target.closest('[data-v6-sim]');if(sim){e.preventDefault();simulate(sim.dataset.v6Sim);return}const dec=e.target.closest('[data-v6-decision]');if(dec){e.preventDefault();decision(dec.dataset.v6Decision);return}
    const bought=e.target.closest('[data-v6-bought]');if(bought){e.preventDefault();const item=wishlist().find(x=>x.id===bought.dataset.v6Bought);if(item){const c=calcWish(item);if(typeof window.logDecision==='function')window.logDecision({label:`Đã mua: ${item.name}`,amount:+item.price||0,tone:c.band==='blocked'?'risk':c.band==='caution'?'caution':'safe',detail:`Chuyển từ Giỏ quyết định sang đã mua · Runway sau mua ${c.runwayAfter.toFixed(1)} tháng.`});saveWishlist(wishlist().filter(x=>x.id!==item.id));if(typeof rerender==='function')rerender();toast('Đã ghi vào Journey và đóng mục này.')}return}
    const skip=e.target.closest('[data-v6-skip]');if(skip){e.preventDefault();const item=wishlist().find(x=>x.id===skip.dataset.v6Skip);if(item){if(typeof window.logDecision==='function')window.logDecision({label:`Quyết định không mua: ${item.name}`,amount:+item.price||0,tone:'safe',detail:'Bạn chọn không mua món này — giữ nguyên dòng tiền và quỹ dự phòng.'});saveWishlist(wishlist().filter(x=>x.id!==item.id));if(typeof rerender==='function')rerender();toast('Đã ghi vào Journey và bỏ khỏi Giỏ quyết định.')}return}
    const del=e.target.closest('[data-v6-del]');if(del){e.preventDefault();saveWishlist(wishlist().filter(x=>x.id!==del.dataset.v6Del));if(typeof rerender==='function')rerender();toast('Đã bỏ khỏi Giỏ quyết định.');return}const rescue=e.target.closest('[data-v6-rescue]');if(rescue){e.preventDefault();rescueModal();return}const oldRescue=e.target.closest('[data-ret-rescue]');if(oldRescue){e.preventDefault();rescueModal();return}const oldWish=e.target.closest('[data-ret-wishlist]');if(oldWish){e.preventDefault();if(typeof update==='function')update({view:'wishlist'});return}},false);
  if(typeof VIEWS!=='undefined')VIEWS.wishlist=wishlistView;
  window.DecifinWishlistV6={wishlistView,rescueModal,addWishModal,simulate};
  window.DecifinRetention={challenge};
})();
</script>

<script id="decifin-wrapped-v1">
(function(){
  'use strict';
  const HKEY='decifin.history.v1';
  const WKEY='DECIFIN_WISHLIST';
  const OPENKEY='decifin.wrapped.last.v1';
  const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch{return f}};
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const moneySafe=v=>typeof money==='function'?money(v):new Intl.NumberFormat('vi-VN').format(Math.round(v||0))+'đ';
  const profile=()=>read('decifin.profile.v1',null)||read('DECIFIN_PROFILE',null)||{};
  const history=()=>Array.isArray(read(HKEY,[]))?read(HKEY,[]):[];
  const wishlist=()=>Array.isArray(read(WKEY,[]))?read(WKEY,[]):[];
  function stats(){
    const h=history(), w=wishlist(), now=new Date(), month=now.getMonth(), year=now.getFullYear();
    const hm=h.filter(x=>{const d=new Date(x.at);return !isNaN(d)&&d.getMonth()===month&&d.getFullYear()===year});
    const decisions=hm.filter(x=>/decision|stress|quyết định|mô phỏng/i.test(String(x.label)+' '+String(x.detail)));
    const tracked=w.length;
    const delayed=w.filter(x=>/hoãn|chờ|delay/i.test(String(x.status)+' '+String(x.priority))).length;
    let estimatedInterest=0;
    w.forEach(x=>{const price=+x.price||0, rate=(+x.rate||0)/100; if(price>0&&rate>0){estimatedInterest+=price*rate*12;}});
    const p=profile(), income=+p.income||0, liquid=+p.liquidAssets||0;
    let runway=0;try{const b=typeof baseline==='function'?baseline(p):null;runway=+b?.runway||0}catch{}
    const riskEvents=hm.filter(x=>/risk|rủi ro|blocked|caution|thận trọng/i.test(String(x.detail))).length;
    const safeEvents=hm.filter(x=>/safe|an toàn|tốt|đã hoãn|hoãn/i.test(String(x.detail))).length;
    const safeRatio=(safeEvents+riskEvents)?safeEvents/(safeEvents+riskEvents):.65;
    let persona=safeRatio>=.72?{emoji:'🧊',name:'Kẻ Giữ Vùng Đệm',desc:'Bạn có xu hướng bảo vệ dòng tiền và quỹ dự phòng trước khi xuống tiền.'}:safeRatio>=.48?{emoji:'🧭',name:'Người Cân Bằng',desc:'Bạn thường cân trade-off trước khi quyết định thay vì chỉ nhìn vào giá mua.'}:{emoji:'⚡',name:'Kẻ Săn Cơ Hội',desc:'Bạn sẵn sàng chấp nhận trade-off để sở hữu thứ mình muốn sớm hơn.'};
    return {h,hm,decisions,tracked,delayed,estimatedInterest,income,liquid,runway,riskEvents,safeEvents,safeRatio,persona};
  }
  function open(){
    let root=document.getElementById('df-wrapped');if(!root){root=document.createElement('div');root.id='df-wrapped';root.className='df-wrapped-overlay';document.body.appendChild(root)}
    const s=stats(); let i=0;
    const monthLabel=new Intl.DateTimeFormat('vi-VN',{month:'long'}).format(new Date());
    const count=Math.max(s.decisions.length,s.tracked,1);
    const slides=[
      `<div class="df-wrapped-slide"><span class="df-wrapped-kicker">DeciFin Wrapped · ${esc(monthLabel)}</span><h1 class="df-wrapped-title">Tháng này, bạn đã suy nghĩ trước khi xuống tiền.</h1><p class="df-wrapped-copy">DeciFin gom lại những quyết định và tín hiệu hành vi mà bạn đã tạo ra trong tháng.</p><div class="df-wrapped-statgrid"><div class="df-wrapped-stat"><span>Quyết định / mô phỏng</span><b>${count}</b></div><div class="df-wrapped-stat"><span>Đang theo dõi</span><b>${s.tracked}</b></div></div><p class="df-wrapped-hint">Chạm bên phải để xem tiếp · bên trái để quay lại</p></div>`,
      `<div class="df-wrapped-slide"><span class="df-wrapped-kicker">Điểm cộng lớn nhất</span><h1 class="df-wrapped-title">Bạn đã tạo khoảng cách giữa “muốn” và “mua”.</h1><div class="df-wrapped-number">${s.delayed}<span class="df-wrapped-unit">quyết định được giữ lại</span></div><p class="df-wrapped-copy">Thay vì chỉ nhìn giá món đồ, DeciFin giúp bạn nhìn cả runway, nghĩa vụ nợ và tác động tới mục tiêu.</p><div class="df-wrapped-insight"><strong>💡 Tiền lãi ước tính đã tránh</strong><p>${moneySafe(s.estimatedInterest)} nếu các món đang theo dõi được mua theo kịch bản trả góp mô phỏng. Đây là ước tính theo giả định hiện tại, không phải khoản tiền thực tế đã tiết kiệm.</p></div></div>`,
      `<div class="df-wrapped-slide"><span class="df-wrapped-kicker">DeciFin đang học</span><h1 class="df-wrapped-title">Phong cách ra quyết định của bạn là...</h1><div class="df-wrapped-pill">${s.persona.emoji} Behavioral pattern</div><div class="df-wrapped-insight"><strong>${esc(s.persona.name)}</strong><p>${esc(s.persona.desc)}</p></div><p class="df-wrapped-copy">Từ các lựa chọn đã ghi nhận, hệ thống có thể dùng tín hiệu này để điều chỉnh cách giải thích và nội dung học phù hợp hơn.</p></div>`,
      `<div class="df-wrapped-slide df-wrapped-slide--whatif"><span class="df-wrapped-kicker">05 · WHAT-IF HISTORY</span><div class="df-wrapped-lightning">⚡</div><h1 class="df-wrapped-title">Sự thật mất lòng.</h1><p class="df-wrapped-copy">Nếu tháng trước bạn chọn vay mua trả góp một món đồ 20 triệu thay vì kiềm chế, hôm nay Quỹ dự phòng của bạn đã thủng đáy an toàn.</p><div class="df-wrapped-risk-callout"><strong>Đây là một kịch bản giả định.</strong><span>DeciFin dùng nó để giúp bạn nhìn thấy trade-off trước khi quyết định, không phải để phán xét lựa chọn cũ.</span></div></div>`,
      `<div class="df-wrapped-slide"><span class="df-wrapped-kicker">Your financial card</span><div class="df-wrapped-persona" id="df-wrapped-persona"><div class="emoji">${s.persona.emoji}</div><h2>${esc(s.persona.name)}</h2><p>DeciFin · ${esc(monthLabel)} · ${Math.round(s.safeRatio*100)}% tín hiệu an toàn trong dữ liệu tháng</p></div><p class="df-wrapped-copy">Tháng tới, hãy tiếp tục mô phỏng trước. Hồ sơ hành vi sẽ ngày càng hữu ích khi bạn có thêm quyết định.</p></div>`
    ];
    function render(){root.innerHTML=`<div class="df-wrapped-bg"></div><div class="df-wrapped-shell"><div class="df-wrapped-top">${slides.map((_,n)=>`<span class="df-wrapped-seg ${n<=i?'active':''}"><i></i></span>`).join('')}</div><div class="df-wrapped-head"><span>✨ DECIFIN WRAPPED</span><button class="df-wrapped-close" aria-label="Đóng">×</button></div><div class="df-wrapped-card">${slides[i]}</div><div class="df-wrapped-nav"><button data-prev aria-label="Trang trước"></button><button data-next aria-label="Trang tiếp"></button></div><div class="df-wrapped-actions"><button class="df-wrapped-action" data-close>Đóng</button>${i===slides.length-1?'<button class="df-wrapped-action primary" data-share>↗ Khoe thẻ</button>':''}</div></div>`;const card=root.querySelector('#df-wrapped-persona');if(card){card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(800px) rotateX(${y*-7}deg) rotateY(${x*9}deg)`});card.addEventListener('pointerleave',()=>card.style.transform='perspective(800px) rotateX(0) rotateY(0)')}}
    function close(){root.classList.remove('open');document.body.style.overflow='';sessionStorage.setItem(OPENKEY,'1')}

    root.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)};

    async function share(){const text=`DeciFin Wrapped: ${s.persona.name} · ${Math.round(s.safeRatio*100)}% tín hiệu an toàn trong dữ liệu tháng.`;try{if(navigator.share)await navigator.share({title:'DeciFin Wrapped',text});else await navigator.clipboard?.writeText(text);if(typeof window.toast==='function')window.toast('Đã sẵn sàng để chia sẻ.')}catch{}}

  function inject(){
    if(document.getElementById('df-wrapped-launch'))return;

  }
  window.DecifinWrapped={open,stats};
  const obs=new MutationObserver(()=>inject());obs.observe(document.documentElement,{childList:true,subtree:true});setTimeout(inject,900);
})();

(function(){
  function bootJourneyEvents(){
    const root=document.querySelector('#app') || document.body;
    if(!root || root.dataset.dfjBound==='1') return;
    root.dataset.dfjBound='1';
    root.addEventListener('click',function(e){
      const filter=e.target.closest('[data-journey-filter]');
      if(filter){
        if(typeof update==='function') update({journeyFilter:filter.dataset.journeyFilter,view:'journey'});
        return;
      }
      const day=e.target.closest('[data-journey-day]');
      if(day){
        const key=day.dataset.journeyDay;
        try{
          const h=JSON.parse(localStorage.getItem('decifin.history.v1')||'[]');
          const items=h.filter(x=>new Date(x.at).toISOString().slice(0,10)===key);
          if(items.length && typeof update==='function'){
            update({notice:`${new Date(key+'T00:00:00').toLocaleDateString('vi-VN')}: ${items.length} hoạt động trong Journey.`});
          }
        }catch{}
      }
    });
  }
  document.addEventListener('DOMContentLoaded',bootJourneyEvents);
  setTimeout(bootJourneyEvents,500);
})();

<script id="decifin-personalization-boot">
(function(){
  'use strict';
  const FOCUS_KEY='decifin.focusMode.v1';
  function readFocus(){try{return localStorage.getItem(FOCUS_KEY)==='1'}catch{return false}}
  function syncFocus(next){
    window.__decifinFocus=!!next;
    document.body.classList.toggle('df-focus-active',window.__decifinFocus);
    document.body.setAttribute('data-focus-mode',window.__decifinFocus?'on':'off');
    try{localStorage.setItem(FOCUS_KEY,window.__decifinFocus?'1':'0')}catch{}
    document.querySelectorAll('[data-action="focus-toggle"]').forEach(toggle=>{
      toggle.setAttribute('aria-pressed',window.__decifinFocus?'true':'false');
      toggle.setAttribute('aria-label',window.__decifinFocus?'Tắt Chế độ tập trung':'Bật Chế độ tập trung');
      if(toggle.classList.contains('df-focus-toggle')) toggle.title=window.__decifinFocus?'Tắt Chế độ tập trung':'Bật Chế độ tập trung';
    });
  }
  window.__decifinFocus=readFocus();
  syncFocus(window.__decifinFocus);
  window.__decifinApplyFocus=syncFocus;
  const oldUpdate=window.update;
  if(typeof oldUpdate==='function'){
    window.update=function(patch){
      if(Object.prototype.hasOwnProperty.call(patch||{},'focusMode')) syncFocus(!!patch.focusMode);
      return oldUpdate.apply(this,arguments);
    };
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncFocus(readFocus())});
})();
</script>

<script id="decifin-milestone-engine">
(function(){
  'use strict';
  const SNAP='DECIFIN_MILESTONE_SNAPSHOT_V1', SEEN='DECIFIN_MILESTONE_SEEN_V1';
  const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch{return f}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
  function metrics(){
    try{
      const p=typeof profile==='function'?profile():null;
      if(!p)return null;
      const b=typeof baseline==='function'?baseline(p):{};
      return {surplus:+b.surplus||0,runway:+b.runway||0,dti:+b.dti||0};
    }catch{return null}
  }
  function celebrate(title,text){
    const old=document.querySelector('.df-milestone-toast');if(old)old.remove();
    const toast=document.createElement('div');toast.className='df-milestone-toast';toast.innerHTML=`<b>🎉 ${title}</b><span>${text}</span>`;document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),5000);
    const layer=document.createElement('div');layer.className='df-confetti';
    for(let i=0;i<36;i++){const bit=document.createElement('i');bit.style.left=(Math.random()*100)+'%';bit.style.background=['#6256D9','#7ED6C3','#A89BFF','#F4C95D','#fff'][i%5];bit.style.setProperty('--x',((Math.random()-.5)*220)+'px');bit.style.animationDelay=(Math.random()*.35)+'s';layer.appendChild(bit)}
    document.body.appendChild(layer);setTimeout(()=>layer.remove(),2200);
  }
  function check(){
    const m=metrics();if(!m)return;
    const prev=read(SNAP,null);const seen=read(SEEN,{});
    if(prev){
      if(prev.surplus<5000000 && m.surplus>=5000000 && !seen.surplus5){
        celebrate('Dòng tiền đã vượt 5 triệu/tháng!',`Bạn vừa chạm một cột mốc quan trọng. Hãy cân nhắc chuyển một phần khoản dư này vào quỹ dự phòng hoặc mục tiêu dài hạn.`);seen.surplus5=true;
      }
      if(prev.runway<3 && m.runway>=3 && !seen.runway3){
        celebrate('Quỹ dự phòng đã đạt 3 tháng!',`Bạn vừa bước qua vùng an toàn cơ bản. Đây là nền tảng tốt để đưa ra các quyết định lớn có kiểm soát hơn.`);seen.runway3=true;
      }
      if(prev.runway<6 && m.runway>=6 && !seen.runway6){
        celebrate('Bạn đã có lớp đệm 6 tháng!',`Khả năng chống chịu tài chính đang mạnh lên rõ rệt. DeciFin sẽ ưu tiên cho bạn những bước tăng trưởng bền vững hơn.`);seen.runway6=true;
      }
    }
    write(SNAP,m);write(SEEN,seen);
  }
  let timer=0;const schedule=()=>{clearTimeout(timer);timer=setTimeout(check,700)};
  const obs=new MutationObserver(schedule);obs.observe(document.body,{childList:true,subtree:true});
  setTimeout(check,1200);window.addEventListener('storage',schedule);
})();
</script>
<script id="decifin-decision-center-upgrade">
(function(){
  'use strict';
  const KEY='DECIFIN_FOCUS_STATE';
  const JOURNAL='DECIFIN_DECISION_JOURNAL';
  const esc=x=>String(x??'').replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
  const num=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
  const clamp=(v,min,max)=>Math.min(max,Math.max(min,num(v,min)));
  const money=n=>{n=Math.max(0,num(n));return n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'tr':n>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n)+'đ'};
  function getP(){try{return typeof profile==='function'?profile():null}catch(e){return null}}
  function getB(p){try{return typeof getBase==='function'?getBase(p)||{}:{} }catch(e){return {}}}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?x:null}catch(e){return null}}
  function save(s){try{localStorage.setItem(KEY,JSON.stringify({...s,lastActivity:Date.now()}))}catch(e){}}
  function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
  function profileMetrics(){
    const p=getP()||{}, b=getB(p);
    const income=Math.max(0,num(p.income,15000000));
    // b.expense/b.savings không tồn tại (baseline() chỉ trả debtPayments/minimumSpend/surplus/
    // savingsRate/dti/runway) và p.expense/p.savings cũng không phải tên field thật của hồ sơ
    // (đúng là p.essential+p.discretionary và p.liquidAssets) — nên trước đây 2 giá trị này
    // LUÔN LUÔN rơi về số mặc định cứng, không bao giờ đổi theo hồ sơ thật.
    const expense=Math.max(0,num(p.essential,0)+num(p.discretionary,0)) || 7000000;
    const savings=Math.max(0,num(p.liquidAssets,18000000));
    const dti=clamp(num(b.dti,0.12),0,2);
    const surplus=Math.max(0,num(b.surplus,income-expense));
    return {income,expense,savings,dti,surplus};
  }
  function calc(state){
    const m=profileMetrics();
    const price=Math.max(0,num(state.price,35000000));
    const down=clamp(state.down,0,100);
    const months=Math.max(3,Math.round(num(state.months,12)/3)*3);
    const downPay=price*down/100;
    const financed=Math.max(0,price-downPay);
    const monthly=financed/months;
    const after=Math.max(0,m.savings-downPay);
    const newDti=clamp(m.dti+(monthly/Math.max(1,m.income)),0,2);
    const runway=after/Math.max(1,m.expense);

    // Liquidity should reflect BOTH the emergency reserve and monthly cashflow.
    // This avoids showing a low liquidity score when the user pays 100% upfront
    // but still has healthy monthly surplus.
    const reserveScore=clamp((runway/6)*100,0,100);
    const cashflowAfter=Math.max(0,m.surplus-monthly);
    const cashflowScore=clamp((cashflowAfter/Math.max(1,m.income))*100,0,100);
    const liquidityPct=Math.round(reserveScore*0.6+cashflowScore*0.4);
    const safetyPct=clamp((runway/6)*100,0,100);

    const goalDelay=monthly>m.surplus&&m.surplus>0
      ? Math.ceil(((monthly-m.surplus)*months)/Math.max(1,m.surplus))
      : (downPay>m.surplus&&m.surplus>0 ? Math.ceil((downPay-m.surplus)/Math.max(1,m.surplus)) : 0);

    const risk=newDti>0.4||runway<3||monthly>m.surplus?'warn':newDti>0.3||runway<6?'caution':'safe';
    const primaryIssue=runway<3?'reserve':monthly>m.surplus?'cashflow':newDti>0.4?'debt':runway<6?'reserve':'none';
    return {...m,price,down,months,downPay,financed,monthly,after,newDti,runway,liquidityPct,safetyPct,goalDelay,risk,primaryIssue};
  }
  function openFocus(scenario,forceNew=false){
    let state=load();

    } else { state.step=clamp(state.step,1,3); state.price=Math.max(1000000,num(state.price,35000000)); state.down=clamp(state.down,0,100); state.months=Math.max(3,Math.round(num(state.months,12)/3)*3); }

  function closeFocus(){const el=document.querySelector('#df-decision-focus');if(el)el.classList.remove('open');document.body.style.overflow='';}
  function finishFocus(){clear();closeFocus();if(typeof notify==='function')notify('Đã hoàn tất phiên Decision Focus 🎯');else if(typeof toast==='function')toast('Đã hoàn tất phiên Decision Focus 🎯')}

        </div>

        <div class="df-du-actions"><button type="button" class="btn" data-focus-next>Tiếp tục →</button></div>
      </section>

          <div class="df-du-question" style="margin-top:12px"><b data-live-insight>${c.primaryIssue==='reserve'?'⚠️ Vấn đề lớn nhất là quỹ dự phòng.':c.primaryIssue==='cashflow'?'⚠️ Vấn đề lớn nhất là khả năng chịu đựng dòng tiền.':c.primaryIssue==='debt'?'⚠️ Vấn đề lớn nhất là áp lực nợ.':'🟢 Phương án hiện tại giữ được lớp đệm tương đối.'}</b><div class="df-du-muted" style="margin-top:5px">DeciFin không quyết định thay bạn — nó làm rõ trade-off.</div></div>
        </div>
        <div class="df-du-actions"><button type="button" class="btn btn--ghost" data-focus-back>← Quay lại</button><button type="button" class="btn" data-focus-next>So sánh 3 tương lai →</button></div>
      </section>
      <section class="df-du-focus-step ${state.step===3?'active':''}" data-step="3">

  function updateSimulation(el,state){

  }
  function bind(el,state){
    el.querySelectorAll('[data-focus-scenario]').forEach(x=>x.addEventListener('click',()=>{state.scenario=x.dataset.focusScenario;save(state);render(el,state)}));

      const step=Number(btn.closest('.df-du-focus-step')?.dataset.step||state.step);

  function inject(){

function simulateFinancialScenario(decision,state){state=state||{};const p=state.profile||profile()||{};const b=baseOf(p);const price=Math.max(0,num(decision?.price));const down=Math.max(0,Math.min(price,num(decision?.downPayment)));const months=Math.max(1,Math.round(num(decision?.months,12)));const flat=Math.max(0,num(decision?.flatRate,.01)/100);const financed=Math.max(0,price-down);let installment=months?financed/months+financed*flat:0;try{if(typeof window.flatRatePayment==='function')installment=window.flatRatePayment(financed,months,flat)}catch{}const interest=Math.max(0,installment*months-financed);const buySurplus=b.surplus-price;const delayMonths=Math.max(.5,num(decision?.delayMonths,1));const delaySurplus=b.surplus;const goal=goalsOf(p)[0];const goalMonthly=goal&&b.surplus>0?b.surplus*(num(goal.allocWeight,.6)):0;const goalDelay=goal&&goalMonthly>0?Math.max(0,Math.ceil((installment/goalMonthly)*delayMonths)):null;const afterInstallment=b.surplus-installment;const dtiInstall=num(p.income)>0?b.dti+installment/num(p.income):null;const runwayInstall=b.minimumSpend>0?Math.max(0,(num(p.liquidAssets)-down)/b.minimumSpend):null;const waitMonths=b.surplus>0?Math.ceil(Math.max(0,price)/b.surplus):null;return{now:{surplus:b.surplus,runway:Number.isFinite(b.runway)?b.runway:null,dti:b.dti,goalDelay:0,interest:0},buy:{surplus:buySurplus,runway:b.minimumSpend>0?Math.max(0,(num(p.liquidAssets)-price)/b.minimumSpend):null,dti:b.dti,goalDelay:null,interest:0},installment:{surplus:afterInstallment,runway:runwayInstall,dti:dtiInstall,goalDelay,interest},delay:{surplus:delaySurplus,runway:Number.isFinite(b.runway)?b.runway:null,dti:b.dti,goalDelay:0,interest:0,waitMonths},price,down,months,installment,interest};}
function explainDecision(decision,state){const p=state?.profile||profile();if(!p||!num(p.income))return{recommendation:'Cần thêm dữ liệu',confidence:35,reasons:['DeciFin chưa có đủ dữ liệu thu nhập để mô phỏng đáng tin cậy.'],positiveEffects:[],negativeEffects:[],alternative:'Hoàn thiện hồ sơ',dataUsed:[]};const b=baseOf(p),sim=simulateFinancialScenario(decision,state),reasons=[];if(b.dti>.4)reasons.push(`DTI hiện ở ${Math.round(b.dti*100)}%, nên tránh tạo thêm nghĩa vụ nợ.`);if(b.runway<3)reasons.push(`Quỹ dự phòng chỉ khoảng ${Number.isFinite(b.runway)?b.runway.toFixed(1):'0.0'} tháng, thấp hơn vùng đệm thận trọng.`);if(sim.buy.surplus<b.surplus)reasons.push(`Mua ngay làm dòng tiền dư giảm ${money(Math.max(0,b.surplus-sim.buy.surplus))}/tháng.`);if(sim.installment.dti!=null&&sim.installment.dti>.4)reasons.push(`Phương án trả góp có thể đưa DTI lên khoảng ${Math.round(sim.installment.dti*100)}%.`);if(sim.installment.goalDelay>0)reasons.push(`Mục tiêu ưu tiên có thể chậm khoảng ${sim.installment.goalDelay} tháng.`);if(!reasons.length)reasons.push(`Dòng tiền dư ${money(b.surplus)}/tháng và quỹ dự phòng ${Number.isFinite(b.runway)?b.runway.toFixed(1):'—'} tháng đang tạo vùng đệm tương đối tốt.`);let recommendation='Mua có kiểm soát';if(b.dti>.4||b.runway<3||sim.buy.surplus<0)recommendation='Ưu tiên trì hoãn';else if(sim.installment.dti!=null&&sim.installment.dti>.3)recommendation='Ưu tiên trả thẳng hoặc trì hoãn';const confidence=Math.max(45,Math.min(96,60+Math.round((reasons.length>=2?18:10)+getDigitalTwin(p).completeness*18)));return{recommendation,confidence,reasons:reasons.slice(0,3),positiveEffects:recommendation==='Ưu tiên trì hoãn'?['Giữ nguyên vùng đệm hiện tại','Không phát sinh lãi mới']:['Giữ được mục tiêu nếu chi phí nằm trong surplus'],negativeEffects:recommendation==='Ưu tiên trì hoãn'?['Mất cơ hội sử dụng món đồ ngay']:['Surplus sẽ giảm nếu mua ngay'],alternative:recommendation==='Ưu tiên trì hoãn'?'Tiết kiệm đủ rồi mua':'Mua nhưng giữ trần chi tiêu theo surplus',dataUsed:[['Thu nhập',money(p.income)],['Dòng tiền dư',money(b.surplus)],['DTI',`${Math.round(b.dti*100)}%`],['Runway',Number.isFinite(b.runway)?`${b.runway.toFixed(1)} tháng`:'Không xác định'],['Mục tiêu',goalsOf(p)[0]?.name||'Chưa có']]};}
function getNextBestAction(p){p=p||profile()||{};const b=baseOf(p),g=goalsOf(p)[0];let action='Duy trì nhịp tài chính hiện tại',priority=30,reason='Các chỉ số hiện tại chưa cho thấy một nút thắt lớn.',impact='Bảo toàn vùng an toàn và tiến độ mục tiêu.';if(b.surplus<=0){action='Đưa dòng tiền về dương';priority=100;reason='Chi phí và nghĩa vụ hiện tại đang ăn hết hoặc vượt thu nhập.';impact='Khôi phục khả năng tích lũy trước khi mở thêm quyết định mới.'}else if(b.runway<3){action='Tăng quỹ dự phòng lên ít nhất 3 tháng';priority=95;reason=`Runway hiện chỉ ${Number.isFinite(b.runway)?b.runway.toFixed(1):'0.0'} tháng.`;impact='Tăng lớp đệm trước các biến cố bất ngờ.'}else if(b.dti>.4){action='Giảm nghĩa vụ nợ mới';priority=92;reason=`DTI đang ở ${Math.round(b.dti*100)}%, cao hơn ngưỡng cảnh báo nội bộ.`;impact='Giảm áp lực dòng tiền và rủi ro thanh khoản.'}else if(g&&num(g.target)>num(g.saved)){action=`Đẩy nhanh mục tiêu “${g.name||'mục tiêu ưu tiên'}”`;priority=72;reason=`Mục tiêu đã đạt ${Math.round(Math.min(1,num(g.saved)/num(g.target))*100)}% và còn ${money(Math.max(0,num(g.target)-num(g.saved)))}.`;impact='Rút ngắn thời gian hoàn thành mục tiêu mà vẫn giữ vùng an toàn.'}else if(b.surplus>0){action='Tự động hóa một phần tiền dư';priority=58;reason=`Bạn đang có ${money(b.surplus)} dòng tiền dư mỗi tháng.`;impact='Chuyển surplus thành tiến độ mục tiêu thay vì để tiền trôi vào chi tiêu.'}return{action,priority,reason,expectedImpact:impact,confidence:Math.min(95,60+Math.round(priority/6))};}
function reliabilityScore(p){p=p||profile()||{};const b=baseOf(p);const components={cashflow:b.surplus>0?Math.min(100,60+b.savingsRate*200):Math.max(0,40+b.savingsRate*100),liquidity:Number.isFinite(b.runway)?Math.min(100,b.runway/6*100):80,debt:Math.max(0,100-Math.min(100,b.dti*180)),stability:p.incomeStability==='stable'?85:55,savingsConsistency:Array.isArray(p.savingsHistory)&&p.savingsHistory.length?Math.min(100,50+p.savingsHistory.length*8):50};const score=Math.round(Object.values(components).reduce((a,v)=>a+v,0)/Object.keys(components).length);const confidence=Array.isArray(p.savingsHistory)&&p.savingsHistory.length>=3?86:58;safeWrite(KEY.risk,{score,components,confidence,updatedAt:new Date().toISOString(),disclaimer:'Chỉ số độ tin cậy tài chính mô phỏng, không phải điểm tín dụng chính thức.'});return{score,components,confidence,disclaimer:'Chỉ số độ tin cậy tài chính mô phỏng, không phải điểm tín dụng chính thức.'};}
