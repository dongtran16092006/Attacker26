<style id="decifin-ui-correction">
/* Final visual pass: keep dark mode neutral and prevent wide cards from
   competing with the primary content column. */
:root[data-theme="dark"]{
  --paper:#0b1020;--surface:#131a2e;--surface-sunken:#0f1628;
  --ink:#f3f5ff;--ink-soft:#c0c7dc;--muted:#929bb5;
  --line:#27324d;--line-strong:#3b496b;
  --safe:#63d39a;--safe-bg:#122a25;--caution:#f0bd63;--caution-bg:#302614;
  --risk:#ff8585;--risk-bg:#351d28;
  --shadow-ambient:0 14px 36px rgba(0,0,0,.22);
}
:root[data-theme="dark"] body{background:var(--paper);color:var(--ink)}
:root[data-theme="dark"] .shell-card,
:root[data-theme="dark"] .panel,
:root[data-theme="dark"] .df-card,
:root[data-theme="dark"] .df-v6-wish-card,
:root[data-theme="dark"] .df-v6-hero-visual{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-ambient)}
:root[data-theme="dark"] input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea{background:var(--surface-sunken);color:var(--ink);border-color:var(--line-strong)}
:root[data-theme="dark"] .df-v6-hero{background:linear-gradient(135deg,#131a2e,#18213b);border-color:var(--line)}
:root[data-theme="dark"] .df-v6-hero h1 em,
:root[data-theme="dark"] .df-v6-kicker,
:root[data-theme="dark"] .eyebrow{color:#a99dff!important}
:root[data-theme="dark"] .df-side-link:hover,
:root[data-theme="dark"] .df-side-theme:hover,
:root[data-theme="dark"] .df-sidebar-login:hover{background:#1c2741;color:var(--ink)}

/* Stable page rhythm on desktop. */
.shell{width:100%;box-sizing:border-box}
main>.shell{max-width:1180px}
.view,.df-v6-page{min-width:0}
.df-v6-page{padding-inline:0}
.df-v6-hero{min-width:0}
.df-v6-card-top,.df-health-section-title,.df-section-head{min-width:0}
.df-v6-card-top>*{min-width:0}
@media (min-width:901px){
  main>.shell{padding-inline:32px}
  .df-sidebar-shell~main .shell{max-width:1180px}
}
@media (max-width:900px){
  main>.shell{padding-inline:18px}
  .df-v6-page{padding-top:8px}
  .df-v6-hero{padding:24px!important;border-radius:22px!important}
  .df-v6-hero h1{font-size:clamp(30px,8vw,44px);line-height:1.05}
  .df-v6-how{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  main>.shell{padding-inline:14px}
  .df-v6-hero{padding:20px!important}
  .df-v6-how{grid-template-columns:1fr}
  .df-v6-card-top{gap:9px}
  .df-v6-metrics{grid-template-columns:1fr 1fr}
  .df-v6-dialog{border-radius:18px}
}
</style>

.df-auth::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}

.df-auth__right{align-items:flex-start!important;overflow-y:auto!important;padding-top:clamp(42px,8vh,90px)!important;padding-bottom:48px!important}
@media(max-width:900px){.df-auth__hero{padding-top:36px!important}.df-auth__right{padding-top:36px!important}}

/* Keep one page scrollbar for auth; the two columns must not scroll independently. */
.df-auth{
  overflow-x:hidden!important;
  overflow-y:auto!important;
  scrollbar-width:thin!important;

}
.df-auth::-webkit-scrollbar{width:10px!important;height:10px!important;display:block!important}

</style>

.df-demo-account{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:14px;background:var(--surface-sunken);font-size:12px}
.df-demo-account div{display:grid;gap:3px}.df-demo-account strong{color:var(--ink)}.df-demo-account span{color:var(--muted)}.df-demo-account b{color:var(--ink);font-weight:800}.df-demo-account button{white-space:nowrap}
@media(max-width:480px){.df-demo-account{align-items:flex-start;flex-direction:column}.df-demo-account button{align-self:flex-end}}

<style>
/* =============================================================================
   DeciFin - hệ thiết kế
   Nguyên tắc màu: màu CHỈ dùng để mang nghĩa trạng thái tài chính. Mọi thành
   phần tương tác đều dùng sắc mực. Nhờ vậy khi người dùng thấy màu trên màn
   hình, họ biết ngay đó là tín hiệu chứ không phải trang trí.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

:root {
  --paper: #faf9f6;
  --surface: #ffffff;
  --surface-sunken: #f2f0ea;
  --ink: #16171a;
  --ink-soft: #43464d;
  --muted: #6e7078;
  --line: #e6e3dc;
  --line-strong: #d5d1c7;

  --safe: #1b7a4c;
  --safe-bg: #eaf5ee;
  --caution: #9a6400;
  --caution-bg: #fdf3e2;
  --risk: #ae2e24;
  --risk-bg: #fbeceb;

  --r-shell: 20px;
  --r-core: 14px;
  --r-control: 10px;

  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.42, 0.64, 1);

  --shadow-ambient: 0 1px 2px rgba(22, 23, 26, 0.04), 0 8px 24px -12px rgba(22, 23, 26, 0.14);
  --shadow-lift: 0 2px 4px rgba(22, 23, 26, 0.05), 0 18px 40px -18px rgba(22, 23, 26, 0.22);

  --font: 'Be Vietnam Pro', ui-sans-serif, 'Segoe UI', system-ui, sans-serif;
  --font-figure: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', monospace;

  --page: 1120px;
}

[data-theme='dark'] {
  --paper: #111215;
  --surface: #181a1e;
  --surface-sunken: #101215;
  --ink: #eceae5;
  --ink-soft: #b9b7b1;
  --muted: #8b8d94;
  --line: #2a2d33;
  --line-strong: #3a3e46;

  --safe: #5cc98c;
  --safe-bg: #14251c;
  --caution: #e0a23c;
  --caution-bg: #2a2013;
  --risk: #f08079;
  --risk-bg: #2c1614;

  --shadow-ambient: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 18px 40px -18px rgba(0, 0, 0, 0.6);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 1.2rem + 2.6vw, 2.9rem); letter-spacing: -0.035em; }
h2 { font-size: clamp(1.3rem, 1rem + 1.1vw, 1.7rem); letter-spacing: -0.028em; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }

.figure {
  font-family: var(--font-figure);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

/* ---------- bố cục ---------- */
.shell { max-width: var(--page); margin: 0 auto; padding: 0 20px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  border-bottom: 1px solid var(--line);
}
.topbar__inner { display: flex; align-items: center; gap: 18px; height: 62px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -0.03em; font-size: 1.05rem; }
.brand__mark {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.topbar__spacer { flex: 1; }

.steps { display: flex; gap: 3px; align-items: center; }
.steps__item {
  font-size: 12.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px;
  border: 0; background: none; font: inherit; font-size: 12.5px;
  transition: color 0.3s var(--ease), background 0.3s var(--ease);
}
.steps__item[data-reachable='true'] { cursor: pointer; }
.steps__item[data-reachable='true']:hover { color: var(--ink); background: var(--surface-sunken); }
.steps__item:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.steps__item[aria-current='step'] { color: var(--ink); background: var(--surface-sunken); font-weight: 500; }
.steps__item[disabled] { cursor: default; opacity: 0.55; }

/* Trên điện thoại thanh bước bị ẩn, nên thay bằng một vạch tiến trình mảnh
   chạy hết bề ngang. Vẫn thấy mình đang ở đâu mà không tốn chiều cao. */
.steps__rail { display: none; height: 2px; background: var(--line); position: relative; }
.steps__rail::after {
  content: ''; position: absolute; inset: 0 auto 0 0; border-radius: 999px;
  width: var(--at, 0%); background: var(--ink);
  transition: width 0.65s var(--ease);
}
@media (max-width: 720px) {
  .steps { display: none; }
  .steps__rail { display: block; }
}

main { padding: 40px 0 88px; }
.stack > * + * { margin-top: 22px; }

/* Bỏ qua phần điều hướng, cho người dùng bàn phím. Chỉ hiện khi được focus. */
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 40;
  padding: 10px 16px; border-radius: var(--r-control);
  background: var(--ink); color: var(--paper); text-decoration: none;
  transition: top 0.25s var(--ease);
}
.skip:focus { top: 12px; }

/* ---------- vỏ lồng: khung ngoài mềm, lõi trong sắc ---------- */
.shell-card {
  background: var(--surface-sunken);
  border: 1px solid var(--line);
  border-radius: var(--r-shell);
  padding: 6px;
}
.shell-card__core {
  background: var(--surface);
  border-radius: var(--r-core);
  padding: 22px;
  box-shadow: var(--shadow-ambient);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-core);
  padding: 22px;
}

/* Thẻ bấm được: hồ sơ mẫu và bốn nhóm quyết định. Trước đây chúng có
   cursor:pointer nhưng không có trạng thái nào khi rê chuột, nên trông như
   chữ chết. Nhấc nhẹ và đẩy mũi tên là đủ để tay biết đây là thứ bấm được. */
.panel--action {
  text-align: left; cursor: pointer; width: 100%;
  transition: transform 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.panel--action:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-ambient); }
.panel--action:active { transform: translateY(0) scale(0.994); }
.panel--action:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.panel--action .go { display: inline-block; transition: transform 0.35s var(--ease); }
.panel--action:hover .go { transform: translateX(3px); }

.eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--muted); font-weight: 500;
}
.lede { color: var(--ink-soft); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- điều khiển ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 18px; border-radius: 999px;
  border: 1px solid transparent; background: var(--ink); color: var(--paper);
  font-weight: 500; font-size: 14.5px; cursor: pointer;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.3s var(--ease);
  box-shadow: var(--shadow-ambient);
}
.btn:hover { box-shadow: var(--shadow-lift); }
.btn:active { transform: scale(0.978); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn[disabled] { opacity: 0.42; cursor: not-allowed; box-shadow: none; }

/* nút phụ dùng nền giấy, viền mảnh */
.btn--ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: none; }
.btn--ghost:hover { background: var(--surface-sunken); box-shadow: none; }

/* vòng tròn lồng trong nút, dịch chéo khi rê chuột */
.btn__pip {
  width: 26px; height: 26px; border-radius: 999px; flex: none;
  display: grid; place-items: center; font-size: 13px; line-height: 1;
  background: color-mix(in srgb, var(--paper) 22%, transparent);
  transition: transform 0.45s var(--ease);
}
.btn--ghost .btn__pip { background: var(--surface-sunken); }
.btn:hover .btn__pip { transform: translate(2px, -1px); }

.field { display: grid; gap: 6px; }
.field > label { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.field .hint { font-size: 12px; color: var(--muted); }
.input {
  width: 100%; padding: 10px 13px;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-control); font-family: var(--font-figure);
  font-variant-numeric: tabular-nums;
  transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.input:focus {
  outline: none; border-color: var(--ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent);
}
.input--text { font-family: var(--font); }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
@media (max-width: 560px) {
  .spread { flex-direction: column; align-items: flex-start; }
  .row--end { justify-content: stretch; }
  .row--end .btn { flex: 1; justify-content: center; }
}

/* ---------- vạch tiến trình của biểu mẫu bốn bước ---------- */
.progress { height: 3px; border-radius: 999px; background: var(--surface-sunken); overflow: hidden; }
.progress__bar {
  display: block; height: 100%; border-radius: inherit; background: var(--ink);
  width: var(--at, 0%); transition: width 0.65s var(--ease);
}

/* ---------- dải đo điểm an toàn ---------- */
.meter { height: 4px; border-radius: 999px; background: var(--surface-sunken); overflow: hidden; margin-top: 7px; }
.meter__fill {
  display: block; height: 100%; border-radius: inherit; background: currentColor;
  transform: scaleX(var(--at, 0)); transform-origin: 0 50%;
  animation: fill 0.85s var(--ease) 0.15s both;
}

/* ---------- báo lỗi ngay trong trang ---------- */
/* Thay cho window.alert: hộp thoại của trình duyệt cắt ngang mạch làm việc,
   không theo được hệ màu, và trên điện thoại thì che mất chỗ vừa sai. */
.notice {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 13px 15px; border-radius: var(--r-core);
  background: var(--risk-bg); color: var(--risk);
  border: 1px solid color-mix(in srgb, var(--risk) 26%, transparent);
  animation: rise 0.4s var(--ease-out) both;
}
.notice__mark { flex: none; font-weight: 700; line-height: 1.5; }
.notice ul { margin: 0; padding-left: 18px; }
.notice li + li { margin-top: 3px; }
.notice--ask { background: var(--caution-bg); color: var(--caution); border-color: color-mix(in srgb, var(--caution) 30%, transparent); }

/* ---------- thẻ chỉ số ---------- */
.metrics { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .metrics { grid-template-columns: 1fr; } }

.metric {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-core);
  padding: 16px 17px 16px 20px;
}
/* Đèn giao thông đọc được bằng liếc mắt. Trước đây chỉ có chữ số đổi màu, mà
   chữ số thì phải đọc mới biết. Vạch dọc bên trái thấy ngay từ xa. */
.metric::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--line-strong);
  transform: scaleY(0); transform-origin: 50% 0;
  animation: rail 0.6s var(--ease-out) 0.12s both;
}
.metric--safe::before { background: var(--safe); }
.metric--caution::before { background: var(--caution); }
.metric--risky::before { background: var(--risk); }
.metric__label { font-size: 12.5px; color: var(--muted); }
.metric__value { font-size: 1.55rem; font-weight: 600; margin-top: 4px; }
.metric__note { font-size: 12px; margin-top: 3px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.chip--safe { background: var(--safe-bg); color: var(--safe); }
.chip--caution { background: var(--caution-bg); color: var(--caution); }
.chip--risky, .chip--blocked { background: var(--risk-bg); color: var(--risk); }

.t-safe { color: var(--safe); }
.t-caution { color: var(--caution); }
.t-risky, .t-blocked { color: var(--risk); }

/* ---------- bảng so sánh ---------- */
.compare { display: grid; gap: 14px; }

.option {
  border: 1px solid var(--line); border-radius: var(--r-shell);
  background: var(--surface-sunken); padding: 6px;
}
.option__core {
  background: var(--surface); border-radius: var(--r-core); padding: 20px;
  box-shadow: var(--shadow-ambient);
}
.option--top { border-color: var(--line-strong); }
.option--top .option__core { box-shadow: var(--shadow-lift); }
.option--blocked { opacity: .82; border-color: color-mix(in srgb, var(--risk) 45%, var(--line)); position: relative; }
.option--blocked .option__core { background: color-mix(in srgb, var(--risk-bg) 40%, var(--surface)); }
.option--blocked .option__core::before { content: "🚫  KHÔNG KHUYẾN NGHỊ"; display:block; margin:-20px -20px 16px; padding:9px 20px; background:var(--risk-bg); color:var(--risk); font-size:11px; font-weight:800; letter-spacing:.04em; border-bottom:1px solid color-mix(in srgb, var(--risk) 25%, var(--line)); }
.option--blocked .option__select, .option--blocked [data-select-option], .option--blocked button { cursor:not-allowed; }

  background: var(--line); border: 1px solid var(--line); border-radius: var(--r-control); overflow: hidden; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- điểm nhấn: lãi suất thực ---------- */
.reveal-apr {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-core);
  padding: 20px 22px;
}
@media (max-width: 620px) { .reveal-apr { grid-template-columns: 1fr; text-align: left; gap: 12px; } }

.reveal-apr__v { font-size: 1.9rem; font-weight: 600; line-height: 1.1; margin-top: 2px; }
.reveal-apr__arrow { color: var(--muted); font-size: 1.2rem; display: block; }
/* Mũi tên là thứ mang nghĩa "quảng cáo bao nhiêu, thực tế bao nhiêu". Trước đây
   nó bị ẩn trên điện thoại, làm mất luôn quan hệ giữa hai con số. Giờ quay xuống. */
@media (max-width: 620px) { .reveal-apr__arrow { transform: rotate(90deg); width: 1.2rem; } }

/* ---------- biểu đồ ---------- */
/* Lề quanh khung vẽ tính bằng pixel thật chứ không theo tỷ lệ, vì nhãn trục là
   chữ HTML có cỡ cố định. Nhờ vậy nhãn không bao giờ bị co nhỏ theo màn hình. */
.chart-wrap { position: relative; padding: 8px 52px 26px 58px; }
.chart-plot { position: relative; }
.chart { display: block; width: 100%; height: 208px; touch-action: pan-y; }
@media (max-width: 640px) {
  .chart-wrap { padding: 8px 42px 24px 46px; }
  .chart { height: 176px; }
}

.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .guide { stroke: var(--risk); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.7; }
.chart .danger { fill: var(--risk); opacity: 0.06; }
.chart .series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { stroke: none; opacity: 0.09; }
.chart .cursor { stroke: var(--ink-soft); stroke-width: 1; opacity: 0; }

/* Nhãn trục, dựng bằng HTML rồi đặt chồng lên đúng toạ độ phần trăm. */
.chart-y, .chart-x, .chart-end, .chart-guide {
  position: absolute; white-space: nowrap; pointer-events: none;
  font-family: var(--font-figure); font-variant-numeric: tabular-nums;
  font-size: 11px; color: var(--muted); line-height: 1;
}
.chart-y { right: 100%; margin-right: 8px; transform: translateY(-50%); }
.chart-x { top: 100%; margin-top: 9px; transform: translateX(-50%); }
.chart-x--start { transform: none; }
.chart-x--end { transform: translateX(-100%); }
.chart-end { left: 100%; margin-left: 9px; transform: translateY(-50%); font-weight: 500; }
.chart-guide { right: 0; transform: translateY(-140%); color: var(--risk); }

/* Chấm đầu mút: cho biết đường dừng ở đâu khi hai đường chồng lên nhau. */
.chart-dot {
  position: absolute; width: 7px; height: 7px; border-radius: 999px;
  transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface);
}
.chart-dot--animated { animation: pop 0.4s var(--ease-spring) 1.15s both; }

/* Điểm bám khi rê chuột. Ẩn cho tới khi trỏ vào biểu đồ. */
.chart-cursor-dot {
  position: absolute; width: 8px; height: 8px; border-radius: 999px;
  transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface);
  opacity: 0; left: 0; top: 0;
}
.chart-wrap[data-hover='on'] .cursor, .chart-wrap[data-hover='on'] .chart-cursor-dot { opacity: 1; }

.chart-tip {
  position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none;
  min-width: 158px; padding: 9px 11px; border-radius: var(--r-control);
  background: var(--surface); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-lift); font-size: 12.5px;
  opacity: 0; transform: translate(-50%, -110%);
  transition: opacity 0.16s var(--ease);
}
.chart-wrap[data-hover='on'] .chart-tip { opacity: 1; }
.chart-tip__k { color: var(--muted); font-size: 11.5px; }
.chart-tip__row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.chart-tip__row b { margin-left: auto; font-family: var(--font-figure); font-variant-numeric: tabular-nums; font-weight: 600; }
.chart-tip__swatch { width: 13px; height: 2px; border-radius: 2px; flex: none; }

/* Bảng số liệu của biểu đồ, cho người dùng trình đọc màn hình và cho ai muốn
   xem con số thay vì đường. Đóng lại mặc định để không chiếm chỗ. */
.chart-data { margin-top: 12px; }
.chart-data > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.chart-data > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.chart-data th, .chart-data td {

  font-family: var(--font-figure); font-variant-numeric: tabular-nums;
}

.chart-data__scroll { overflow-x: auto; }

/* ---------- bảng giả định ---------- */
.rows { border: 1px solid var(--line); border-radius: var(--r-core); overflow: hidden; }
.rows__item { padding: 14px 16px; background: var(--surface); }
.rows__item + .rows__item { border-top: 1px solid var(--line); }

/* ---------- chuyển động ---------- */
/* Nguyên tắc: mỗi chuyển động phải nói một điều gì đó. Vào trang thì dựng thứ
   tự đọc, vẽ biểu đồ thì cho thấy thời gian trôi, đếm số thì cho thấy con số
   được tính ra chứ không phải in sẵn. Không có vòng lặp vô hạn ở đâu cả. */
@keyframes rise {
  from { opacity: 0; transform: translate3d(0, 14px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
/* AUDIT: page-enter transition riêng cho .view — tách khỏi @keyframes rise (card) để chỉnh
   timing độc lập theo yêu cầu 180–240ms, không ảnh hưởng .rise (card, 620ms, giữ nguyên). */
@keyframes dfPageFadeIn {
  from { opacity: 0; transform: translate3d(0, 8px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes rail { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(var(--at, 0)); } }
/* Chấm đầu mút đã dịch nửa chiều để nằm đúng tâm, nên khung hình phải giữ lại
   phép dịch đó, nếu không chấm sẽ nhảy chỗ khi hiệu ứng chạy. */
@keyframes pop {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@keyframes fade { from { opacity: 0; } to { opacity: 0.09; } }

.rise { animation: rise 0.62s var(--ease-out) both; }
/* .view là root wrapper của MỌI route (dashboard/decision/compare/wishlist/journey/learn/...).
   transform+opacity thuần, không đụng width/height/margin nên không gây layout shift. */
.view { animation: dfPageFadeIn 0.22s var(--ease-out) both; }

/* Biểu đồ hiện dần từ trái sang phải: trục hoành là thời gian, nên hướng chuyển
   động trùng với hướng đọc của dữ liệu. Khung cắt trượt thay cho thủ thuật
   stroke-dashoffset để mỗi đường vẫn giữ được kiểu nét đứt riêng. */
.chart .wipe--animated {
  transform-box: fill-box; transform-origin: 0 50%;
  animation: wipe 1.15s var(--ease) 0.15s both;
}
.chart .area--animated { animation: fade 0.7s var(--ease-out) 0.55s both; }

/* Đổi nền sáng tối: hoà hai ảnh thay vì nháy một cái. Trình duyệt nào chưa hỗ
   trợ View Transitions thì rơi về hành vi cũ, không hỏng gì. */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.32s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .chart .wipe--animated { transform: none; }
  .chart .area--animated { opacity: 0.09; }
  .chart-dot--animated { opacity: 1; transform: translate(-50%, -50%); }
  .metric::before { transform: scaleY(1); }
  .meter__fill { transform: scaleX(var(--at, 0)); }
  .chart .tip-dot--animated { opacity: 1; transform: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}

<style id="decifin-design-system-v7">
/* ================================================================
   DeciFin V7 — visual design system
   8pt rhythm · stronger hierarchy · mobile-first · unified surfaces
   ================================================================ */
:root{
  --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px;
  --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px; --radius-xl:28px;
  --shadow-sm:0 2px 8px rgba(22,23,26,.05);
  --shadow-md:0 12px 30px rgba(22,23,26,.08);
  --shadow-lg:0 24px 60px rgba(22,23,26,.12);
  --content-max:1120px;
}
[data-theme='dark']{
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 12px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.45);
}
/* 8pt breathing room */
.shell{max-width:var(--content-max);padding-inline:var(--space-3)}
main{padding-top:var(--space-7);padding-bottom:var(--space-8)}
.stack>*+*{margin-top:var(--space-4)}
.shell-card{padding:var(--space-2);border-radius:var(--radius-lg)}
.shell-card__core,.panel{padding:var(--space-4);border-radius:var(--radius-md)}
.panel+.panel{margin-top:var(--space-3)}
.df-card,.df-category,.df-quiz,.df-personal{padding:var(--space-4)}
.df-v6-page{padding-bottom:var(--space-7)}
/* typography hierarchy */
.eyebrow,.df-v6-kicker,.df-onboard__eyebrow{letter-spacing:.08em;font-weight:800;font-size:11px}
.small,.muted{font-size:12px}
.figure{font-weight:700}
.df-slider-value strong,.df-v6-price,.df-v6-card-price,.df-health-number,.df-big-number,.df-metric-value{font-weight:800}
.df-v6-price,.df-v6-card-price,.df-big-number{font-size:clamp(2rem,4vw,2.5rem);letter-spacing:-.045em}
/* Make financial figures visually dominant where existing components expose them. */
.stat__value,.metric__value,.kpi__value,[data-count],.figure{font-variant-numeric:tabular-nums}
.stat__value,.metric__value,.kpi__value{font-size:clamp(1.8rem,3.2vw,2.5rem);font-weight:800;letter-spacing:-.04em}
.stat__label,.metric__label,.kpi__label{font-size:12px;color:var(--muted)}
/* touch targets */
.btn,.steps__item,.df-learn-nav,.df-filter,.df-account-btn,.df-logout-btn{min-height:44px}
button,input,select{touch-action:manipulation}
input,select{min-height:44px}
/* richer cards */
.shell-card,.panel,.df-card{box-shadow:var(--shadow-sm)}
.panel--action:hover,.df-card:hover,.df-category:hover{box-shadow:var(--shadow-md)}
/* chart — artistic area gradient and refined hover */
.chart .area{opacity:1}
.chart .series{stroke-width:2.35}
.chart-tip{border:1px solid color-mix(in srgb,var(--ink) 10%,var(--line));border-radius:var(--radius-md)!important;box-shadow:0 18px 44px rgba(17,27,58,.16),0 3px 10px rgba(17,27,58,.08)!important;padding:12px 14px!important;background:color-mix(in srgb,var(--surface) 94%,transparent)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chart-tip__k{font-size:11px!important;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.chart-tip__row{gap:8px!important;margin-top:7px!important}
.chart-tip__row b{font-size:14px!important;font-weight:800!important;color:var(--ink)}
.chart-cursor-dot{width:10px;height:10px;box-shadow:0 0 0 3px var(--surface),0 4px 12px rgba(17,27,58,.18)}
/* V6 feature surfaces */
.df-v6-hero{padding:var(--space-7)!important;border-radius:var(--radius-xl)!important}
.df-v6-how{gap:var(--space-3)!important;margin-block:var(--space-4)!important}
.df-v6-how>div{padding:var(--space-4)!important;border-radius:var(--radius-md)!important}
.df-v6-section-head{margin-top:var(--space-7)!important;margin-bottom:var(--space-4)!important}
.df-v6-list{gap:var(--space-4)!important}
.df-v6-card{padding:var(--space-4)!important;border-radius:var(--radius-lg)!important;box-shadow:var(--shadow-sm)}
.df-v6-form{gap:var(--space-3)!important}
.df-v6-note{padding:var(--space-3)!important;margin-top:var(--space-3)!important}
.df-v6-sos-hero{padding:var(--space-5)!important;border-radius:var(--radius-lg)!important}
.df-v6-sos-steps{gap:var(--space-3)!important;margin-block:var(--space-4)!important}
.df-v6-sos-steps>div{padding:var(--space-4)!important;border-radius:var(--radius-md)!important}
.df-v6-big-field input{min-height:56px!important;font-size:24px!important;font-weight:800!important}
.df-v6-big-btn{min-height:52px!important;font-size:15px!important;font-weight:800!important;margin-top:var(--space-3)}
/* Bottom navigation — mobile mental model */
.df-mobile-nav{display:none}
@media(max-width:767px){
  body{padding-bottom:76px}
  .shell{padding-inline:var(--space-3)}
  main{padding-top:var(--space-4);padding-bottom:var(--space-6)}
  .topbar{position:sticky;top:0}
  .topbar__inner{height:56px}
  .topbar__inner>.steps,.topbar__inner>.df-learn-nav,.topbar__inner>.topbar__spacer{display:none!important}
  .topbar__inner>.brand{margin-right:auto}
  .df-mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:12px;right:12px;bottom:12px;z-index:90;height:64px;padding:6px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 18px 45px rgba(17,27,58,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .df-mobile-nav button{min-width:0;border:0;background:transparent;border-radius:14px;color:var(--muted);font:inherit;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .df-mobile-nav button span:first-child{font-size:19px;line-height:1}
  .df-mobile-nav button.is-active{background:var(--surface-sunken);color:var(--ink)}
  .df-mobile-nav button:active{transform:scale(.97)}
  .shell-card__core,.panel{padding:var(--space-3)}
  .df-v6-hero{padding:var(--space-5)!important}
  .df-v6-how{grid-template-columns:1fr!important}
  .df-v6-sos-hero{padding:var(--space-4)!important}
  .df-v6-sos-steps{grid-template-columns:1fr!important}
  .btn{min-height:48px}
  .df-v6-foot{gap:var(--space-2)!important;flex-wrap:wrap}
}
@media(min-width:768px){.df-mobile-nav{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<noscript>
  <div style="max-width:640px;margin:64px auto;padding:0 20px">
    <h1>Cần bật JavaScript</h1>
    <p>DeciFin thực hiện toàn bộ tính toán ngay trên trình duyệt của bạn, nên cần JavaScript để chạy.
    Đổi lại, không có số liệu tài chính nào của bạn rời khỏi thiết bị này.</p>

<script>
// ======================================================================
// src/engine/config.js
// ======================================================================
/**
 * Tham số mô hình. Toàn bộ giá trị ở đây là giả định do nhóm đặt, không phải
 * số liệu chính thức. Chúng được công bố nguyên vẹn trên màn hình "Giả định"
 * để người dùng biết kết quả mô phỏng dựa trên cái gì.
 *
 * Quy ước đơn vị toàn hệ thống: tiền = VND, thời gian = tháng, lãi suất nhập
 * theo năm. Không làm tròn trong lúc tính, chỉ làm tròn khi hiển thị.
 */

const ASSUMPTIONS = {
  savingsApr: 0.05,
  inflationApr: 0.04,
  runwaySafe: 6,
  runwayCaution: 3,
  dtiSafe: 0.3,
  dtiCaution: 0.4,
  dtiHardStop: 0.5,
  runwayHardStop: 1,
  gateScoreCap: 35,
};

/** Nguồn gốc từng tham số. Hiển thị nguyên bảng này trên màn hình Giả định. */
const ASSUMPTION_NOTES = [
  {
    key: 'savingsApr',
    label: 'Lãi suất tiết kiệm tham chiếu',
    value: '5,0%/năm',
    status: 'unverified',
    note: 'Nhóm tự đặt. Cần thay bằng trung bình lãi suất tiền gửi 12 tháng của 3-5 ngân hàng lớn, ghi rõ ngày tra cứu.',
  },
  {
    key: 'inflationApr',
    label: 'Tỷ lệ lạm phát',
    value: '4,0%/năm',
    status: 'unverified',
    note: 'Nhóm tự đặt. Cần thay bằng chỉ số giá tiêu dùng công bố gần nhất.',
  },
  {
    key: 'runwaySafe',
    label: 'Quỹ dự phòng mức an toàn',
    value: '6 tháng chi phí',
    status: 'convention',
    note: 'Thông lệ quản lý tài chính cá nhân, chưa phải chuẩn mực bắt buộc tại Việt Nam.',
  },
  {
    key: 'runwayCaution',
    label: 'Quỹ dự phòng mức thận trọng',
    value: '3 tháng chi phí',
    status: 'convention',
    note: 'Cùng nguồn với mức an toàn.',
  },
  {
    key: 'dtiSafe',
    label: 'Ngưỡng nợ an toàn',
    value: '30% thu nhập',
    status: 'unverified',
    note: 'Nhóm tự đặt. Không được trình bày như quy định pháp luật khi chưa đối chiếu chính sách tín dụng công bố của ngân hàng.',
  },
  {
    key: 'dtiCaution',
    label: 'Ngưỡng nợ cảnh báo',
    value: '40% thu nhập',
    status: 'unverified',
    note: 'Cùng nguồn với ngưỡng an toàn.',
  },
  {
    key: 'dtiHardStop',
    label: 'Ngưỡng nợ chặn cứng',
    value: '50% thu nhập',
    status: 'unverified',
    note: 'Cùng nguồn với ngưỡng an toàn.',
  },
  {
    key: 'weights',
    label: 'Trọng số điểm an toàn',
    value: 'Thanh khoản 30% · Nợ 25% · Dòng tiền 20% · Mục tiêu 15% · Ổn định thu nhập 10%',
    status: 'design',
    note: 'Lựa chọn thiết kế của nhóm, phản ánh quan điểm rằng mất khả năng ứng phó sự cố là rủi ro lớn nhất với người 18-25 tuổi. Không dựa trên chuẩn mực được công nhận nào.',
  },
];

/** Đổi lãi suất năm sang lãi suất tháng. */
const monthlyRate = (apr) => apr / 12;

// ======================================================================
// src/engine/profile.js
// ======================================================================
/** Hồ sơ tài chính động và các chỉ số nền suy ra từ nó. */

/**
 * @typedef {Object} Debt
 * @property {string} name
 * @property {number} monthlyPayment
 * @property {number} remainingMonths
 *
 * @typedef {Object} Goal
 * @property {string} name
 * @property {number} target
 * @property {number} saved
 * @property {number} deadlineMonth
 * @property {number} allocWeight
 *
 * @typedef {Object} Profile
 * @property {number} income thu nhập ròng hằng tháng
 * @property {number} essential chi phí thiết yếu
 * @property {number} discretionary chi tiêu linh hoạt
 * @property {number} liquidAssets tài sản rút dùng được ngay
 * @property {Debt[]} debts
 * @property {Goal[]} goals
 * @property {'stable'|'variable'} incomeStability
 */

const EMPTY_PROFILE = {
  income: 0,
  essential: 0,
  discretionary: 0,
  liquidAssets: 0,
  debts: [],
  goals: [],
  incomeStability: 'stable',
};

/**
 * Chi phí tối thiểu cố ý KHÔNG gồm chi tiêu linh hoạt. Quỹ dự phòng đo khả năng
 * cầm cự khi mất thu nhập, mà trong tình huống đó người ta cắt ngay khoản linh
 * hoạt nhưng vẫn phải trả tiền nhà, tiền ăn và tiền nợ. Đưa nó vào mẫu số sẽ
 * làm mọi phương án bị đánh giá bi quan hơn thực tế.
 */
function baseline(profile) {
  const debtPayments = profile.debts.reduce((sum, d) => sum + d.monthlyPayment, 0);
  const minimumSpend = profile.essential + debtPayments;
  const surplus = profile.income - profile.essential - profile.discretionary - debtPayments;

  return {
    debtPayments,
    minimumSpend,
    surplus,
    savingsRate: profile.income > 0 ? surplus / profile.income : 0,
    dti: profile.income > 0 ? debtPayments / profile.income : 0,
    runway: minimumSpend > 0 ? profile.liquidAssets / minimumSpend : Infinity,
  };
}

/** Kiểm tra hồ sơ trước khi mô phỏng. Trả về danh sách lỗi, rỗng nghĩa là hợp lệ. */
function validate(profile) {
  const errors = [];
  if (!(profile.income > 0)) errors.push('Thu nhập phải lớn hơn 0.');
  if (profile.essential < 0) errors.push('Chi phí thiết yếu không được âm.');
  if (profile.discretionary < 0) errors.push('Chi tiêu linh hoạt không được âm.');
  if (profile.liquidAssets < 0) errors.push('Tài sản thanh khoản không được âm.');
  if (profile.essential > profile.income) {
    errors.push('Chi phí thiết yếu đang vượt thu nhập. Hãy kiểm tra lại số liệu.');
  }
  profile.goals.forEach((g) => {
    if (!(g.target > 0)) errors.push(`Mục tiêu "${g.name}" phải có số tiền lớn hơn 0.`);
    if (g.saved > g.target) errors.push(`Mục tiêu "${g.name}" đã tích luỹ vượt số cần đạt.`);
  });
  return errors;
}

// ======================================================================
// src/engine/finance.js
// ======================================================================
/** Toán trả góp và giá trị thời gian của tiền. */


/**
 * Khoản trả hằng tháng theo lãi phẳng: lãi tính trên toàn bộ dư nợ gốc ban đầu
 * suốt kỳ hạn, dù người vay đã trả dần gốc. Đây là cách các gói trả góp tiêu
 * dùng thường niêm yết.
 * @param {number} principal số tiền vay
 * @param {number} months kỳ hạn
 * @param {number} flatMonthly lãi phẳng theo tháng, ví dụ 0.01 cho 1%/tháng
 */
function flatRatePayment(principal, months, flatMonthly) {
  if (months <= 0) throw new RangeError('Kỳ hạn phải lớn hơn 0');
  return principal / months + principal * flatMonthly;
}

/** Khoản trả hằng tháng theo dư nợ giảm dần (niên kim). */
function reducingBalancePayment(principal, months, apr) {
  if (months <= 0) throw new RangeError('Kỳ hạn phải lớn hơn 0');
  const i = monthlyRate(apr);
  if (i === 0) return principal / months;
  const growth = (1 + i) ** months;
  return (principal * i * growth) / (growth - 1);
}

/**
 * Lãi suất thực: mức lãi làm cho giá trị hiện tại của dòng tiền hoàn trả bằng
 * đúng số tiền vay. Không có công thức đóng nên giải bằng chia đôi khoảng.
 * Chọn chia đôi thay vì Newton vì nó luôn hội tụ, không phụ thuộc điểm khởi tạo.
 * @returns {number} lãi suất thực theo năm
 */
function effectiveApr(principal, monthlyPayment, months) {
  if (months <= 0) throw new RangeError('Kỳ hạn phải lớn hơn 0');
  if (monthlyPayment * months <= principal) return 0;

  const npvAt = (i) => {
    let sum = 0;
    for (let t = 1; t <= months; t += 1) sum += monthlyPayment / (1 + i) ** t;
    return sum - principal;
  };

  let lo = 1e-9;
  let hi = 5;
  for (let step = 0; step < 300 && hi - lo > 1e-12; step += 1) {
    const mid = (lo + hi) / 2;
    if (npvAt(mid) > 0) lo = mid;
    else hi = mid;
  }
  return ((lo + hi) / 2) * 12;
}

/**
 * Gói trả góp đã phân tích đầy đủ. Trường `spread` là tỷ số giữa lãi thực và
 * lãi phẳng quy đổi năm, tức mức mà con số quảng cáo đang che đi.
 */
function analyseInstallment({ price, downPayment = 0, months, flatMonthly }) {
  const financed = price - downPayment;
  const payment = flatRatePayment(financed, months, flatMonthly);
  const advertisedApr = flatMonthly * 12;
  const trueApr = effectiveApr(financed, payment, months);
  return {
    financed,
    payment,
    months,
    totalPaid: downPayment + payment * months,
    totalInterest: payment * months - financed,
    advertisedApr,
    trueApr,
    spread: advertisedApr > 0 ? trueApr / advertisedApr : 1,
  };
}

/**
 * Giá trị hiện tại của một chuỗi chi tiêu, chiết khấu theo lãi suất cơ hội.
 * Một triệu phải trả sau 12 tháng nhẹ hơn một triệu phải trả hôm nay, và đây
 * là chỗ duy nhất phản ánh được điều đó.
 */
function presentValue({ upfront = 0, recurring = 0, recurringMonths = 0, delayed = 0, delayMonths = 0 }, apr = ASSUMPTIONS.savingsApr) {
  const d = monthlyRate(apr);
  let pv = upfront;
  for (let t = 1; t <= recurringMonths; t += 1) pv += recurring / (1 + d) ** t;
  if (delayMonths > 0) pv += delayed / (1 + d) ** delayMonths;
  else pv += delayed;
  return pv;
}

/** Thời điểm đạt mục tiêu tiết kiệm. */


/**
 * Số tháng để đạt mục tiêu, có tính lãi kép trên phần đã tích luỹ.
 * Suy ra từ đẳng thức giá trị tương lai của dòng tiền đều có gốc ban đầu:
 *   target = saved*(1+r)^n + monthly*((1+r)^n - 1)/r
 * giải ra n. Trả về Infinity khi không thể đạt được.
 */
function monthsToGoal(target, saved, monthly, apr = ASSUMPTIONS.savingsApr) {
  if (saved >= target) return 0;
  if (monthly <= 0) return Infinity;

  const r = monthlyRate(apr);
  if (r === 0) return Math.ceil((target - saved) / monthly);

  const numerator = target * r + monthly;
  const denominator = saved * r + monthly;
  if (numerator <= 0 || denominator <= 0) return Infinity;
  return Math.ceil(Math.log(numerator / denominator) / Math.log(1 + r));
}

/**
 * Chuẩn hoá tỷ trọng phân bổ về tổng bằng 1.
 * Bỏ qua bước này là lỗi im lặng nguy hiểm nhất của cả engine: mọi thời điểm
 * đạt mục tiêu sẽ sai mà không có dấu hiệu nào báo ra ngoài.
 */
function normaliseWeights(goals) {
  const total = goals.reduce((sum, g) => sum + (g.allocWeight || 0), 0);
  if (total <= 0) {
    const even = goals.length > 0 ? 1 / goals.length : 0;
    return goals.map((g) => ({ ...g, allocWeight: even }));
  }
  return goals.map((g) => ({ ...g, allocWeight: (g.allocWeight || 0) / total }));
}

/** Quỹ đạo số dư tích luỹ theo tháng, dùng để vẽ biểu đồ. */
function accumulationPath(saved, monthly, months, apr = ASSUMPTIONS.savingsApr) {
  const r = monthlyRate(apr);
  const path = [saved];
  let balance = saved;
  for (let t = 1; t <= months; t += 1) {
    balance = balance * (1 + r) + monthly;
    path.push(balance);
  }
  return path;
}

/** Chấm điểm an toàn tài chính và tầng chặn cứng. */


const WEIGHTS = {
  liquidity: 0.3,
  debt: 0.25,
  cashflow: 0.2,
  goals: 0.15,
  stability: 0.1,
};

/** Nội suy tuyến tính giữa các mốc. `points` phải tăng dần theo x. */
function interpolate(x, points) {
  if (x <= points[0][0]) return points[0][1];
  const last = points[points.length - 1];
  if (x >= last[0]) return last[1];
  for (let i = 0; i < points.length - 1; i += 1) {
    const [x0, y0] = points[i];
    const [x1, y1] = points[i + 1];
    if (x >= x0 && x <= x1) return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0);
  }
  return last[1];
}

const LIQUIDITY_CURVE = [[0, 0], [1, 20], [3, 55], [6, 85], [12, 100]];
const DEBT_CURVE = [[0, 100], [0.3, 80], [0.4, 45], [0.5, 15], [0.6, 0]];
const CASHFLOW_CURVE = [[-0.1, 0], [0, 25], [0.1, 55], [0.2, 80], [0.3, 100]];

/**
 * Điểm 0-100, càng cao càng an toàn.
 * Trọng số là lựa chọn thiết kế, không phải chuẩn mực. Xem ASSUMPTION_NOTES.
 */
function scoreOutcome(profile, outcome) {
  const lateGoals = outcome.goals.filter((g) => g.missesDeadline).length;
  const goalCount = Math.max(outcome.goals.length, 1);
  const cashflowRatio = profile.income > 0 ? outcome.surplusAfter / profile.income : 0;

  const parts = {
    liquidity: interpolate(outcome.runwayAfter, LIQUIDITY_CURVE),
    debt: interpolate(outcome.dtiAfter, DEBT_CURVE),
    cashflow: interpolate(cashflowRatio, CASHFLOW_CURVE),
    goals: 100 * (1 - lateGoals / goalCount),
    stability: profile.incomeStability === 'stable' ? 85 : 50,
  };

  const total = Object.keys(WEIGHTS).reduce((sum, key) => sum + parts[key] * WEIGHTS[key], 0);
  return { total: Math.round(total * 10) / 10, parts };
}

/**
 * Ràng buộc tuyệt đối, áp SAU khi chấm điểm.
 * Điểm trọng số có thể bị các thành phần phụ kéo lên: một phương án vét sạch
 * quỹ dự phòng nhưng không phát sinh nợ vẫn đạt trên 60 điểm. Tầng này tồn tại
 * để engine không khuyên sai trong đúng tình huống đó.
 */
const HARD_RULES = [
  {
    code: 'NEGATIVE_CASHFLOW',
    test: (o) => o.surplusAfter < 0,
    message: 'Dòng tiền hằng tháng trở nên âm. Phương án này vượt quá khả năng chi trả.',
  },
  {
    code: 'LIQUIDITY_DRAINED',
    test: (o) => o.runwayAfter < ASSUMPTIONS.runwayHardStop,
    message: 'Quỹ dự phòng còn dưới một tháng. Không còn đệm đỡ cho sự cố bất ngờ.',
  },
  {
    code: 'DEBT_OVER_LIMIT',
    test: (o) => o.dtiAfter > ASSUMPTIONS.dtiHardStop,
    message: 'Nghĩa vụ nợ vượt quá một nửa thu nhập.',
  },
];

function applyHardGate(score, outcome) {
  const breaches = HARD_RULES.filter((rule) => rule.test(outcome));
  if (breaches.length === 0) {
    return { ...score, band: bandFor(score.total), breaches: [] };
  }
  return {
    ...score,
    total: Math.min(score.total, ASSUMPTIONS.gateScoreCap),
    band: 'blocked',
    breaches: breaches.map((b) => ({ code: b.code, message: b.message })),
  };
}

function bandFor(total) {
  if (total >= 70) return 'safe';
  if (total >= 45) return 'caution';
  return 'risky';
}

const BAND_LABEL = {
  safe: 'An toàn',
  caution: 'Cần thận trọng',
  risky: 'Rủi ro cao',
  blocked: 'Không khuyến nghị',
};

// src/engine/explain.js
// ======================================================================
/**
 * Sinh câu diễn giải từ bộ quy tắc xác định.
 *
 * Cố ý không dùng mô hình ngôn ngữ ở giai đoạn này vì hai lý do: kết quả phải
 * lặp lại y hệt giữa các lần chạy để người dùng và bên thứ ba kiểm chứng được,
 * và mô hình ngôn ngữ có thể sinh ra con số không tồn tại trong dữ liệu đầu vào.
 * Lớp này tách riêng nên sau này gắn mô hình vào để diễn đạt lại là việc dễ,
 * miễn nó không tham gia tính toán.
 */


const SEVERITY = { block: 3, warn: 2, note: 1 };

function explain(profile, outcome, extras = {}) {
  const messages = [];
  const push = (severity, text) => messages.push({ severity, text });

  const runway = outcome.runwayAfter;
  if (runway < ASSUMPTIONS.runwayHardStop) {
    push('block', `Quỹ dự phòng chỉ còn ${fmtMonths(runway)}, dưới mức tối thiểu để xử lý sự cố.`);
  } else if (runway < ASSUMPTIONS.runwayCaution) {
    push('warn', `Quỹ dự phòng còn ${fmtMonths(runway)}, dưới ngưỡng thận trọng ${ASSUMPTIONS.runwayCaution} tháng.`);
  } else if (runway < ASSUMPTIONS.runwaySafe) {
    push('note', `Quỹ dự phòng còn ${fmtMonths(runway)}, chưa đạt mức an toàn ${ASSUMPTIONS.runwaySafe} tháng.`);
  } else {
    push('note', `Quỹ dự phòng còn ${fmtMonths(runway)}, đạt mức an toàn.`);
  }

  if (outcome.surplusAfter < 0) {
    push('block', `Dòng tiền âm ${fmtMoney(Math.abs(outcome.surplusAfter))} mỗi tháng.`);
  }

  if (outcome.dtiAfter > ASSUMPTIONS.dtiCaution) {
    push('warn', `Nghĩa vụ nợ chiếm ${fmtPercent(outcome.dtiAfter)} thu nhập, vượt ngưỡng tham chiếu ${fmtPercent(ASSUMPTIONS.dtiCaution)}.`);
  } else if (outcome.dtiAfter > ASSUMPTIONS.dtiSafe) {
    push('note', `Nghĩa vụ nợ chiếm ${fmtPercent(outcome.dtiAfter)} thu nhập.`);
  }

  outcome.goals.forEach((goal) => {
    if (!Number.isFinite(goal.etaAfter)) {
      push('warn', `Mục tiêu "${goal.name}" sẽ không đạt được với dòng tiền còn lại.`);
    } else if (goal.delayMonths > 0) {
      const suffix = goal.missesDeadline ? ' và trễ hạn mong muốn' : '';
      push(goal.missesDeadline ? 'warn' : 'note',
        `Mục tiêu "${goal.name}" chậm thêm ${goal.delayMonths} tháng, dự kiến đạt sau ${goal.etaAfter} tháng${suffix}.`);
    }
  });

  if (extras.installment) {
    const { trueApr, advertisedApr, spread } = extras.installment;
    push('warn',
      `Lãi suất thực của gói trả góp là ${fmtPercent(trueApr, 2)}/năm, trong khi mức quảng cáo quy đổi chỉ ${fmtPercent(advertisedApr, 1)}/năm, gấp ${spread.toFixed(2)} lần.`);
  }

  return messages.sort((a, b) => SEVERITY[b.severity] - SEVERITY[a.severity]);
}

// Dấu thập phân của tiếng Việt là dấu phẩy. Trước đây ba hàm này in ra dấu
// chấm, nên trong cùng một màn hình có chỗ ghi "21,46%" và chỗ ghi "21.46%".
const fmtMonths = (m) => `${m.toFixed(1).replace('.', ',')} tháng`;
const fmtPercent = (v, digits = 1) => `${(v * 100).toFixed(digits).replace('.', ',')}%`;
const fmtMoney = (v) => `${Math.round(v).toLocaleString('vi-VN')} đ`;

// src/engine/index.js
// ======================================================================
/**
 * Cửa duy nhất giao diện gọi vào engine.
 *
 * Ý tưởng trung tâm của cả sản phẩm nằm ở đây: bốn nhóm quyết định trong phạm vi
 * MVP (mua sắm giá trị lớn, chọn phương án trả góp, phân bổ tiền giữa các mục
 * tiêu, điều chỉnh kế hoạch tiết kiệm) khác nhau về bối cảnh nhưng đồng nhất về
 * cấu trúc toán học. Tất cả đều quy về một câu hỏi: một sự kiện dòng tiền tác
 * động thế nào lên hồ sơ hiện tại và lên thời điểm đạt mục tiêu. Nhờ vậy chỉ cần
 * một engine kèm bốn biểu mẫu nhập liệu, thay vì bốn hệ thống riêng.
 */


/**
 * Sự kiện tài chính chuẩn hoá. Mọi phương án của cả bốn nhóm quyết định đều mô
 * tả được bằng đúng sáu trường này.
 * @typedef {Object} FinancialEvent
 * @property {string} label
 * @property {number} [upfront] chi ngay tại thời điểm hiện tại
 * @property {number} [recurring] chi đều mỗi tháng
 * @property {number} [recurringMonths]
 * @property {number} [delayMonths] số tháng trì hoãn trước khi chi
 * @property {number} [delayed] số tiền chi sau khi trì hoãn
 * @property {number} [surplusDelta] thay đổi dòng tiền dư
 */

function makeEvent(label, patch = {}) {
  return {
    label,
    upfront: 0,
    recurring: 0,
    recurringMonths: 0,
    delayMonths: 0,
    delayed: 0,
    surplusDelta: 0,
    ...patch,
  };
}

/** Áp một sự kiện lên hồ sơ và tính lại toàn bộ chỉ số. */
function simulate(profile, event) {
  const base = baseline(profile);
  const goals = normaliseWeights(profile.goals);
  const d = monthlyRate(ASSUMPTIONS.savingsApr);

  // Trì hoãn: tích luỹ dòng tiền dư có sinh lãi trong K tháng rồi mới chi.
  let liquidAfter = profile.liquidAssets - event.upfront;
  if (event.delayMonths > 0) {
    let balance = profile.liquidAssets;
    for (let t = 0; t < event.delayMonths; t += 1) {
      balance = balance * (1 + d) + base.surplus;
    }
    liquidAfter = balance - event.delayed;
  } else {
    liquidAfter -= event.delayed;
  }

  const debtPaymentsAfter = base.debtPayments + event.recurring;
  const minimumSpendAfter = profile.essential + debtPaymentsAfter;
  const surplusAfter =
    profile.income - profile.essential - profile.discretionary - debtPaymentsAfter + event.surplusDelta;

  const goalOutcomes = goals.map((goal) => {
    const contributionBefore = base.surplus * goal.allocWeight;
    const contributionAfter = Math.max(surplusAfter, 0) * goal.allocWeight;
    const etaBefore = monthsToGoal(goal.target, goal.saved, contributionBefore);
    const etaAfter = monthsToGoal(goal.target, goal.saved, contributionAfter);
    const delayMonths =
      Number.isFinite(etaAfter) && Number.isFinite(etaBefore) ? etaAfter - etaBefore : Infinity;
    return {
      name: goal.name,
      deadlineMonth: goal.deadlineMonth,
      etaBefore,
      etaAfter,
      delayMonths,
      missesDeadline: !(etaAfter <= goal.deadlineMonth),
    };
  });

  return {
    label: event.label,
    liquidAfter,
    runwayAfter: minimumSpendAfter > 0 ? liquidAfter / minimumSpendAfter : Infinity,
    dtiAfter: profile.income > 0 ? debtPaymentsAfter / profile.income : 0,
    surplusAfter,
    totalCash: event.upfront + event.recurring * event.recurringMonths + event.delayed,
    presentValue: presentValue({
      upfront: event.upfront,
      recurring: event.recurring,
      recurringMonths: event.recurringMonths,
      delayed: event.delayed,
      delayMonths: event.delayMonths,
    }),
    goals: goalOutcomes,
  };
}

/** Mô phỏng, chấm điểm, áp chặn cứng, sinh diễn giải. */
function evaluate(profile, event, extras = {}) {
  const outcome = simulate(profile, event);
  const score = applyHardGate(scoreOutcome(profile, outcome), outcome);
  return { outcome, score, messages: explain(profile, outcome, extras) };
}

/**
 * Xếp hạng các phương án. Engine không chọn thay người dùng: nó sắp xếp theo
 * mức an toàn, và khi hai phương án ngang điểm thì phương án rẻ hơn về giá trị
 * hiện tại đứng trước.
 */
function rank(profile, events, extrasByLabel = {}) {
  return rankScenarios(events.map((event) => ({ profile, event })), extrasByLabel);
}

/**
 * Bản tổng quát của rank cho trường hợp mỗi phương án gắn với một hồ sơ khác
 * nhau. Nhóm quyết định "phân bổ giữa các mục tiêu" cần đúng điều này: thay đổi
 * tỷ trọng là thay đổi hồ sơ, không phải thay đổi sự kiện dòng tiền.
 * @param {{profile: Object, event: FinancialEvent}[]} scenarios
 */
function rankScenarios(scenarios, extrasByLabel = {}) {
  return scenarios
    .map(({ profile, event }) => ({
      ...evaluate(profile, event, extrasByLabel[event.label] || {}),
      label: event.label,
    }))
    .sort((a, b) => b.score.total - a.score.total || a.outcome.presentValue - b.outcome.presentValue)
    .map((result, index) => ({ ...result, rank: index + 1 }));
}

/** Định dạng hiển thị. Tách riêng để engine không dính gì tới chuyện trình bày. */

const vnd = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });

const money = (v) => `${vnd.format(Math.round(v))} đ`;

/** Rút gọn cho thẻ chỉ số: 25.000.000 thành 25,0 tr. */
function moneyShort(v) {
  const abs = Math.abs(v);
  if (abs >= 1_000_000_000) return `${(v / 1_000_000_000).toFixed(2).replace('.', ',')} tỷ`;
  if (abs >= 1_000_000) return `${(v / 1_000_000).toFixed(1).replace('.', ',')} tr`;
  if (abs >= 1_000) return `${Math.round(v / 1_000)} ng`;
  return vnd.format(Math.round(v));
}

const percent = (v, digits = 1) => `${(v * 100).toFixed(digits).replace('.', ',')}%`;
const decimal = (v, digits = 1) => v.toFixed(digits).replace('.', ',');

function months(v) {
  if (!Number.isFinite(v)) return 'không đạt được';
  return `${decimal(v)} tháng`;
}

function monthsInt(v) {
  if (!Number.isFinite(v)) return 'không đạt được';
  return `${Math.round(v)} tháng`;
}

/**
 * Số tháng quỹ dự phòng cầm cự được.
 *
 * Vô hạn là trường hợp có thật: hồ sơ chưa khai chi phí thiết yếu nào thì mẫu
 * số bằng 0. Trước đây chỗ này in ra chữ "Infinity" giữa một giao diện tiếng
 * Việt, nên phải nói rõ là chưa đủ dữ liệu để tính.
 */
function runwayMonths(v) {
  if (!Number.isFinite(v)) return 'chưa tính được';
  return `${decimal(v)} tháng`;
}

/** Giá trị an toàn để nhét vào thuộc tính data-count của lớp đếm số. */
const countable = (v) => (Number.isFinite(v) ? v : 0);

/** Chặn ký tự lạ khi nhét dữ liệu người dùng vào chuỗi HTML. */
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Đọc số người dùng gõ.
 *
 * Có hai quy ước cùng tồn tại trên một màn hình và phải phân biệt được:
 *
 * Người Việt gõ tiền theo kiểu "25.000.000", dấu chấm ngăn nghìn và dấu phẩy
 * ngăn thập phân. Nhưng ô <input type="number"> của trình duyệt luôn trả về giá
 * trị theo chuẩn máy, tức dấu chấm ngăn thập phân: ô lãi suất đặt sẵn 0,8% sẽ
 * đọc ra chuỗi "0.8". Nếu bỏ hết dấu chấm như cách cũ thì "0.8" thành 8, và
 * toàn bộ nhóm quyết định trả góp tính sai gấp mười lần.
 *
 * Cách phân biệt: có dấu phẩy thì chắc chắn là kiểu Việt. Chỉ có dấu chấm thì
 * xem hình dạng - mọi nhóm sau dấu chấm đều đúng ba chữ số thì đó là ngăn
 * nghìn, còn lại là dấu thập phân. Trường hợp lấp lửng duy nhất là "1.234", ưu
 * tiên hiểu theo kiểu Việt vì đây là ứng dụng tiếng Việt nói chuyện tiền bạc.
 */
function parseAmount(raw) {
  if (typeof raw === 'number') return Number.isFinite(raw) ? raw : 0;

  const cleaned = String(raw).replace(/[^\d.,-]/g, '');
  if (cleaned === '') return 0;

  const vietnamese = cleaned.includes(',') || /^-?\d{1,3}(\.\d{3})+$/.test(cleaned);
  const normalised = vietnamese
    ? cleaned.replace(/\./g, '').replace(',', '.')
    : cleaned;

  const n = Number.parseFloat(normalised);
  return Number.isFinite(n) ? n : 0;
}

/**
 * Trạng thái ứng dụng.
 *
 * Toàn bộ dữ liệu nằm trong bộ nhớ trình duyệt và localStorage. Không có máy
 * chủ, không có lệnh gọi mạng nào trong mã nguồn. Đây là lựa chọn có chủ đích:
 * dữ liệu thu nhập, nợ và tài sản là dữ liệu cá nhân nhạy cảm, nên ở giai đoạn
 * kiểm chứng, cách an toàn nhất là không thu thập gì cả.
 */


const STORAGE_KEY = 'decifin.profile.v1';
const THEME_KEY = 'decifin.theme';

const listeners = new Set();

const state = {
  view: 'welcome',
  profile: structuredClone(EMPTY_PROFILE),
  wizardStep: 0,
  decisionKind: 'purchase',
  decisionInput: null,
  results: null,
  installment: null,
  // Báo lỗi và câu hỏi xác nhận, dựng ngay trong trang thay cho hộp thoại của
  // trình duyệt. null nghĩa là không có gì cần nói.
  notice: null,
  learnFilter: 'all',
  learnSearch: '',
  learnCompleted: [],
  learnQuizDone: false,
  focusMode: (() => { try { return localStorage.getItem('decifin.focusMode.v1') === '1'; } catch { return false; } })(),
};

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function update(patch) {
  Object.assign(state, patch);
  listeners.forEach((fn) => fn(state));
}

function saveProfile() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.profile));
  } catch {
    // Chế độ riêng tư của trình duyệt có thể chặn ghi. Mất khả năng lưu không
    // ảnh hưởng tới việc dùng ứng dụng nên bỏ qua trong im lặng là đúng.
  }
}

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return { ...structuredClone(EMPTY_PROFILE), ...parsed };
  } catch {
    return null;
  }
}

function clearProfile() {
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* như trên */ }
}

function readTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch { return null; }
}

function writeTheme(value) {
  try { localStorage.setItem(THEME_KEY, value); } catch { /* như trên */ }
}

/**
 * Biểu đồ đường vẽ tay bằng SVG.
 *
 * Không dùng thư viện biểu đồ vì chỉ cần đúng một loại đồ thị, và một tệp nhỏ
 * thì rẻ hơn nhiều so với việc kéo theo cả một phụ thuộc ngoài vào một ứng dụng
 * tài chính chạy trên máy người dùng.
 *
 * Hai quyết định đáng nói về cách dựng:
 *
 * Chữ và chấm nằm ngoài SVG, dựng bằng HTML đặt chồng lên. Trước đây chúng nằm
 * trong SVG, mà SVG thì co theo bề ngang khung chứa: trên điện thoại cả hình bị
 * thu còn khoảng 38%, nên chữ 11px hiển thị ra chưa tới 7px. Đưa chữ ra HTML
 * thì nó giữ đúng cỡ thật ở mọi bề ngang màn hình, còn phần hình học muốn co
 * giãn bao nhiêu cũng được.
 *
 * Màu của đường mang nghĩa trạng thái tài chính chứ không phải danh tính, nên
 * hai phương án cùng xếp loại sẽ ra cùng một màu. Để vẫn phân biệt được, mỗi
 * đường có thêm ba lớp nhận dạng phụ: kiểu nét đứt riêng, nhãn giá trị ở đầu
 * mút, và bảng số liệu mở ra được ngay dưới biểu đồ.
 */


/** Hệ toạ độ trong SVG là một ô vuông 1000x1000, được kéo giãn cho vừa khung. */
const BOX = 1000;

/** Nét của từng đường theo thứ tự. Đây là lớp nhận dạng khi màu trùng nhau. */
const DASHES = ['none', '7 5', '2 4', '10 4 2 4'];

/**
 * @param {{name:string, values:number[], tone:'safe'|'caution'|'risky'|'ink'}[]} series
 * @param {{id?:string, unit?:'money'|'months', animate?:boolean, guideAt?:number, guideLabel?:string, fillFirst?:boolean}} opts
 */
function lineChart(series, opts = {}) {
  const {
    id = 'chart', unit = 'money', animate = true,
    guideAt = null, guideLabel = '', fillFirst = false,
  } = opts;
  if (series.length === 0 || series[0].values.length === 0) return '';

  const span = Math.max(...series.map((s) => s.values.length)) - 1 || 1;
  const flat = series.flatMap((s) => s.values);
  const rawMax = Math.max(...flat, guideAt ?? -Infinity);
  const rawMin = Math.min(...flat, 0);
  const max = rawMax === rawMin ? rawMax + 1 : rawMax;
  const min = rawMin;

  // Toạ độ tính bằng phần trăm khung vẽ, nên HTML và SVG dùng chung một hệ.
  const px = (i) => (i / span) * 100;
  const py = (v) => 100 - ((v - min) / (max - min)) * 100;
  const u = (pct) => ((pct / 100) * BOX).toFixed(1);

  const ticks = [max, min + (max - min) / 2, min];
  const grid = ticks
    .map((t) => `<line class="axis" x1="0" y1="${u(py(t))}" x2="${BOX}" y2="${u(py(t))}" opacity="0.6" vector-effect="non-scaling-stroke"/>`)
    .join('');

  // Vùng dưới ngưỡng thận trọng được tô nhạt. Một dải nền đọc nhanh hơn một
  // đường nét đứt: mắt thấy ngay đường nào đang đi vào vùng đó.
  const guide = guideAt === null ? '' : `
<rect class="danger" x="0" y="${u(py(guideAt))}" width="${BOX}" height="${u(100 - py(guideAt))}"/>
<line class="guide" x1="0" y1="${u(py(guideAt))}" x2="${BOX}" y2="${u(py(guideAt))}" vector-effect="non-scaling-stroke"/>`;

  const areaGradientId = `df-area-${id}`;
  const area = fillFirst ? areaPath(series[0], px, py, u, animate, areaGradientId) : '';

  const paths = series
    .map((s, i) => {
      const d = s.values.map((v, k) => `${k === 0 ? 'M' : 'L'}${u(px(k))},${u(py(v))}`).join(' ');
      const dash = DASHES[i % DASHES.length];
      return `<path class="series" d="${d}" stroke="${strokeFor(s.tone)}"${dash === 'none' ? '' : ` stroke-dasharray="${dash}"`} vector-effect="non-scaling-stroke"/>`;
    })
    .join('');

  // Vẽ dần bằng một khung cắt trượt từ trái sang. Trục hoành là thời gian, nên
  // hướng chuyển động trùng với hướng dữ liệu chảy.
  const clipId = `wipe-${id}`;
  const wipe = `<defs><clipPath id="${clipId}"><rect class="wipe${animate ? ' wipe--animated' : ''}" x="0" y="0" width="${BOX}" height="${BOX}"/></clipPath></defs>`;

  const meta = escapeHtml(JSON.stringify({
    unit, span, min, max,
    series: series.map((s) => ({ name: s.name, tone: s.tone, values: s.values.map(round2) })),
  }));

  return `<div class="chart-wrap">
  <div class="chart-plot">
    <svg class="chart" viewBox="0 0 ${BOX} ${BOX}" preserveAspectRatio="none" role="img" data-chart="${meta}">
      <title>${escapeHtml(series.map((s) => s.name).join(', '))}</title>
      ${wipe}${grid}${guide}
      <g clip-path="url(#${clipId})">${area}${paths}</g>
      <line class="cursor" x1="0" x2="0" y1="0" y2="${BOX}" vector-effect="non-scaling-stroke"/>
    </svg>
    ${ticks.map((t) => `<span class="chart-y" style="top:${py(t).toFixed(2)}%">${axisLabel(t, unit)}</span>`).join('')}
    ${[0, Math.round(span / 2), span].map((i, k) => {
      const edge = k === 0 ? ' chart-x--start' : k === 2 ? ' chart-x--end' : '';
      return `<span class="chart-x${edge}" style="left:${px(i).toFixed(2)}%">tháng ${i}</span>`;
    }).join('')}
    ${guideAt === null ? '' : `<span class="chart-guide" style="top:${py(guideAt).toFixed(2)}%">${escapeHtml(guideLabel)}</span>`}
    ${endMarks(series, px, py, span, unit, animate)}
    ${series.map((s) => `<i class="chart-cursor-dot" style="background:${strokeFor(s.tone)}"></i>`).join('')}
    <div class="chart-tip" role="presentation"></div>
  </div>
</div>`;
}

/** Nền tô dưới đường đầu tiên, để mắt biết nên nhìn đường nào trước. */
function areaPath(s, px, py, u, animate, gradientId) {
  const line = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'}${u(px(i))},${u(py(v))}`).join(' ');
  const d = `${line} L${u(px(s.values.length - 1))},${BOX} L${u(px(0))},${BOX} Z`;
  return `<defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${strokeFor(s.tone)}" stop-opacity=".26"/><stop offset="100%" stop-color="${strokeFor(s.tone)}" stop-opacity="0"/></linearGradient></defs><path class="area${animate ? ' area--animated' : ''}" d="${d}" fill="url(#${gradientId})"/>`;
}

/**
 * Đầu mút mỗi đường: một chấm và một nhãn giá trị. Khi hai đường cùng xếp loại
 * nên cùng màu, đây là chỗ người đọc phân biệt được chúng. Nhãn nào sát nhau
 * quá thì được đẩy ra để không đè lên nhau.
 */
function endMarks(series, px, py, span, unit, animate) {
  const marks = series
    .map((s) => {
      const value = s.values[s.values.length - 1];
      return { tone: s.tone, value, at: py(value), label: py(value) };
    })
    .sort((a, b) => a.at - b.at);

  const MIN_GAP = 9;
  for (let i = 1; i < marks.length; i += 1) {
    if (marks[i].label - marks[i - 1].label < MIN_GAP) marks[i].label = marks[i - 1].label + MIN_GAP;
  }

  const left = px(span).toFixed(2);
  return marks
    .map((m) => `<i class="chart-dot${animate ? ' chart-dot--animated' : ''}" style="left:${left}%;top:${m.at.toFixed(2)}%;background:${strokeFor(m.tone)}"></i>
<span class="chart-end" style="top:${m.label.toFixed(2)}%;color:${strokeFor(m.tone)}">${axisLabel(m.value, unit)}</span>`)
    .join('');
}

/**
 * Bảng số liệu của biểu đồ. Có hai lý do: trình đọc màn hình không đọc được
 * đường vẽ, và người muốn con số chính xác thì không phải ước lượng bằng mắt.
 * Lấy mẫu thưa cho khỏi thành bảng hai mươi lăm dòng.
 */
function chartTable(series, unit = 'money') {
  if (series.length === 0 || series[0].values.length === 0) return '';
  const span = Math.max(...series.map((s) => s.values.length)) - 1 || 1;
  const step = Math.max(Math.round(span / 8), 1);

  const marks = [];
  for (let i = 0; i <= span; i += step) marks.push(i);
  if (marks[marks.length - 1] !== span) marks.push(span);

  const head = `<tr><th scope="col">Tháng</th>${series.map((s) => `<th scope="col">${escapeHtml(s.name)}</th>`).join('')}</tr>`;
  const body = marks
    .map((i) => `<tr><th scope="row">${i}</th>${series
      .map((s) => `<td>${axisLabel(s.values[Math.min(i, s.values.length - 1)], unit)}</td>`)
      .join('')}</tr>`)
    .join('');

  return `<details class="chart-data">
  <summary>Xem số liệu dạng bảng</summary>
  <div class="chart-data__scroll"><table>
    <thead>${head}</thead>
    <tbody>${body}</tbody>
  </table></div>
</details>`;
}

const round2 = (v) => Math.round(v * 100) / 100;

const axisLabel = (v, unit) => (unit === 'money' ? moneyShort(v) : `${decimal(v)} th`);

function strokeFor(tone) {
  if (tone === 'safe') return 'var(--safe)';
  if (tone === 'caution') return 'var(--caution)';
  if (tone === 'risky' || tone === 'blocked') return 'var(--risk)';
  return 'var(--ink)';
}

/** Chú giải màu cho biểu đồ. Không dùng chấm trang trí ở chỗ khác. */
function legend(series) {
  return `<div class="row small" style="margin-top:10px">${series
    .map((s, i) => {
      const dash = DASHES[i % DASHES.length];
      const style = dash === 'none'
        ? `background:${strokeFor(s.tone)}`
        : `background:repeating-linear-gradient(90deg, ${strokeFor(s.tone)} 0 4px, transparent 4px 7px)`;
      return `<span class="row" style="gap:6px"><span style="width:18px;height:2px;border-radius:2px;${style}"></span>${escapeHtml(s.name)}</span>`;
    })
    .join('')}</div>`;
}

// src/ui/motion.js
// ======================================================================
/**
 * Lớp tăng cường chạy sau khi màn hình đã được dựng xong.
 *
 * Vì sao tách riêng: mọi hàm dựng giao diện là hàm thuần nhận trạng thái trả về
 * chuỗi HTML, và đó là thứ bộ kiểm thử dựa vào. Nếu nhét chuyển động vào trong
 * chúng thì hoặc phải giả lập DOM khi kiểm thử, hoặc phải bỏ kiểm thử tầng giao
 * diện. Nên chuyển động sống ở đây, đọc DOM đã dựng và làm giàu thêm.
 *
 * Hệ quả quan trọng: HTML dựng ra đã chứa sẵn con số cuối cùng. Nếu trình duyệt
 * không chạy được phần này, hoặc người dùng tắt hiệu ứng chuyển động, sản phẩm
 * vẫn hiển thị đúng số. Chuyển động là lớp phủ, không phải điều kiện.
 */


const STILL = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Gọi một lần sau mỗi lần dựng lại màn hình. */
function enhanceView(root) {
  runCounters(root);
  bindChartTips(root);
  if (state.view === 'journey') { requestAnimationFrame(initJourneyCharts); }
}

/* ------------------------------------------------------------------ đếm số */

/**
 * Con số chạy từ 0 lên giá trị thật.
 *
 * Chỉ dùng cho những con số là kết luận của một phép tính: lãi suất thực, điểm
 * an toàn, bốn chỉ số nền. Chúng chạy lên để người xem hiểu đây là kết quả được
 * tính ra chứ không phải chữ in sẵn. Không dùng cho số liệu tra bảng.
 */
function runCounters(root) {
  const targets = root.querySelectorAll('[data-count]');
  if (STILL()) return;

  targets.forEach((el, i) => {
    const to = Number(el.dataset.count);
    if (!Number.isFinite(to)) return;

    const final = el.textContent;
    const kind = el.dataset.countKind || 'int';
    const startAt = performance.now() + i * 70;
    const DURATION = 780;

    // Con số thật không bị xoá đi cho tới khi khung hình đầu tiên thật sự chạy.
    // Trình duyệt tạm dừng requestAnimationFrame khi thẻ bị ẩn, và nếu xoá
    // trước thì người dùng quay lại sẽ thấy một bảng chỉ số toàn số 0.
    const step = (now) => {
      if (now < startAt) { requestAnimationFrame(step); return; }
      const t = Math.min((now - startAt) / DURATION, 1);
      if (t >= 1) { el.textContent = final; return; }
      el.textContent = formatCount(to * easeOut(t), kind);
      requestAnimationFrame(step);
    };

    requestAnimationFrame(step);
  });
}

const easeOut = (t) => 1 - (1 - t) ** 4;

function formatCount(v, kind) {
  if (kind === 'money') return money(v);
  if (kind === 'pct1') return percent(v, 1);
  if (kind === 'pct2') return percent(v, 2);
  if (kind === 'dec1') return decimal(v, 1);
  return String(Math.round(v));
}

/* -------------------------------------------------- vạch dò trên biểu đồ */

/**
 * Rê chuột dọc biểu đồ để đọc giá trị của mọi đường tại đúng tháng đó.
 *
 * Đây là chỗ câu chuyện đánh đổi nằm: hai phương án có thể cùng xếp loại nên
 * cùng màu, và bằng mắt thì chỉ thấy hai đường gần nhau. Vạch dò cho biết tại
 * tháng thứ mấy chúng tách ra và tách bao nhiêu.
 */
function bindChartTips(root) {
  root.querySelectorAll('.chart-wrap').forEach((wrap) => {
    const plot = wrap.querySelector('.chart-plot');
    const svg = wrap.querySelector('.chart');
    const tip = wrap.querySelector('.chart-tip');
    if (!plot || !svg || !tip || !svg.dataset.chart) return;

    let meta;
    try { meta = JSON.parse(svg.dataset.chart); } catch { return; }

    const cursor = svg.querySelector('.cursor');
    const dots = [...plot.querySelectorAll('.chart-cursor-dot')];

    // Toạ độ dùng chung một hệ phần trăm với lúc dựng, nên chỗ này không cần
    // biết khung vẽ đang rộng bao nhiêu pixel.
    const atY = (v) => 100 - ((v - meta.min) / (meta.max - meta.min)) * 100;
    const valueAt = (s, i) => s.values[Math.min(i, s.values.length - 1)];

    const move = (event) => {
      const box = plot.getBoundingClientRect();
      if (box.width === 0) return;

      const ratio = (event.clientX - box.left) / box.width;
      const index = Math.max(0, Math.min(Math.round(ratio * meta.span), meta.span));
      const at = (index / meta.span) * 100;

      cursor.setAttribute('x1', at * 10);
      cursor.setAttribute('x2', at * 10);

      let highest = 100;
      meta.series.forEach((s, i) => {
        const top = atY(valueAt(s, index));
        highest = Math.min(highest, top);
        if (dots[i]) { dots[i].style.left = `${at}%`; dots[i].style.top = `${top}%`; }
      });

      tip.innerHTML = `<div class="chart-tip__k">Tháng ${index}</div>${meta.series
        .map((s) => `<div class="chart-tip__row">
          <span class="chart-tip__swatch" style="background:${toneColour(s.tone)}"></span>
          <span>${s.name}</span>
          <b>${readout(valueAt(s, index), meta.unit)}</b>
        </div>`)
        .join('')}`;

      // Kẹp lại để hộp không thò ra ngoài mép biểu đồ trên màn hình hẹp.
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = `${Math.max(half, Math.min((at / 100) * box.width, box.width - half))}px`;
      tip.style.top = `${(highest / 100) * box.height}px`;
      wrap.dataset.hover = 'on';
    };

    plot.addEventListener('pointermove', move);
    plot.addEventListener('pointerdown', move);
    plot.addEventListener('pointerleave', () => { wrap.dataset.hover = 'off'; });
  });
}

const readout = (v, unit) => (unit === 'money' ? money(v) : `${decimal(v)} tháng`);

function toneColour(tone) {
  if (tone === 'safe') return 'var(--safe)';
  if (tone === 'caution') return 'var(--caution)';
  if (tone === 'risky' || tone === 'blocked') return 'var(--risk)';
  return 'var(--ink)';
}

/**
 * Dựng các phương án để so sánh, từ dữ liệu người dùng nhập.
 *
 * Tách khỏi tầng giao diện để kiểm thử được: mỗi hàm nhận một hàm đọc số và hồ
 * sơ hiện tại, trả về danh sách phương án. Không đụng tới DOM.
 *
 * @typedef {(name: string) => number} Reader
 */






class ScenarioError extends Error {}

/** Mua sắm giá trị lớn: trả thẳng, trả góp, trì hoãn. */
function buildPurchase(read) {
  const price = read('price');
  if (!(price > 0)) throw new ScenarioError('Hãy nhập giá món hàng lớn hơn 0.');

  const downPayment = clamp(read('downPayment'), 0, price);
  const months = Math.max(Math.round(read('months')) || 12, 1);
  const flatMonthly = read('flatRate') / 100;
  const delayMonths = Math.max(Math.round(read('delayMonths')) || 0, 0);

  const installment = analyseInstallment({ price, downPayment, months, flatMonthly });
  const installmentLabel = `Trả góp ${months} tháng`;

  const events = [
    makeEvent('Trả thẳng toàn bộ', { upfront: price }),
    makeEvent(installmentLabel, {
      upfront: downPayment, recurring: installment.payment, recurringMonths: months,
    }),
  ];

  if (delayMonths > 0) {
    const inflated = price * (1 + monthlyRate(ASSUMPTIONS.inflationApr)) ** delayMonths;
    events.push(makeEvent(`Trì hoãn ${delayMonths} tháng rồi mua`, { delayMonths, delayed: inflated }));
  }

  return { events, installment, extras: { [installmentLabel]: { installment } } };
}

/** So sánh nhiều gói trả góp, kèm phương án không vay làm mốc đối chứng. */
function buildInstallment(read) {
  const price = read('price');
  if (!(price > 0)) throw new ScenarioError('Hãy nhập giá món hàng lớn hơn 0.');

  const downPayment = clamp(read('downPayment'), 0, price);
  const packs = [
    { key: 'A', months: Math.max(Math.round(read('monthsA')) || 6, 1), flat: read('flatA') / 100 },
    { key: 'B', months: Math.max(Math.round(read('monthsB')) || 12, 1), flat: read('flatB') / 100 },
  ];

  const events = [makeEvent('Trả thẳng, không vay', { upfront: price })];
  const extras = {};
  let costliest = null;

  for (const pack of packs) {
    const analysis = analyseInstallment({ price, downPayment, months: pack.months, flatMonthly: pack.flat });
    const label = `Gói ${pack.key}: ${pack.months} tháng`;
    events.push(makeEvent(label, {
      upfront: downPayment, recurring: analysis.payment, recurringMonths: pack.months,
    }));
    extras[label] = { installment: analysis };
    if (!costliest || analysis.trueApr > costliest.trueApr) costliest = analysis;
  }

  return { events, extras, installment: costliest };
}

/**
 * Phân bổ giữa hai mục tiêu. Mỗi cách chia là một hồ sơ khác nhau chứ không
 * phải một sự kiện dòng tiền khác nhau, nên trả về danh sách kịch bản.
 */
function buildAllocation(_read, profile) {
  const goals = normaliseWeights(profile.goals);
  if (goals.length < 2) throw new ScenarioError('Nhóm quyết định này cần ít nhất hai mục tiêu.');

  const candidates = [[0.8, 0.2], [0.5, 0.5], [0.2, 0.8], [goals[0].allocWeight, goals[1].allocWeight]];
  const seen = new Set();

  const scenarios = candidates
    .filter(([a, b]) => {
      const key = `${Math.round(a * 100)}-${Math.round(b * 100)}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .map(([a, b]) => ({
      profile: { ...profile, goals: [{ ...goals[0], allocWeight: a }, { ...goals[1], allocWeight: b }] },
      event: makeEvent(`${Math.round(a * 100)}% cho ${goals[0].name}, ${Math.round(b * 100)}% cho ${goals[1].name}`),
    }));

  return { scenarios };
}

/**
 * Điều chỉnh mức tiết kiệm. Tiết kiệm thêm nghĩa là cắt bớt chi tiêu linh hoạt,
 * nên dòng tiền dư tăng đúng bằng phần cắt đi, và không cắt quá số đang có.
 */
function buildSavings(read, profile) {
  const delta = read('savingsDelta');
  if (!(delta > 0)) throw new ScenarioError('Hãy nhập số tiền tiết kiệm thêm lớn hơn 0.');

  const seen = new Set();
  const events = [0, delta, delta * 2]
    .map((d) => Math.min(d, profile.discretionary))
    .filter((d) => {
      const key = Math.round(d);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .map((d) => makeEvent(
      d === 0 ? 'Giữ nguyên như hiện tại' : `Tiết kiệm thêm ${money(d)} mỗi tháng`,
      { surplusDelta: d },
    ));

  if (events.length < 2) {
    throw new ScenarioError('Chi tiêu linh hoạt hiện tại không đủ để cắt thêm. Hãy kiểm tra lại hồ sơ.');
  }
  return { events };
}

const BUILDERS = {
  purchase: buildPurchase,
  installment: buildInstallment,
  allocation: buildAllocation,
  savings: buildSavings,
};

const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
