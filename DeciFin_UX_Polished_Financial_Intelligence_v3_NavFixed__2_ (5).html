  // Section 11: Health Score phải có lý do — so sánh với lần ghi gần nhất (không phải hôm nay) để
  // biết điểm tăng/giảm bao nhiêu, rồi suy ra thành phần thay đổi nhiều nhất từ chính scoreData.parts
  // (không bịa lý do: nếu chưa có lịch sử hoặc điểm không đổi, không hiển thị dòng lý do).
  const healthDelta = (() => {
    const KEY = 'DECIFIN_HEALTH_HISTORY';
    let hist = [];
    try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); hist = Array.isArray(v) ? v : []; } catch {}
    const today = new Date().toISOString().slice(0, 10);
    const prevEntry = [...hist].reverse().find(x => x && x.date && x.date !== today);
    const todayIdx = hist.findIndex(x => x && x.date === today);
    const entry = { date: today, total: health, parts: scoreData.parts };
    if (todayIdx >= 0) hist[todayIdx] = entry; else hist.push(entry);
    try { localStorage.setItem(KEY, JSON.stringify(hist.slice(-60))); } catch {}
    if (!prevEntry || !Number.isFinite(prevEntry.total)) return null;
    const diff = health - prevEntry.total;
    if (diff === 0) return null;
    const PART_LABEL = { liquidity: 'quỹ dự phòng', debt: 'nghĩa vụ nợ', cashflow: 'dòng tiền dư', goals: 'tiến độ mục tiêu', stability: 'sự ổn định thu nhập' };
    let topKey = null, topChange = 0;
    if (prevEntry.parts) {
      Object.keys(scoreData.parts).forEach((k) => {
        const change = scoreData.parts[k] - (Number(prevEntry.parts[k]) || 0);
        if (Math.abs(change) > Math.abs(topChange)) { topChange = change; topKey = k; }
      });
    }
    const reason = topKey
      ? (diff > 0 ? `Nhờ ${PART_LABEL[topKey]} cải thiện.` : `Do ${PART_LABEL[topKey]} đang kém đi.`)
      : '';
    return { diff, reason };
  })();
  const cashflowTone = b.surplus > 0 && b.savingsRate >= .2 ? 'safe' : b.surplus > 0 ? 'caution' : 'risky';
  const runwayTone = b.runway >= 6 ? 'safe' : b.runway >= 3 ? 'caution' : 'risky';
  const dtiTone = b.dti <= .3 ? 'safe' : b.dti <= .4 ? 'caution' : 'risky';
  const essentialRatio = p.income > 0 ? p.essential / p.income : 0;
  const flexibleRatio = p.income > 0 ? p.discretionary / p.income : 0;
  const debtRatio = p.income > 0 ? b.debtPayments / p.income : 0;
  const savingsRatio = Math.max(0, 1 - essentialRatio - flexibleRatio - debtRatio);
  const wishlistData = (() => { try { const v=JSON.parse(localStorage.getItem('DECIFIN_WISHLIST')||'[]'); return Array.isArray(v)?v:[]; } catch { return []; } })();
  const historyData = (() => { try { const v=JSON.parse(localStorage.getItem('decifin.history.v1')||'[]'); return Array.isArray(v)?v:[]; } catch { return []; } })();
  const nowDate = new Date();
  const previousMonthSOS = historyData.some(x => { const d=new Date(x.at); const text=`${x?.label||''} ${x?.detail||''}`.toLowerCase(); return !isNaN(d) && d.getFullYear()===new Date(nowDate.getFullYear(),nowDate.getMonth()-1,1).getFullYear() && d.getMonth()===new Date(nowDate.getFullYear(),nowDate.getMonth()-1,1).getMonth() && /cứu net|sos|thủng ví/.test(text); });
  // Ưu tiên cảnh báo rủi ro thật trước, chỉ hiện nudge tích cực khi nền tảng tài chính đã an toàn
  // — tránh việc một tín hiệu tích cực (wishlist/SOS) che mất một rủi ro đang hoạt động (runway/DTI thấp).
  const riskInsight = b.surplus <= 0
    ? ['risk','Dòng tiền đang âm','Chi phí hiện tại cao hơn thu nhập. Hãy thử mô phỏng một khoản cắt giảm trước khi đưa ra quyết định mới.']
    : b.runway < 3
      ? ['warn','Quỹ dự phòng còn mỏng',`Bạn mới có khoảng ${decimal(b.runway)} tháng chi phí tối thiểu. Mốc 3 tháng sẽ là bước cải thiện đáng kể.`]
      : b.dti > .4
        ? ['risk','Nợ đang chiếm tỷ trọng cao',`Khoản trả nợ chiếm ${percent(b.dti)} thu nhập. Nên thận trọng trước khi vay thêm.`]
        : null;
  const dynamicNudge = riskInsight ? null : (wishlistData[0]?.name && b.surplus > 0
    ? ['good','Đang tiến gần mục tiêu!',`Dòng tiền này giúp bạn rút ngắn mục tiêu mua ${escapeHtml(wishlistData[0].name)} đáng kể! Cố lên!`]
    : previousMonthSOS && b.surplus > 0
      ? ['safe','Phục hồi xuất sắc',`Tháng trước vừa vượt qua khủng hoảng. Tháng này dư ${money(b.surplus)} là một nỗ lực tuyệt vời. Giữ vững nhé!`]
      : null);
  const topInsight = riskInsight || dynamicNudge ||
    ['good','Bạn đang kiểm soát dòng tiền tốt',`Bạn còn ${money(b.surplus)} mỗi tháng sau các khoản chi và nghĩa vụ nợ hiện tại.`];

  const series = goals.map((g, i) => ({
    name: g.name,
    tone: i === 0 ? 'ink' : 'caution',
    values: accumulationPath(g.saved, b.surplus * g.allocWeight, 24),
  }));

  return `
<section class="view stack df-health-page">
  ${state.focusMode ? `<div class="df-focus-banner"><div><span>🎯 CHẾ ĐỘ TẬP TRUNG</span><strong>Mục tiêu duy nhất: ${escapeHtml(goals[0]?.name || 'mục tiêu ưu tiên')}</strong><p>Tiết kiệm đủ ${money(goals[0]?.target || 0)} để tiến tới mục tiêu này mà không phá vùng an toàn.</p></div><button class="btn btn--ghost" data-action="focus-toggle">Tắt Focus</button></div>` : ""}
  <div class="df-health-hero rise">
    <div class="df-health-hero__copy">
      <p class="eyebrow" style="color:#CFC9FF">FINANCIAL HEALTH</p>
      <h1>Hiện tại, tài chính của bạn đang ở đâu?</h1>
      <p class="df-health-hero__lede">Một bức tranh đơn giản về dòng tiền, quỹ dự phòng, nợ và mục tiêu — để bạn biết nên chú ý điều gì trước tiên.</p>
      <div class="df-health-hero__chips">
        <span>✓ Dữ liệu của bạn</span><span>✓ Tính toán trên thiết bị</span><span>✓ Không phải điểm tín dụng</span>
      </div>
    </div>
    <div class="df-health-score" style="--score:${health*3.6}deg">
      <div class="df-health-score__ring"><div class="df-health-score__inside"><strong data-count="${health}" data-count-kind="int">${health}</strong><span>/100</span><small>${healthLabel}</small>${healthDelta ? `<div class="df-health-delta ${healthDelta.diff > 0 ? 't-safe' : 't-risky'}">${healthDelta.diff > 0 ? '↑' : '↓'} ${Math.abs(healthDelta.diff)}</div>` : ''}</div></div>
    </div>
    <div class="df-health-decibo">
      <div class="df-mini-decibo df-decibo"><span class="df-decibo__antenna"></span><span class="df-decibo__dot"></span><div class="df-decibo__body"></div><span class="df-decibo__eye df-decibo__eye--l"></span><span class="df-decibo__eye df-decibo__eye--r"></span><span class="df-decibo__mouth"></span></div>
      <div><b>Decibo nói:</b><p>${healthDelta && healthDelta.reason ? healthDelta.reason : health >= 75 ? 'Bạn đang có một nền tảng khá ổn. Hãy tập trung vào mục tiêu tiếp theo nhé!' : health >= 55 ? 'Có vài điểm cần chú ý, nhưng bạn hoàn toàn có thể cải thiện từng bước.' : 'Mình thấy một vài tín hiệu rủi ro. Đừng lo — hãy xử lý từng điểm một.'}</p>${healthDelta ? `<p class="df-health-delta-note small" style="margin-top:4px;opacity:.7">Điểm ${healthDelta.diff > 0 ? 'tăng' : 'giảm'} ${Math.abs(healthDelta.diff)} so với lần gần nhất bạn ghé Bảng chỉ số.</p>` : ''}</div>
    </div>
  </div>

  <div class="df-health-kpis">
    ${metric({label:'💰 Dòng tiền', value:money(b.surplus), tone:cashflowTone, note:dynamicNudge ? dynamicNudge[2] : `${percent(b.savingsRate)} thu nhập còn lại`, count:b.surplus, kind:'money', at:0})}
    ${metric({label:'🛡 Quỹ dự phòng', tone:runwayTone, note:runwayNote(b.runway), value:decimal(b.runway), suffix:' tháng', count:Number.isFinite(b.runway)?b.runway:null, kind:'dec1', at:1})}
    ${metric({label:'💳 Nợ / thu nhập', value:percent(b.dti), tone:dtiTone, note:b.dti===0?'Bạn chưa có nghĩa vụ nợ':'Mục tiêu tham chiếu ≤ 30%', count:b.dti, kind:'pct1', at:2})}
  </div>

  <div class="df-health-grid">
    <div class="shell-card rise"><div class="shell-card__core">
      <div class="df-health-section-title"><div><p class="eyebrow">MỘT CÁI NHÌN</p><h2>Tiền của bạn đang đi đâu?</h2></div><span class="df-info-pill">Thu nhập / tháng</span></div>
      <div class="df-money-flow">
        <div class="df-donut" style="--essential:${Math.max(0,essentialRatio*100)}%;--flex:${Math.max(0,flexibleRatio*100)}%;--debt:${Math.max(0,debtRatio*100)}%;--save:${Math.max(0,savingsRatio*100)}%"><div><strong>${money(p.income)}</strong><span>thu nhập</span></div></div>
        <div class="df-money-legend">
          <div><i class="df-dot df-dot--essential"></i><span>Chi phí thiết yếu</span><b>${percent(essentialRatio)}</b></div>
          <div><i class="df-dot df-dot--flex"></i><span>Chi tiêu linh hoạt</span><b>${percent(flexibleRatio)}</b></div>
          <div><i class="df-dot df-dot--debt"></i><span>Nghĩa vụ nợ</span><b>${percent(debtRatio)}</b></div>
          <div><i class="df-dot df-dot--save"></i><span>Còn lại / tiết kiệm</span><b>${percent(savingsRatio)}</b></div>
        </div>
      </div>
      <div class="df-plain-tip"><span>💡</span><p>${b.surplus >= 0 ? `Sau các khoản chính, bạn còn <strong>${money(b.surplus)}</strong> để tiết kiệm, đầu tư hoặc dành cho mục tiêu.` : `Bạn đang thiếu <strong>${money(Math.abs(b.surplus))}</strong> mỗi tháng. Đây là điểm nên xử lý trước khi tăng chi tiêu.`}</p></div>
    </div></div>

    <div class="shell-card rise"><div class="shell-card__core">
      <div class="df-health-section-title"><div><p class="eyebrow">QUICK CHECK</p><h2>3 điều bạn nên biết</h2></div></div>
      <div class="df-health-insight ${topInsight[0]}"><span>${topInsight[0]==='good'?'✓':topInsight[0]==='warn'?'!':'×'}</span><div><b>${topInsight[1]}</b><p>${topInsight[2]}</p></div></div>
      <div class="df-health-check-row"><span>Khả năng ứng phó</span><div class="df-mini-bar"><i style="width:${Math.min(100, b.runway/6*100)}%"></i></div><b>${Math.round(Math.min(100,b.runway/6*100))}%</b></div>
      <div class="df-health-check-row"><span>Khoảng đệm dòng tiền</span><div class="df-mini-bar"><i style="width:${Math.min(100,Math.max(0,b.savingsRate/0.3*100))}%"></i></div><b>${Math.round(Math.min(100,Math.max(0,b.savingsRate/0.3*100)))}%</b></div>
      <div class="df-health-check-row"><span>Kiểm soát nợ</span><div class="df-mini-bar"><i style="width:${Math.max(0,Math.min(100,(1-b.dti/.6)*100))}%"></i></div><b>${Math.round(Math.max(0,Math.min(100,(1-b.dti/.6)*100)))}%</b></div>
    </div></div>
  </div>

  ${goals.length > 0 ? `
  <div class="shell-card rise"><div class="shell-card__core">
    <div class="df-health-section-title"><div><p class="eyebrow">FUTURE VIEW</p><h2>🎯 Mục tiêu đang tiến tới đâu?</h2><p class="small muted">Nếu bạn giữ nhịp dòng tiền hiện tại.</p></div><button class="btn btn--ghost" data-action="go" data-view="profile">Chỉnh mục tiêu</button></div>
    <div class="df-goal-strip">${goals.map((g)=>{const progress=Math.min(100,Math.max(0,(g.saved/(g.target||1))*100));const eta=monthsToGoal(g.target,g.saved,b.surplus*g.allocWeight);const late=!(eta<=g.deadlineMonth);return `<div class="df-goal-card"><div class="df-goal-card__top"><span class="df-goal-icon">${g.name.toLowerCase().includes('du học')?'🎓':g.name.toLowerCase().includes('laptop')?'💻':'🎯'}</span><div><b>${escapeHtml(g.name)}</b><small>${moneyShort(g.saved)} / ${moneyShort(g.target)}</small></div><strong>${Math.round(progress)}%</strong></div><div class="df-goal-bar"><i style="width:${progress}%"></i></div><div class="df-goal-card__bottom"><span>${eta===Infinity?'Chưa xác định':`Dự kiến ${monthsInt(eta)}`}</span><span class="chip chip--${late?'caution':'safe'}">${late?`Có thể trễ hạn ${g.deadlineMonth} tháng`:'Kịp hạn'}</span></div></div>`}).join('')}</div>
  </div></div>` : `
  <div class="df-empty-goal shell-card rise"><div class="shell-card__core"><div><p class="eyebrow">YOUR FUTURE</p><h2>🎯 Chưa có mục tiêu nào</h2><p class="muted" style="margin-top:6px">Một mục tiêu nhỏ giúp các con số trên trang này trở nên có ý nghĩa hơn.</p></div><button class="btn" data-action="go" data-view="profile">Tạo mục tiêu đầu tiên →</button></div></div>`}

  ${goals.length > 0 ? `<div class="shell-card rise"><div class="shell-card__core"><div class="df-health-section-title"><div><p class="eyebrow">24 MONTHS</p><h2>📈 Bức tranh 24 tháng</h2><p class="small muted">Đây là mô phỏng, không phải dự báo chắc chắn.</p></div></div><div style="margin-top:16px">${lineChart(series,{id:'goals',unit:'money'})}</div>${legend(series)}</div></div>` : ''}

  <div class="df-next-step">
    <div><p class="eyebrow" style="color:#CFC9FF">NEXT STEP</p><h2>Muốn hiểu rõ hơn trước khi quyết định?</h2><p>Học một khái niệm, sau đó thử ngay bằng một mô phỏng của chính bạn.</p></div>
    <div class="df-next-step__actions"><button class="btn df-next-step__primary" data-action="go" data-view="learn">📚 Học tài chính</button><button class="btn df-next-step__secondary" data-action="go" data-view="decision">🔮 Tạo mô phỏng</button></div>
  </div>

  <div><div class="df-health-section-title"><div><p class="eyebrow">DECISION CENTER</p><h2>Bạn đang cân nhắc điều gì?</h2></div></div><div class="grid-2" style="margin-top:16px">${DECISION_KINDS.map((k,i)=>`<button class="panel panel--action rise" data-action="pick-decision" data-kind="${k.id}" style="animation-delay:${i*.05}s"><h3>${k.name}</h3><p class="small muted" style="margin-top:6px">${k.blurb}</p><span class="small" style="display:inline-block;margin-top:12px">Ví dụ: ${k.example} <span class="go">↗</span></span></button>`).join('')}</div></div>
</section>`;
}

/**
 * Một thẻ chỉ số.
 *
 * `count` là giá trị số thô để lớp chuyển động cho chạy từ 0 lên. Chuỗi hiển
 * thị đã nằm sẵn trong HTML nên nếu không có JavaScript chuyển động thì thẻ vẫn
 * đúng. Truyền null khi con số không hữu hạn, lúc đó không có gì để đếm.
 */
function metric({ label, value, suffix = '', note, tone, count = null, kind = 'int', at = 0 }) {
  const counter = count === null
    ? value
    : `<span data-count="${count}" data-count-kind="${kind}">${value}</span>`;

  return `<div class="metric metric--${tone} rise" style="animation-delay:${(at * 0.07).toFixed(2)}s">
    <div class="metric__label">${label}</div>
    <div class="metric__value figure t-${tone}">${counter}${suffix}</div>
    <div class="metric__note muted">${note}</div>
  </div>`;
}

function runwayNote(runway) {
  if (runway >= ASSUMPTIONS.runwaySafe) return 'Đạt mức an toàn 6 tháng';
  if (runway >= ASSUMPTIONS.runwayCaution) return 'Chưa đạt mức an toàn 6 tháng';
  return 'Dưới ngưỡng thận trọng 3 tháng';
}

  }
  return `
  <p class="lede">Ba cách chia dòng tiền dư ${money(baseline(state.profile).surplus)} mỗi tháng giữa
  <strong>${escapeHtml(goals[0].name)}</strong> và <strong>${escapeHtml(goals[1].name)}</strong>.</p>
  <div class="rows" style="margin-top:18px">
    ${[[80, 20], [50, 50], [20, 80]].map(([a, bb]) => `

function compareView(state) {
  const rawResults = Array.isArray(state.results) ? state.results : [];
  const results = rawResults.filter((r) => r && r.outcome && r.score && Number.isFinite(Number(r.score.total)));

  if (!results.length) {
    return `<section class="view stack compare-view">
      <div class="df-compare-empty">
        <div class="df-compare-empty__icon">↗</div>
        <p class="eyebrow">Chưa có mô phỏng</p>
        <h1 style="margin-top:8px">Hãy tạo một quyết định trước</h1>
        <p class="lede" style="margin-top:10px">Nhập một quyết định để DeciFin có thể so sánh dòng tiền, quỹ dự phòng và tác động tới mục tiêu của bạn.</p>
        <button class="btn" data-action="go" data-view="decision" style="margin-top:18px">Tạo quyết định →</button>
      </div>
    </section>`;
  }

  const safeNumber = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;
  const cheapestIndex = results.reduce((best, r, i) =>
    safeNumber(r.outcome.totalCash, Infinity) < safeNumber(results[best].outcome.totalCash, Infinity) ? i : best, 0);
  const best = results[0];

  const runwaySeries = results.map((r, i) => ({
    name: r.label || `Phương án ${i + 1}`,
    tone: r.score.band || 'caution',
    values: runwayPath(state.profile || EMPTY_PROFILE, r.outcome),
  }));

  const comparisonRows = [
    ['Điểm an toàn', (r) => `${decimal(safeNumber(r.score.total))} / 100`],
    ['Tổng tiền chi', (r) => money(safeNumber(r.outcome.totalCash))],
    ['Giá trị hiện tại', (r) => money(safeNumber(r.outcome.presentValue))],
    ['Quỹ dự phòng còn', (r) => runwayMonths(safeNumber(r.outcome.runwayAfter, NaN))],
    ['Nghĩa vụ nợ', (r) => percent(safeNumber(r.outcome.dtiAfter))],
  ];

  const chartId = `runway-${state.results.length}-${Math.random().toString(36).slice(2, 8)}`;

  return `<section class="view stack compare-view">
    <div class="spread">
      <div>
        <p class="eyebrow">Kết quả mô phỏng</p>
        <h1 style="margin-top:8px;max-width:24ch">Nhìn thấy hệ quả trước khi chọn</h1>
        <p class="lede" style="margin-top:10px">DeciFin đặt các phương án cạnh nhau để bạn nhìn rõ đánh đổi về tiền mặt, an toàn tài chính và mục tiêu dài hạn.</p>
      </div>
      <button class="btn btn--ghost" data-action="go" data-view="decision">Sửa phương án</button>
    </div>

    <div class="df-compare-summary">
      <div>
        <span class="df-compare-summary__label">Phương án đang đứng đầu</span>
        <strong>${escapeHtml(best.label || 'Phương án 1')}</strong>
        <span class="chip chip--${best.score.band || 'caution'}">${BAND_LABEL[best.score.band] || 'Cần xem xét'}</span>
      </div>
      <div class="df-compare-summary__score">
        <span>Điểm an toàn</span>
        <b>${decimal(safeNumber(best.score.total))}</b><small>/100</small>
      </div>
      <div>
        <span class="df-compare-summary__label">Tổng tiền chi</span>
        <strong>${money(safeNumber(best.outcome.totalCash))}</strong>
      </div>
    </div>

    ${state.installment ? aprReveal(state.installment) : ''}

    <div class="compare compare--enhanced">
      ${results.map((r, i) => optionCard(r, i, i === cheapestIndex)).join('')}
    </div>

    <div class="df-compare-table shell-card">
      <div class="shell-card__core">
        <div class="spread">
          <div><h2>So sánh nhanh</h2><p class="small muted" style="margin-top:5px">Các chỉ số được tính từ cùng một hồ sơ tài chính.</p></div>
          <span class="df-compare-badge">${results.length} góc nhìn</span>
        </div>
        <div class="df-table-scroll">
          <table>
            <thead><tr><th>Chỉ số</th>${results.map((r, i) => `<th><span class="df-table-rank">${i + 1}</span>${escapeHtml(r.label || `Phương án ${i + 1}`)}</th>`).join('')}</tr></thead>
            <tbody>${comparisonRows.map(([label, fn]) => `<tr><th>${label}</th>${results.map((r) => `<td>${fn(r)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="shell-card">
      <div class="shell-card__core">
        <h2>Quỹ dự phòng trong 24 tháng tới</h2>
        <p class="small muted" style="margin-top:6px">Vùng tô nhạt nằm dưới ngưỡng thận trọng ${ASSUMPTIONS.runwayCaution} tháng. Rê chuột dọc biểu đồ để đọc giá trị của các phương án tại cùng một tháng.</p>
        <div style="margin-top:16px">${lineChart(runwaySeries, { id: chartId, unit: 'months', fillFirst: true, guideAt: ASSUMPTIONS.runwayCaution, guideLabel: 'ngưỡng thận trọng' })}</div>
        ${legend(runwaySeries)}

  </section>`;

        escapeHtml(g.name),
        !Number.isFinite(g.etaAfter) ? 'không đạt'
          : !Number.isFinite(g.delayMonths) || g.delayMonths === 0 ? `${monthsInt(g.etaAfter)}`
          : g.delayMonths > 0 ? `${monthsInt(g.etaAfter)} (chậm ${g.delayMonths})`
          : `${monthsInt(g.etaAfter)} (sớm hơn ${Math.abs(g.delayMonths)})`,

const stat = (k, v) => `<div class="stat"><div class="stat__k">${k}</div><div class="stat__v figure">${v}</div></div>`;

/**
 * Quỹ dự phòng theo tháng sau quyết định. Khoản trả góp kết thúc khi hết kỳ hạn
 * nên đường biểu diễn sẽ dốc lên trở lại từ thời điểm đó.
 */
function runwayPath(profile, outcome) {
  const path = [];
  const p = profile || EMPTY_PROFILE;
  const o = outcome || {};
  let liquid = Number.isFinite(Number(o.liquidAfter)) ? Number(o.liquidAfter) : Number(p.liquidAssets) || 0;
  const essential = Number(p.essential) || 0;
  const income = Number(p.income) || 0;
  const discretionary = Number(p.discretionary) || 0;
  const surplusAfter = Number.isFinite(Number(o.surplusAfter)) ? Number(o.surplusAfter) : (income - essential - discretionary);
  const minimumSpend = essential + (income - essential - discretionary - surplusAfter);
  const denominator = minimumSpend > 0 ? minimumSpend : (essential > 0 ? essential : 1);
  for (let t = 0; t <= 24; t += 1) {
    const value = liquid / denominator;
    path.push(Number.isFinite(value) ? Math.max(value, 0) : 0);
    liquid = Math.max(liquid + surplusAfter, 0);
  }
  return path;
}

// Uses the existing local decision history / wishlist data. No new backend.

function journeyView(state) {
  const read=(key,fallback=[])=>{try{const v=JSON.parse(localStorage.getItem(key)||'null');return v==null?fallback:v}catch{return fallback}};
  const esc=v=>typeof escapeHtml==='function'?escapeHtml(String(v??'')):String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
  const p=state.profile||EMPTY_PROFILE;
  const historyRaw=read('decifin.history.v1',[]); const history=Array.isArray(historyRaw)?historyRaw:[];
  const wishlistRaw=read('DECIFIN_WISHLIST',[]); const wishlist=Array.isArray(wishlistRaw)?wishlistRaw:[];
  const now=new Date(); now.setHours(12,0,0,0);
  const dayDiff=d=>Math.floor((now-new Date(d))/86400000);
  const toneOf=x=>{if(x&&['safe','caution','risk'].includes(x.tone))return x.tone;const s=`${x?.label||''} ${x?.detail||''}`.toLowerCase();if(/sos|cứu net|thủng|rủi ro|blocked|không khuyến/i.test(s))return'risk';if(/trả góp|chi lớn|cân nhắc|caution|wishlist|hoãn/i.test(s))return'caution';return'safe'};
  const moneyText=n=>typeof money==='function'?money(Number(n)||0):`${Math.round(Number(n)||0).toLocaleString('vi-VN')} đ`;
  const base=typeof baseline==='function'?baseline(p):{surplus:0,runway:0,dti:0};
  const recent=history.filter(x=>{const d=dayDiff(x.at);return d>=0&&d<35});
  const safeN=recent.filter(x=>toneOf(x)==='safe').length,cautionN=recent.filter(x=>toneOf(x)==='caution').length,riskN=recent.filter(x=>toneOf(x)==='risk').length;
  const goalList=(p.goals||[]).filter(g=>g&&g.target); const goalProgress=goalList.length?goalList.reduce((a,g)=>a+Math.min(1,(g.saved||0)/g.target),0)/goalList.length:0;
  const discipline=Math.min(96,58+safeN*5+cautionN*2);
  const prudence=Math.min(96,Math.max(35,66+safeN*4-riskN*11));
  const interestSaver=Math.min(97,60+recent.filter(x=>/lãi|trả góp|hoãn|chờ|wishlist/i.test(`${x.label} ${x.detail}`)).length*7);
  const longTerm=Math.min(96,54+goalProgress*32+recent.filter(x=>/mục tiêu|tiết kiệm|hoãn|chờ/i.test(`${x.label} ${x.detail}`)).length*5);
  const impulsive=Math.min(95,25+riskN*15+cautionN*4);
  const radar=[discipline,prudence,interestSaver,longTerm,impulsive]; const avg=Math.round(radar.reduce((a,b)=>a+b,0)/5);
  const persona=interestSaver>=82?'Chiến thần né lãi suất':discipline>=82?'Kỷ luật dòng tiền':prudence>=82?'Người giữ lá chắn':longTerm>=82?'Người chơi đường dài':'Người cân bằng';
  const filter=state.journeyFilter||'month';
  const filtered=filter==='week'?history.filter(x=>dayDiff(x.at)>=0&&dayDiff(x.at)<7):filter==='year'?history.filter(x=>new Date(x.at).getFullYear()===now.getFullYear()):history.filter(x=>{const d=new Date(x.at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});

  const mock=[
    {at:new Date(now.getFullYear(),now.getMonth()-1,15,12),label:'Đưa MacBook vào Giỏ quyết định',amount:28000000,detail:'Bạn chọn tạo khoảng đệm thay vì thanh toán ngay.',tone:'caution',consequence:'Chờ đủ khả năng chi trả giúp tránh áp lực trả góp và giữ nguyên quỹ dự phòng.'},
    {at:new Date(now.getFullYear(),now.getMonth(),now.getDate()-7,12),label:'Từ chối gói vay 20 triệu',amount:20000000,detail:'Bạn nhận ra chi phí vốn cao hơn lợi ích của việc sở hữu ngay.',tone:'safe',consequence:'Không phát sinh nghĩa vụ nợ mới; DTI và runway được bảo vệ.'},
    {at:new Date(now.getFullYear(),now.getMonth(),now.getDate(),12),label:'Mua MacBook bằng tiền mặt',amount:28000000,detail:'Mục tiêu đã đủ tiền — lần này bạn mua khi đã sẵn sàng.',tone:'safe',consequence:'Không trả lãi. Quyết định hôm nay là hệ quả trực tiếp của lần kiềm chế trước.'}
  ];
  const actual=filtered.slice().sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(-8).map(x=>({at:new Date(x.at),label:x.label||'Quyết định tài chính',amount:x.amount||x.price||0,detail:x.detail||'DeciFin đã ghi lại quyết định này.',tone:toneOf(x),consequence:null}));
  const events=actual.length>=3?actual:mock;
  const consequence=x=>x.consequence||(/sos|cứu/i.test(`${x.label} ${x.detail}`)?'DeciFin phát hiện điểm căng và kích hoạt tư duy Plan B.':/lãi|trả góp/i.test(`${x.label} ${x.detail}`)?'Bạn tạo thêm một tín hiệu để Decibo học cách né chi phí lãi.':/mục tiêu|tiết kiệm|hoãn|chờ|wishlist/i.test(`${x.label} ${x.detail}`)?'Hành động này đang bảo vệ mục tiêu dài hạn.':'Quyết định được lưu để tạo thành bức tranh hành vi theo thời gian.');

  /* 12 weeks × 7 weekdays. Data is deterministic, not random, so the demo remains stable. */
  const weeks=12, heat=[]; const seedText=history.length+wishlist.length+Math.round(base.surplus/100000);
  for(let w=0;w<weeks;w++)for(let dow=0;dow<7;dow++){
    const d=new Date(now); const offset=(weeks-1-w)*7+(6-dow); d.setDate(d.getDate()-offset); d.setHours(12,0,0,0);
    const key=d.toISOString().slice(0,10); const items=history.filter(x=>new Date(x.at).toISOString().slice(0,10)===key);
    let level=items.some(x=>toneOf(x)==='risk')?3:items.some(x=>toneOf(x)==='caution')?2:items.length?1:0;
    if(!items.length){const pseudo=(w*13+dow*7+seedText)%17;level=pseudo===0?3:pseudo<4?2:pseudo<8?1:0}
    const text=level===3?'Cảnh báo: cần xem lại vùng an toàn / có tín hiệu Cứu Net.':level===2?'Chi lớn nhưng có kế hoạch — bạn đã tạo khoảng đệm trước khi quyết định.':level===1?'Có hoạt động tài chính tích cực được ghi nhận.':'Chưa ghi nhận quyết định nổi bật.';
    heat.push({key,d,level,text});
  }

function initJourneyCharts(){
  const root=document.querySelector('.dfj-view'); if(!root)return;
  const area=root.querySelector('#dfj-radar-area'); if(area){try{const len=area.getTotalLength();area.style.strokeDasharray=`${len} ${len}`;area.style.strokeDashoffset=len;requestAnimationFrame(()=>{area.style.strokeDashoffset='0'})}catch{}}
  let tip=document.querySelector('.dfj-heat-tooltip'); if(tip)tip.remove();
  root.querySelectorAll('.dfj-heat-cell').forEach(cell=>{cell.addEventListener('click',()=>{const key=cell.dataset.journeyDay;try{const h=JSON.parse(localStorage.getItem('decifin.history.v1')||'[]');const n=h.filter(x=>new Date(x.at).toISOString().slice(0,10)===key).length;if(typeof update==='function'&&n)update({notice:`${new Date(key+'T12:00:00').toLocaleDateString('vi-VN')}: ${n} hoạt động trong Journey.`})}catch{}})});
  const wrap=root.querySelector('.dfj-timeline-wrap'),items=[...root.querySelectorAll('.dfj-timeline-item')],svg=root.querySelector('.dfj-butterfly-svg'),path=root.querySelector('.dfj-butterfly-path'),label=root.querySelector('.dfj-butterfly-label'),icon=root.querySelector('.dfj-butterfly-icon');
  if(wrap&&items.length>=3&&svg&&path){
    const r=wrap.getBoundingClientRect(),a=items[0].getBoundingClientRect(),b=items[items.length-1].getBoundingClientRect();
    const x1=a.left-r.left+a.width*.18,y1=a.top-r.top+a.height*.55,x2=b.left-r.left+b.width*.18,y2=b.top-r.top+b.height*.45,mid=(y1+y2)/2;
    svg.setAttribute('viewBox',`0 0 ${Math.max(1,r.width)} ${Math.max(1,r.height)}`);path.setAttribute('d',`M ${x1} ${y1} C ${x1+Math.min(150,r.width*.25)} ${mid-90}, ${x2+Math.min(150,r.width*.25)} ${mid+90}, ${x2} ${y2}`);
    const lx=Math.min(x1,x2)+Math.max(35,Math.min(180,r.width*.28)),ly=mid-18;label.style.left=`${Math.min(Math.max(8,lx),Math.max(8,r.width-260))}px`;label.style.top=`${Math.max(8,ly)}px`;icon.style.left=`${Math.max(4,x1-16)}px`;icon.style.top=`${Math.max(4,y1-16)}px`;requestAnimationFrame(()=>label.classList.add('is-ready'));
  } else if(label&&icon){label.style.display='none';icon.style.display='none'}
}

function mount(root) {
  window.__decifinRoot = root;
  // AUDIT FIX — Nguyên nhân gốc của flash/flicker khi chuyển view: trước đây render(root)
  // gán root.innerHTML = toàn bộ app (topbar + sidebar + main + footer) MỖI LẦN state đổi,
  // kể cả những thay đổi không liên quan tới điều hướng (mở modal, gõ form, đổi theme...).
  // Điều đó phá huỷ và dựng lại toàn bộ sidebar/topbar mỗi lần — mất hover/focus state, và
  // với cây DOM lớn, thao tác innerHTML đồng bộ đó tạo ra một khung hình trắng thấy được.
  // Sửa tận gốc: dựng khung vỏ (skip link, khe topbar, khe main, footer) đúng MỘT LẦN ở đây.
  // Từ giờ render() chỉ còn ghi vào #df-main-slot mỗi lần, và chỉ ghi lại #df-topbar-slot khi
  // có tín hiệu thật sự ảnh hưởng tới nó (xem topbarSignatureOf/syncSidebarActiveState).
  root.innerHTML = `
    <a class="skip" href="#main">Bỏ qua phần điều hướng</a>
    <div id="df-topbar-slot"></div>
    <main id="main" tabindex="-1"><div class="shell" id="df-main-slot"></div></main>

  subscribe(() => render(root));
  root.addEventListener('click', onClick);
  applyTheme(readTheme() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  const saved = loadProfile();
  if (saved && saved.income > 0) update({ profile: saved, view: 'dashboard' });

/**
 * Chữ ký của mọi thứ có thể làm nội dung sidebar/topbar thật sự thay đổi cấu trúc
 * (không tính state.view — đổi view chỉ cần đổi active-state, xem syncSidebarActiveState).
 * Chỉ khi chữ ký này đổi, render() mới viết lại DOM của sidebar.
 */
function topbarSignatureOf(s) {
  let wishCount = 0;
  try { wishCount = Array.isArray(wishlist?.()) ? wishlist().length : 0; } catch {}
  let loggedIn = false, name = '';
  try { loggedIn = !!JSON.parse(localStorage.getItem('decifin.auth.session.v1') || 'null'); } catch {}
  try { name = (JSON.parse(localStorage.getItem('decifin.auth.account.v1') || 'null') || {}).name || ''; } catch {}
  return [s.focusMode ? 1 : 0, s.profile?.income > 0 ? 1 : 0, wishCount, loggedIn ? 1 : 0, name, readTheme() || ''].join('|');
}

/** Đồng bộ trạng thái active của các nút điều hướng (sidebar desktop + bottom nav mobile)
 *  và vạch tiến trình steps__rail bằng cách toggle class/thuộc tính trực tiếp — không
 *  innerHTML, không phá DOM node. */
function syncSidebarActiveState(topbarSlot) {
  if (!topbarSlot) return;
  topbarSlot.querySelectorAll('[data-action="go"][data-view]').forEach((btn) => {
    const active = btn.dataset.view === state.view;
    btn.classList.toggle('is-active', active);
    if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });
  const rail = topbarSlot.querySelector('.steps__rail');
  if (rail) {
    const index = STEP_LABELS.findIndex(([id]) => id === state.view);
    const at = index < 0 ? 0 : (index / Math.max(1, STEP_LABELS.length - 1)) * 100;
    rail.style.setProperty('--at', `${at}%`);
  }
}

let topbarSignature = null;

function render(root) {
  const view = VIEWS[state.view] || welcomeView;
  const topbarSlot = root.querySelector('#df-topbar-slot');
  const mainSlot = root.querySelector('#df-main-slot');

  // An toàn dự phòng: nếu vì lý do nào đó khung vỏ chưa tồn tại (ví dụ code cũ ở nơi khác
  // gọi render() trực tiếp mà chưa qua mount()), dựng lại khung vỏ một lần rồi thử lại.
  if (!topbarSlot || !mainSlot) { mount(root); return; }

  const sig = topbarSignatureOf(state);
  if (sig !== topbarSignature) {
    topbarSlot.innerHTML = topbar();
    topbarSignature = sig;
  }
  syncSidebarActiveState(topbarSlot);

  // Chỉ vùng nội dung chính đổi theo view — đây là chỗ DUY NHẤT bị viết lại mỗi lần render.
  mainSlot.innerHTML = `${notice()}${view(state)}`;

  const liveRegion = root.querySelector('#df-live-region');
  if (liveRegion) liveRegion.textContent = VIEW_NAMES[state.view] || '';

  // Người dùng bàn phím và trình đọc màn hình cần biết trang đã đổi. Nếu không
  // dời tiêu điểm, họ vẫn đứng ở nút vừa bấm trong khi nội dung đã thay hết.
  if (state.view !== lastView) {
    window.scrollTo({ top: 0 });
    root.querySelector('#main')?.focus({ preventScroll: true });
    lastView = state.view;
  }
  // Có lỗi thì kéo thẳng tới chỗ báo lỗi. Người dùng đang ở cuối trang bấm nút
  // sẽ không thấy gì nếu thông báo nằm im trên đầu.
  if (state.notice) mainSlot.querySelector('.notice')?.focus();

  enhanceView(root);
}

    <button class="${state.view === 'journey' ? 'is-active' : ''}" data-action="go" data-view="journey"><span>✦</span><span>Journey</span></button>
    <button class="${state.view === 'learn' ? 'is-active' : ''}" data-action="go" data-view="learn"><span>▣</span><span>Học</span></button>
    <button class="${state.view === 'profile' ? 'is-active' : ''}" data-action="go" data-view="profile"><span>◉</span><span>Hồ sơ</span></button>
  </nav>
</header>`;
}

/** Bước nào đã đi tới được. Bấm vào bước chưa có dữ liệu thì chỉ ra màn hình rỗng. */
function reachable(id) {
  if (id === 'profile') return true;
  if (id === 'compare') return true;
  return state.profile.income > 0;
}

/**
 * Khung báo lỗi và hỏi lại, dựng ngay trong trang.
 *
 * Thay cho window.alert và window.confirm. Hộp thoại của trình duyệt cắt ngang
 * mạch làm việc, không theo được hệ màu sáng tối, và trên điện thoại nó che mất
 * đúng chỗ vừa nhập sai.
 */
function notice() {
  if (!state.notice) return '';
  const { tone, text, items, confirm } = state.notice;

  return `<div class="notice ${tone === 'ask' ? 'notice--ask' : ''}" role="alert" tabindex="-1" style="margin-bottom:20px">
  <span class="notice__mark" aria-hidden="true">${tone === 'ask' ? '?' : '!'}</span>
  <div>
    <strong>${escapeHtml(text)}</strong>
    ${items && items.length > 0 ? `<ul>${items.map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` : ''}
    ${confirm ? `<div class="row" style="margin-top:12px">
      <button class="btn" data-action="${confirm.action}" style="padding:8px 15px">${escapeHtml(confirm.label)}</button>
      <button class="btn btn--ghost" data-action="dismiss" style="padding:8px 15px">Huỷ</button>
    </div>` : ''}
  </div>
</div>`;
}

/** Đổi màn hình và luôn dọn thông báo cũ, để lỗi của bước trước không đi theo. */
const go = (patch) => update({ notice: null, ...patch });

/**
 * NGUỒN GHI DUY NHẤT cho "một quyết định đã thực hiện" — mọi nơi trong app (Compare,
 * Wishlist, form nhập tay ở Journey) đều gọi đúng hàm này thay vì tự ghi localStorage
 * riêng, để dữ liệu luôn đồng bộ và Journey luôn thấy được ngay, không cần logic riêng
 * ở từng module. Khớp đúng schema mà journeyView() đang đọc: {at, label, detail, amount, tone}.
 */
function logDecision({ label, detail = '', amount = 0, tone } = {}) {
  try {
    const KEY = 'decifin.history.v1';
    const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
    const list = Array.isArray(raw) ? raw : [];
    list.unshift({
      at: new Date().toISOString(),
      label: String(label || 'Quyết định tài chính').slice(0, 140),
      detail: String(detail || '').slice(0, 280),
      amount: Number.isFinite(Number(amount)) ? Number(amount) : 0,
      tone: ['safe', 'caution', 'risk'].includes(tone) ? tone : undefined,
    });
    localStorage.setItem(KEY, JSON.stringify(list.slice(0, 300)));
    return true;
  } catch {
    return false;
  }
}
window.logDecision = logDecision;

function onClick(event) {
  // Đóng popover "Thêm công cụ" (mobile) khi bấm ra ngoài nó — hành vi chuẩn cho popover menu.
  const mobileTools = document.getElementById('df-mobile-tools');
  if (mobileTools?.classList.contains('open') && !event.target.closest('#df-mobile-tools')) {
    mobileTools.classList.remove('open');
    mobileTools.querySelector('#df-mobile-tools-fab')?.setAttribute('aria-expanded', 'false');
  }

  const trigger = event.target.closest('[data-action]');
  if (!trigger) return;
  const { action } = trigger.dataset;

  const handlers = {
    go: () => go({ view: trigger.dataset.view }),
    theme: toggleTheme,
    dismiss: () => update({ notice: null }),
    'start-blank': () => go({ profile: structuredClone(EMPTY_PROFILE), wizardStep: 0, view: 'profile' }),
    preset: () => loadPreset(trigger.dataset.id),
    'wizard-back': () => go({ wizardStep: Math.max(state.wizardStep - 1, 0) }),
    'wizard-next': advanceWizard,
    'pick-decision': () => go({ decisionKind: trigger.dataset.kind, view: 'decision' }),
    simulate: runSimulation,
    wipe: askWipe,
    'wipe-confirm': wipeProfile,
    'account-profile': () => go({ view: 'accountProfile' }),
    'auth-login': () => window.DecifinAuth?.show('login'),
    'auth-register': () => window.DecifinAuth?.show('register'),
    'auth-logout': () => window.DecifinAuth?.confirmLogout(),
    'learn-filter': () => update({ learnFilter: trigger.dataset.filter || 'all' }),
    'learn-search': () => update({ learnSearch: document.querySelector('[name=learnSearch]')?.value || '' }),
    'learn-lesson': () => learnLessonAction(trigger.dataset.lesson),
    'learn-quiz': () => learnQuiz(trigger.dataset.answer),
    'focus-toggle': () => {
      const next = !Boolean(state.focusMode);
      state.focusMode = next;
      try { localStorage.setItem('decifin.focusMode.v1', next ? '1' : '0'); } catch {}
      if (typeof window.__decifinApplyFocus === 'function') window.__decifinApplyFocus(next);
      else {
        window.__decifinFocus = next;
        document.body.classList.toggle('df-focus-active', next);
        document.body.setAttribute('data-focus-mode', next ? 'on' : 'off');
      }
      update({ focusMode: next });
    },
    'challenge': () => window.DecifinRetention?.challenge?.(),
    // FIX MOBILE: nút "✦ DeciFin Plus" và "🧠 Financial Intelligence" vốn được các module khác
    // tự chèn vào .df-sidebar-tools (bên trong .df-sidebar-inner) — nhưng .df-sidebar-inner bị
    // display:none ở mobile (≤767px) nên 2 nút này biến mất hoàn toàn, không có cách nào mở được
    // trên điện thoại. Thay vì viết lại logic 2 module đó, ta bấm hộ đúng nút gốc (vẫn tồn tại
    // trong DOM, chỉ là bị ẩn) bằng .click() — không tạo state/modal mới, không nhân đôi logic.
    'log-decision-manual-open': () => { if (typeof window.openManualDecisionLog === 'function') window.openManualDecisionLog(); },
    'log-decision': () => {
      if (trigger.disabled) return;
      logDecision({
        label: trigger.dataset.decisionLabel,
        amount: trigger.dataset.decisionAmount,
        tone: trigger.dataset.decisionTone,
        detail: trigger.dataset.decisionDetail,
      });
      trigger.disabled = true;
      trigger.textContent = '✓ Đã ghi vào DeciFin Journey';
      trigger.classList.add('is-done');
    },
    'mobile-tools-toggle': () => {
      const el = document.getElementById('df-mobile-tools');
      const open = el?.classList.toggle('open');
      document.getElementById('df-mobile-tools-fab')?.setAttribute('aria-expanded', String(!!open));
    },
    'mobile-tools-plus': () => { document.getElementById('df-mobile-tools')?.classList.remove('open'); document.getElementById('dfplus-open')?.click(); },
    'mobile-tools-intel': () => { document.getElementById('df-mobile-tools')?.classList.remove('open'); document.getElementById('df-intel-launch')?.click(); },
  };

  if (handlers[action]) {
    event.preventDefault();
    handlers[action]();
  }
}

function loadPreset(id) {
  const preset = PRESETS.find((p) => p.id === id);
  if (!preset) return;
  const profile = structuredClone(preset.profile);
  go({ profile, view: 'dashboard' });
  saveProfile();
}

/** Đọc giá trị từ các ô đang hiển thị, gộp vào hồ sơ, rồi sang bước kế tiếp. */
function advanceWizard() {
  const read = (name) => document.querySelector(`[name="${name}"]`);
  const value = (name) => {
    const el = read(name);
    return el ? parseAmount(el.value) : undefined;
  };
  const text = (name) => {
    const el = read(name);
    return el ? el.value.trim() : '';
  };
  const profile = structuredClone(state.profile || EMPTY_PROFILE);

  if (state.wizardStep === 0) {
    profile.income = value('income') ?? profile.income;
    profile.essential = value('essential') ?? profile.essential;
    profile.discretionary = value('discretionary') ?? profile.discretionary;
  } else if (state.wizardStep === 1) {
    profile.liquidAssets = value('liquidAssets') ?? profile.liquidAssets;
    const payment = value('debtPayment') || 0;
    profile.debts = payment > 0
      ? [{
          name: text('debtName') || 'Khoản vay',
          monthlyPayment: payment,
          remainingMonths: value('debtMonths') || 12,
        }]
      : [];
  } else if (state.wizardStep === 2) {
    profile.goals = [0, 1]
      .map((i) => ({
        name: text(`g${i}name`) || (i === 0 ? 'Mục tiêu 1' : 'Mục tiêu 2'),
        target: value(`g${i}target`) || 0,
        saved: value(`g${i}saved`) || 0,
        deadlineMonth: value(`g${i}deadline`) || 12,
        allocWeight: (value(`g${i}weight`) || 0) / 100,
      }))
      .filter((g) => g.target > 0);
    if (profile.goals.length > 0) profile.goals = normaliseWeights(profile.goals);
  } else {
    const select = read('incomeStability');
    if (select) profile.incomeStability = select.value;
  }

  // Cập nhật state trước để saveProfile() luôn lưu đúng dữ liệu vừa nhập.
  state.profile = profile;

  if (state.wizardStep === 3) {
    const errors = validate(profile);
    if (errors.length > 0) {
      update({ profile, notice: { tone: 'error', text: 'Hồ sơ chưa dùng được:', items: errors } });
      return;
    }

    // Lưu ngay trước khi chuyển khỏi wizard để F5/đóng tab không làm mất dữ liệu.
    saveProfile();
    go({ profile, view: 'dashboard' });
    return;
  }

  // Auto-save ở mọi bước, trước khi tăng wizardStep và render bước tiếp theo.
  saveProfile();
  const nextStep = state.wizardStep + 1;
  go({ profile, wizardStep: nextStep });
}

function runSimulation() {
  const read = (name) => {
    const el = document.querySelector(`[name="${name}"]`);
    return el ? parseAmount(el.value) : 0;
  };

  let built;
  try {
    built = BUILDERS[state.decisionKind](read, state.profile);
  } catch (error) {
    if (error instanceof ScenarioError) {
      update({ notice: { tone: 'error', text: error.message } });
      return;
    }
    throw error;
  }

  const results = built.scenarios
    ? rankScenarios(built.scenarios, built.extras || {})
    : rank(state.profile, built.events, built.extras || {});

  go({ results, installment: built.installment || null, view: 'compare' });
}

function askWipe() {
  update({
    notice: {
      tone: 'ask',
      text: 'Xoá hồ sơ khỏi trình duyệt này? Thao tác này không hoàn tác được.',
      confirm: { label: 'Xoá hồ sơ', action: 'wipe-confirm' },
    },
  });
}

function wipeProfile() {
  clearProfile();
  go({ profile: structuredClone(EMPTY_PROFILE), results: null, installment: null, view: 'welcome' });
}

/**
 * Nhãn của nút đổi nền nói ra việc nó sắp làm, không nói tình trạng hiện tại.
 * Chữ "Nền" một mình thì không ai đoán được bấm vào sẽ ra gì.
 */
function themeLabel() {
  return document.documentElement.dataset.theme === 'dark' ? 'Nền sáng' : 'Nền tối';
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  writeTheme(theme);

  // Đổi nền không dựng lại màn hình, nên nhãn phải tự cập nhật tại chỗ.
  const button = document.querySelector('[data-action="theme"]');
  if (button) button.textContent = themeLabel();
}

/**
 * Đổi nền sáng tối bằng cách hoà hai ảnh vào nhau.
 *
 * Đổi thẳng thì cả trang nháy một cái, mắt mất một nhịp để bám lại chỗ đang
 * đọc. Trình duyệt nào chưa có View Transitions thì rơi về đúng hành vi cũ.
 */
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (still || typeof document.startViewTransition !== 'function') {
    applyTheme(next);
    return;
  }
  document.startViewTransition(() => applyTheme(next));
}

mount(document.getElementById('app'));
</script>

<script>
(function(){
  'use strict';
  const PKEY='decifin.plus.v1', HKEY='decifin.history.v1', PINKEY='decifin.pin.v1', TOURKEY='decifin.tour.v1';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const money=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(Number(v)||0))+' đ';
  const pct=v=>((Number(v)||0)*100).toFixed(1)+'%';
  const getProfile=()=>{try{return JSON.parse(localStorage.getItem('decifin.profile.v1')||'null')}catch{return null}};
  const getPlus=()=>{try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch{return {}}};
  const setPlus=x=>{try{localStorage.setItem(PKEY,JSON.stringify(x))}catch{}};
  const getHistory=()=>{try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return []}};
  const setHistory=x=>{try{localStorage.setItem(HKEY,JSON.stringify(x.slice(0,30)))}catch{}};
  const baseline=p=>{const debts=(p?.debts||[]).reduce((a,d)=>a+(+d.monthlyPayment||0),0);const min=(+p?.essential||0)+debts;const surplus=(+p?.income||0)-(+p?.essential||0)-(+p?.discretionary||0)-debts;return{debts,min,surplus,runway:min>0?(+p?.liquidAssets||0)/min:0,dti:p?.income?debts/p.income:0}};
  function goalData(p, inflation=0.04, growth=0){const b=baseline(p);return (p?.goals||[]).map(g=>{const remain=Math.max(0,(+g.target||0)-(+g.saved||0));const monthly=Math.max(0,b.surplus*(+g.allocWeight||0));const eta=monthly>0?Math.ceil(remain/monthly):Infinity;const months=Math.min(60,Math.max(0,eta));const targetInfl=(+g.target||0)*Math.pow(1+inflation/12,months);return {...g,remain,monthly,eta,targetInfl}})}
  function score(p){const b=baseline(p);let s=100;s-=Math.max(0,(0.5-b.dti))*50;s-=Math.max(0,3-b.runway)*12;s+=Math.min(10,Math.max(0,b.surplus/(p.income||1))*20);return Math.max(0,Math.min(100,Math.round(s)))}
  function addHistory(label,detail){const h=getHistory();h.unshift({at:new Date().toISOString(),label,detail});setHistory(h)}
  // DECIFIN PLUS UX REFACTOR: toast cục bộ cho module này.
  // Lỗi cũ: bindPlus() gọi `notify?.(...)` nhưng `notify` chưa từng được khai báo ở scope global
  // của file này → optional chaining trên một identifier chưa khai báo vẫn ném ReferenceError,
  // gây lỗi console mỗi khi bấm "Lưu giả định". Thay bằng toast cục bộ, dùng chung style .df-toast đã hợp nhất.
  function plusToast(text){const old=document.querySelector('.df-plus-toast');if(old)old.remove();const e=document.createElement('div');e.className='df-toast df-plus-toast';e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
  function ensureButton(){
    const sidebar=document.querySelector('.df-sidebar-inner');
    const spacer=sidebar?.querySelector('.df-sidebar-spacer');
    let target=sidebar?.querySelector('.df-sidebar-tools');
    if(sidebar&&!target){
      target=document.createElement('div');
      target.className='df-sidebar-tools';
      if(spacer) spacer.parentNode.insertBefore(target,spacer);
      else sidebar.appendChild(target);
    }
    const existing=document.querySelector('#dfplus-open');
    if(existing){
      if(target&&!target.contains(existing))target.appendChild(existing);
      return;
    }
    const b=document.createElement('button');
    b.id='dfplus-open';b.className='btn dfplus-btn dfplus-sidebar-btn';
    b.type='button';b.textContent='✦ DeciFin Plus';
    b.addEventListener('click',()=>openPlus());
    if(target)target.appendChild(b);
    else if(sidebar)sidebar.appendChild(b);
    else document.querySelector('.topbar__inner')?.appendChild(b);
  }
  // DECIFIN PLUS UX REFACTOR: header nâng cấp thành badge + tên sản phẩm + chip "đã mở khoá".
  // Không có logic giá/subscription thật trong codebase (PKEY chỉ lưu giả định inflation/growth),
  // nên không hiển thị CTA "Nâng cấp" hay giá — chỉ phản ánh đúng trạng thái: mọi tab đều đã mở sẵn.
  function modal(){let m=document.getElementById('dfplus-modal');if(m)return m;m=document.createElement('div');m.id='dfplus-modal';m.className='dfplus-modal';m.innerHTML='<div class="dfplus-card" role="dialog" aria-modal="true" aria-label="DeciFin Plus"><div class="dfplus-head df-plus-head"><div><span class="df-plus-badge">✦ DECIFIN PLUS</span><h2>DeciFin Plus</h2></div><div class="df-plus-head-right"><span class="df-plus-unlocked">✓ Đã mở khoá cho bạn</span><button class="dfplus-close" id="dfplus-close" aria-label="Đóng DeciFin Plus">×</button></div></div><div class="dfplus-body"><div class="dfplus-tabs" id="dfplus-tabs"></div><div id="dfplus-content"></div></div></div>';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)closePlus()});m.querySelector('#dfplus-close').onclick=closePlus;return m}
  const tabs=[['overview','Digital Twin'],['whatif','What-if'],['goals','Mục tiêu'],['learn','XAI & Từ điển'],['history','Lịch sử'],['privacy','Bảo mật']];
  let current='overview';
  function openPlus(tab='overview'){current=tab;const m=modal();m.classList.add('open');document.body.classList.add('df-plus-lock');renderPlus();}
  function closePlus(){document.getElementById('dfplus-modal')?.classList.remove('open');document.body.classList.remove('df-plus-lock')}
  function renderPlus(){
    const m=modal(),p=getProfile()||{},b=baseline(p),s=score(p),plus=getPlus();
    m.querySelector('#dfplus-tabs').innerHTML=tabs.map((t,i)=>`<button class="dfplus-tab ${current===t[0]?'active':''}" data-tab="${t[0]}" aria-selected="${current===t[0]}"><span>${['◈','◌','◎','✦','◷','⌾'][i]||'•'}</span>${t[1]}</button>`).join('');
    m.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{current=x.dataset.tab;renderPlus()});
    const c=m.querySelector('#dfplus-content');
    if(!p?.income){c.innerHTML='<div class="dfplus-box"><h3>Chưa có hồ sơ tài chính</h3><p class="dfplus-muted">Hãy tạo hồ sơ trong DeciFin trước. DeciFin Plus sẽ tự đọc hồ sơ đã lưu trên thiết bị này.</p></div>';return}
    if(current==='overview') c.innerHTML=overview(p,b,s,plus);
    if(current==='whatif') c.innerHTML=whatif(p,b);
    if(current==='goals') c.innerHTML=goals(p);
    if(current==='learn') c.innerHTML=learn();
    if(current==='history') c.innerHTML=history();
    if(current==='privacy') c.innerHTML=privacy();
    bindPlus();
  }

  function plusProjection(p,b,plus){
    const inflation=Math.max(0,+plus.inflation||0.04);
    const growth=Math.max(-0.5,+plus.growth||0);
    const monthlyRate=Math.pow(1.05,1/12)-1;
    const baseIncome=Math.max(0,+p.income||0);
    const baseSurplus=Math.max(0,+b.surplus||0);
    let nominal=Math.max(0,+p.liquidAssets||0);
    const points=[];
    for(let m=0;m<=60;m++){
      if(m>0){
        const incomeFactor=Math.pow(1+growth,m/12);
        const contribution=baseSurplus*incomeFactor;
        nominal=nominal*(1+monthlyRate)+contribution;
      }
      const real=nominal/Math.pow(1+inflation,m/12);
      points.push({m,nominal,real});
    }
    return points;
  }

  function projectionSvg(points){
    const w=760,h=260,pad={l:44,r:18,t:20,b:34};
    const max=Math.max(1,...points.map(x=>Math.max(x.nominal,x.real)));
    const x=m=>pad.l+(m/60)*(w-pad.l-pad.r);
    const y=v=>h-pad.b-(v/max)*(h-pad.t-pad.b);
    const path=key=>points.map((d,i)=>`${i?'L':'M'} ${x(d.m).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(' ');
    const ticks=[0,12,24,36,48,60];
    const grid=ticks.map(m=>`<line x1="${x(m)}" y1="${pad.t}" x2="${x(m)}" y2="${h-pad.b}" stroke="rgba(255,255,255,.08)"/><text x="${x(m)}" y="${h-10}" text-anchor="middle" fill="rgba(243,244,255,.55)" font-size="11">${m===0?'Hiện tại':m/12+' năm'}</text>`).join('');
    return `<svg class="dfplus-projection" viewBox="0 0 ${w} ${h}" role="img" aria-label="Dự phóng tài sản 5 năm"><defs><linearGradient id="dfplusGradNom" x1="0" x2="1"><stop offset="0%" stop-color="#A89BFF"/><stop offset="100%" stop-color="#6256D9"/></linearGradient><linearGradient id="dfplusGradReal" x1="0" x2="1"><stop offset="0%" stop-color="#7ED6C3"/><stop offset="100%" stop-color="#4BB39B"/></linearGradient></defs>${grid}<path d="${path('nominal')}" fill="none" stroke="url(#dfplusGradNom)" stroke-width="4" stroke-linecap="round"/><path d="${path('real')}" fill="none" stroke="url(#dfplusGradReal)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="${x(60)}" cy="${y(points[60].nominal)}" r="5" fill="#A89BFF"/><circle cx="${x(60)}" cy="${y(points[60].real)}" r="5" fill="#7ED6C3"/></svg>`;
  }

    <div class="dfplus-box dfplus-pro-chart" style="margin-top:14px"><div class="spread"><div><h3>5-Year Net Worth Projection</h3><p class="dfplus-muted">Lãi kép 5%/năm · tăng trưởng thu nhập ${(+(plus.growth??0)*100).toFixed(1)}% · lạm phát ${(+(plus.inflation??.04)*100).toFixed(1)}%</p></div><div class="dfplus-legend"><span><i class="nom"></i> Tài sản kỳ vọng</span><span><i class="real"></i> Sức mua thực tế</span></div></div>${projectionSvg(points)}<div class="dfplus-pro-summary"><div><span>Tài sản danh nghĩa sau 5 năm</span><b>${money(end.nominal)}</b></div><div><span>Giá trị thực sau lạm phát</span><b>${money(end.real)}</b></div><div><span>Khoảng cách sức mua</span><b>${money(Math.max(0,end.nominal-end.real))}</b></div></div></div>
    <div class="dfplus-grid" style="margin-top:14px"><div class="dfplus-box"><h3>Digital Twin</h3><div class="dfplus-row"><span>Thu nhập</span><b>${money(p.income)}</b></div><div class="dfplus-row"><span>Chi phí thiết yếu</span><b>${money(p.essential)}</b></div><div class="dfplus-row"><span>Nợ/tháng</span><b>${money(b.debts)}</b></div><div class="dfplus-row"><span>DTI</span><b class="${b.dti<=.3?'dfplus-good':b.dti<=.4?'dfplus-warn':'dfplus-risk'}">${pct(b.dti)}</b></div><div class="dfplus-actions"><button class="dfplus-secondary" data-export>Xuất báo cáo</button><button class="dfplus-secondary" data-tour>Hướng dẫn</button></div></div><div class="dfplus-box"><h3>Mục tiêu dài hạn</h3>${gd.length?gd.map(g=>{const progress=Math.min(100,(+g.saved||0)/(+g.target||1)*100);return `<div style="margin-top:10px"><div class="dfplus-row"><span>${esc(g.name)}</span><b>${progress.toFixed(0)}%</b></div><div class="dfplus-progress"><i style="width:${progress}%"></i></div><div class="dfplus-muted">${money(g.saved)} / ${money(g.target)} · dự kiến ${g.eta===Infinity?'chưa xác định':g.eta+' tháng'}</div></div>`}).join(''):'<span class="dfplus-muted">Chưa có mục tiêu.</span>'}</div></div>
    <div class="dfplus-box" style="margin-top:14px"><h3>Tinh chỉnh Digital Twin</h3><div class="dfplus-form"><div class="dfplus-field"><label>Lạm phát giả định / năm</label><input id="df-inflation" type="number" min="0" max="30" step="0.1" value="${((plus.inflation??.04)*100).toFixed(1)}"></div><div class="dfplus-field"><label>Tăng trưởng thu nhập / năm</label><input id="df-growth" type="number" min="-50" max="100" step="0.5" value="${((plus.growth??0)*100).toFixed(1)}"></div></div><div class="dfplus-actions"><button class="dfplus-primary" data-save-assumptions>Lưu giả định & cập nhật mô phỏng</button></div></div>`;
  }

  function whatif(p,b){
    const reserve=Math.max(0,+p.liquidAssets||0), monthlyNeed=Math.max(0,+b.min||0);
    const scenarios=[
      {id:'job',icon:'💼',title:'Mất việc 3 tháng',desc:'Thu nhập về 0 trong 3 tháng. DeciFin kiểm tra lớp đệm hiện tại có chịu được cú sốc không.',income:0,months:3,costFactor:1,one:0},
      {id:'inflation',icon:'📈',title:'Lạm phát phi mã',desc:'Chi phí thiết yếu tăng 20% trong 6 tháng, trong khi thu nhập giữ nguyên.',income:1,months:6,costFactor:1.2,one:0},
      {id:'family',icon:'🧡',title:'Sự cố y tế / gia đình',desc:'Một khoản chi bất ngờ bằng 50% quỹ dự phòng hiện tại xuất hiện ngay lập tức.',income:1,months:3,costFactor:1,one:reserve*.5}
    ];

  }
  function goals(p){const plus=getPlus();const gd=goalData(p,+(plus.inflation??.04),+(plus.growth??0));return `<div class="dfplus-box"><h3>Tiến độ mục tiêu & tác động quyết định</h3><p class="dfplus-muted">Bạn có thể nhập một khoản chi mới để xem mục tiêu bị lùi bao nhiêu tháng.</p>${gd.length?gd.map((g,i)=>`<div class="dfplus-box" style="margin-top:10px"><div class="dfplus-row"><strong>${esc(g.name)}</strong><span>${money(g.saved)} / ${money(g.target)}</span></div><div class="dfplus-progress"><i style="width:${Math.min(100,(g.saved/g.target)*100)}%"></i></div><div class="dfplus-muted">Nhịp đóng góp: ${money(g.monthly)}/tháng · ETA: ${g.eta===Infinity?'—':g.eta+' tháng'}</div><div class="dfplus-field" style="margin-top:10px"><label>Khoản chi quyết định</label><input data-goal-cost="${i}" type="number" min="0" step="100000" value="0"></div><div data-goal-result="${i}" class="dfplus-muted" style="margin-top:7px"></div></div>`).join(''):'<p class="dfplus-muted">Chưa có mục tiêu. Hãy tạo mục tiêu trong Hồ sơ.</p>'}</div>`}
  function learn(){const dict=[['Lãi phẳng','Lãi được tính trên số tiền gốc ban đầu trong suốt kỳ hạn. Vì vậy lãi suất danh nghĩa có thể thấp nhưng chi phí thực tế cao hơn cách tính trên dư nợ giảm dần.'],['Lãi suất thực','Lãi suất phản ánh chi phí/giá trị sau khi xét cách tính lãi và các khoản phí liên quan. Trong DeciFin, nên xem tổng tiền trả và giá trị hiện tại cùng lúc.'],['Giá trị hiện tại (PV)','Quy đổi các dòng tiền ở những thời điểm khác nhau về cùng một mốc thời gian để so sánh công bằng.'],['DTI','Tỷ lệ nghĩa vụ nợ hàng tháng trên thu nhập. DeciFin dùng đây như một tín hiệu an toàn, không phải chuẩn tín dụng chính thức.'],['Quỹ dự phòng','Số tháng mà tài sản thanh khoản có thể duy trì chi phí tối thiểu nếu dòng thu nhập bị gián đoạn.'],['Chi phí cơ hội','Giá trị lợi ích bị bỏ lỡ khi dùng tiền cho một lựa chọn thay vì lựa chọn khác.']];return `<div class="dfplus-grid">${dict.map((d,i)=>`<div class="dfplus-box"><h3>${d[0]} <span class="dfplus-tip" title="${esc(d[1])}">?</span></h3><p class="dfplus-muted">${d[1]}</p></div>`).join('')}</div><div class="dfplus-box" style="margin-top:14px"><h3>Nguyên tắc an toàn</h3><div class="dfplus-row"><span>DTI ≤ 30%</span><b class="dfplus-good">Tốt</b></div><div class="dfplus-row"><span>Quỹ dự phòng ≥ 6 tháng</span><b class="dfplus-good">Tốt</b></div><div class="dfplus-row"><span>DTI 30–40%</span><b class="dfplus-warn">Thận trọng</b></div><div class="dfplus-row"><span>DTI > 50%</span><b class="dfplus-risk">Nút thắt</b></div></div>`}
  function history(){const h=getHistory();return `<div class="dfplus-box"><h3>Decision History</h3>${h.length?h.map(x=>`<div class="dfplus-row"><div><strong>${esc(x.label)}</strong><div class="dfplus-muted">${new Date(x.at).toLocaleString('vi-VN')}</div></div><span>${esc(x.detail||'')}</span></div>`).join(''):'<p class="dfplus-muted">Chưa có quyết định được lưu. Khi bạn chạy stress test hoặc lưu một báo cáo, DeciFin sẽ tạo lịch sử.</p>'}<div class="dfplus-actions"><button class="dfplus-secondary" data-clear-history>Xóa lịch sử</button></div></div>`}
  function privacy(){const pin=localStorage.getItem(PINKEY);return `<div class="dfplus-grid"><div class="dfplus-box"><h3>PIN bảo vệ</h3><p class="dfplus-muted">Khóa giao diện khi mở file trên máy dùng chung. PIN chỉ lưu cục bộ trên trình duyệt này.</p><div class="dfplus-field"><label>${pin?'Đổi PIN 4–6 số':'Tạo PIN 4–6 số'}</label><input id="df-pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••"></div><div class="dfplus-actions"><button class="dfplus-primary" data-save-pin>${pin?'Đổi PIN':'Bật PIN'}</button>${pin?'<button class="dfplus-secondary" data-remove-pin>Tắt PIN</button>':''}</div></div><div class="dfplus-box"><h3>Dữ liệu</h3><p class="dfplus-muted">Hồ sơ gốc của DeciFin được lưu bằng localStorage trên thiết bị. Không đồng bộ lên máy chủ trong bản standalone hiện tại.</p><div class="dfplus-actions"><button class="dfplus-secondary" data-tour>Chạy Guided Tour</button></div></div></div>`}
  // DECIFIN PLUS UX REFACTOR: tách phần tính toán stress test ra khỏi listener để chèn micro-state "Đang tính…".
  // Tính toán vẫn đồng bộ/tức thời — độ trễ nhỏ (160ms) chỉ để trạng thái loading kịp hiển thị, không giả lập gọi mạng.
  function runSmartStress(btn){
    const p=getProfile()||{},b=baseline(p),id=btn.dataset.runSmartStress;
    const reserve=Math.max(0,+p.liquidAssets||0),months=id==='job'?3:id==='inflation'?6:3;
    const shockIncome=id==='job'?0:+p.income||0;
    const costFactor=id==='inflation'?1.2:1;
    const oneOff=id==='family'?reserve*.5:0;
    let cash=Math.max(0,reserve-oneOff),before=reserve,lowest=cash;
    for(let i=0;i<months;i++){cash+=shockIncome-(+p.essential||0)*costFactor-(+p.discretionary||0)-b.debts;lowest=Math.min(lowest,cash)}
    const need=Math.max(1,(+p.essential||0)*costFactor+b.debts);
    const runway=Math.max(0,lowest)/need;
    const tone=runway<1?'risk':runway<3?'warn':'good';
    const label=runway<1?'🔴 Cảnh báo khẩn cấp':runway<3?'🟡 Cần thận trọng':'🟢 Vẫn có lớp đệm';
    const pctBefore=reserve?100:0,pctAfter=Math.max(0,Math.min(100,(lowest/Math.max(1,reserve))*100));
    const el=document.querySelector(`#df-stress-${id}`);
    btn.disabled=false;btn.classList.remove('is-loading');
    if(!el){btn.textContent='Chạy Test →';return}
    el.innerHTML=`<div class="dfplus-stress-bars"><div><span>Trước</span><b>${money(before)}</b></div><div class="dfplus-bar"><i style="width:${pctBefore}%"></i></div><div><span>Sau stress</span><b>${money(lowest)}</b></div><div class="dfplus-bar ${tone}"><i style="width:${pctAfter}%"></i></div></div><div class="dfplus-stress-verdict ${tone}"><strong>${label}</strong><span>Runway thấp nhất: ${runway.toFixed(1)} tháng</span></div>`;
    addHistory('Stress test · '+(id==='job'?'Mất việc 3 tháng':id==='inflation'?'Lạm phát phi mã':'Sự cố y tế / gia đình'),`Runway thấp nhất ${runway.toFixed(1)} tháng`);
    btn.textContent='✓ Đã kiểm tra lại';btn.classList.add('is-done');
  }
  function bindPlus(){
    const q=(sel)=>document.querySelector(sel);
    q('[data-save-assumptions]')?.addEventListener('click',(e)=>{
      const btn=e.currentTarget;
      btn.classList.add('is-loading');btn.disabled=true;
      const x=getPlus();x.inflation=(+(q('#df-inflation')?.value||0))/100;x.growth=(+(q('#df-growth')?.value||0))/100;setPlus(x);
      setTimeout(()=>{renderPlus();plusToast('Đã cập nhật Digital Twin ✨')},120);
    });
    document.querySelectorAll('[data-run-smart-stress]').forEach(btn=>btn.addEventListener('click',()=>{
      if(btn.disabled)return;
      btn.disabled=true;btn.classList.add('is-loading');btn.textContent='Đang tính…';
      setTimeout(()=>runSmartStress(btn),160);
    }));
    document.querySelectorAll('[data-goal-cost]').forEach(el=>el.addEventListener('input',()=>{const p=getProfile(),g=goalData(p)[+el.dataset.goalCost],cost=+el.value||0,target=document.querySelector(`[data-goal-result="${el.dataset.goalCost}"]`);if(!target)return;target.textContent=!g||!g.monthly?'':cost?`Nếu khoản chi này lấy từ tiền dành cho mục tiêu, thời gian có thể lùi khoảng ${Math.ceil(cost/g.monthly)} tháng.`:''}));
    q('[data-export]')?.addEventListener('click',()=>exportReport());
    q('[data-tour]')?.addEventListener('click',()=>{closePlus();startTour()});
    q('[data-clear-history]')?.addEventListener('click',()=>{setHistory([]);renderPlus()});
    q('[data-save-pin]')?.addEventListener('click',()=>{const pin=q('#df-pin')?.value||'';if(!/^\d{4,6}$/.test(pin)){alert('PIN cần 4–6 chữ số.');return}localStorage.setItem(PINKEY,btoa(pin));renderPlus()});
    q('[data-remove-pin]')?.addEventListener('click',()=>{localStorage.removeItem(PINKEY);renderPlus()});
  }
  function exportReport(){const p=getProfile(),b=baseline(p),s=score(p),gd=goalData(p);addHistory('Xuất báo cáo',`Financial Health ${s}/100`);const m=modal();m.classList.add('open');current='overview';renderPlus();const title=document.createElement('div');title.className='dfplus-print-title';title.innerHTML=`<h1>DeciFin — Báo cáo sức khỏe tài chính</h1><p>${new Date().toLocaleDateString('vi-VN')}</p><hr><h2>${s}/100 — Financial Health</h2><p>Dòng tiền dư: ${money(b.surplus)} · Quỹ dự phòng: ${b.runway.toFixed(1)} tháng · DTI: ${pct(b.dti)}</p><h2>Mục tiêu</h2>${gd.map(g=>`<p>${esc(g.name)}: ${money(g.saved)} / ${money(g.target)}</p>`).join('')}`;m.querySelector('.dfplus-body').prepend(title);setTimeout(()=>{window.print();title.remove()},100)}
  function startTour(){const old=document.getElementById('dfplus-tour');if(old)old.remove();const steps=[['.topbar','Đây là thanh điều hướng. DeciFin Plus mở Digital Twin, stress test, mục tiêu và bảo mật.'],['.metrics','Đây là bức tranh tài chính hiện tại: dòng tiền, quỹ dự phòng, nghĩa vụ nợ và chi phí tối thiểu.'],['.shell-card','Biểu đồ cho thấy các mục tiêu có thể tiến triển thế nào nếu giữ nhịp dòng tiền hiện tại.'],['.panel--action','Từ đây bạn bắt đầu một quyết định và chạy mô phỏng.']];let i=0;function show(){const t=document.getElementById('dfplus-tour')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'dfplus-tour',className:'dfplus-tour'}));const q=document.querySelector(steps[i][0]);if(q){const r=q.getBoundingClientRect();t.style.left=Math.max(12,Math.min(innerWidth-350,r.left))+'px';t.style.top=Math.min(innerHeight-150,r.bottom+10)+'px'}t.innerHTML=`<strong>Guided Tour ${i+1}/${steps.length}</strong><p style="margin:8px 0">${steps[i][1]}</p><button class="dfplus-primary" id="tour-next">${i===steps.length-1?'Hoàn tất':'Tiếp'}</button>`;t.querySelector('#tour-next').onclick=()=>{i++;if(i>=steps.length){t.remove();localStorage.setItem(TOURKEY,'1')}else show()}}show()}
  function lock(){if(!localStorage.getItem(PINKEY)||document.getElementById('dfplus-lock'))return;const l=document.createElement('div');l.id='dfplus-lock';l.className='dfplus-lock';l.innerHTML='<div class="dfplus-lock-card"><div class="dfplus-muted">DECIFIN</div><h2>Hồ sơ đang được khóa</h2><p class="dfplus-muted">Nhập PIN để tiếp tục trên thiết bị này.</p><input id="df-lock-pin" inputmode="numeric" maxlength="6" type="password" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:var(--ink);font-size:20px;letter-spacing:5px"><button id="df-unlock" class="dfplus-primary" style="margin-top:10px;width:100%">Mở khóa</button><p id="df-lock-error" class="dfplus-risk" style="min-height:20px"></p><button id="df-lock-forgot" class="dfplus-secondary" style="width:100%;margin-top:2px">Quên PIN?</button></div>';document.body.appendChild(l);l.querySelector('#df-unlock').onclick=()=>{if(btoa(l.querySelector('#df-lock-pin').value)===localStorage.getItem(PINKEY)){l.remove()}else l.querySelector('#df-lock-error').textContent='PIN không đúng.'};l.querySelector('#df-lock-pin').addEventListener('keydown',e=>{if(e.key==='Enter')l.querySelector('#df-unlock').click()});l.querySelector('#df-lock-forgot').onclick=()=>{if(confirm('Xóa PIN trên thiết bị này? Hồ sơ, mục tiêu và lịch sử quyết định của bạn sẽ KHÔNG bị mất — chỉ khóa PIN bị gỡ.')){localStorage.removeItem(PINKEY);l.remove()}};l.querySelector('#df-lock-pin').focus()}
  const obs=new MutationObserver(()=>{ensureButton();});obs.observe(document.documentElement,{childList:true,subtree:true});setTimeout(()=>{ensureButton();if(!localStorage.getItem(TOURKEY)&&getProfile()?.income) setTimeout(startTour,900);lock()},500);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlus()});
  // Lưu một mốc lịch sử khi người dùng đã có hồ sơ và mở app.
  if(getProfile()?.income&&!sessionStorage.getItem('dfplus-session')){sessionStorage.setItem('dfplus-session','1');addHistory('Phiên sử dụng',`Financial Health ${score(getProfile())}/100`)}
})();
</script>
