    add('savings','Kỷ luật tích lũy',Math.max(0,Math.min(100,50+b.savingsRate*300)),15,`Tỷ lệ dòng tiền dư ${(b.savingsRate*100).toFixed(1)}%.`);
    add('income','Ổn định thu nhập',incomeStability,10,p.incomeStability==='variable'?'Hồ sơ đánh dấu thu nhập biến động.':'Hồ sơ đánh dấu thu nhập ổn định.',incomeStability!==null);
    const debts=(p.debts||[]).length; add('debt','Hành vi nghĩa vụ nợ',debts?Math.max(20,Math.min(100,90-b.dti*120)):90,10,debts?`${debts} nghĩa vụ nợ đang được khai báo.`:'Chưa khai báo khoản nợ.');
    const completeness=Math.round((factors.reduce((s,f)=>s+f.weight,0)/95)*100); const raw=factors.reduce((s,f)=>s+f.value*f.weight,0)/Math.max(1,factors.reduce((s,f)=>s+f.weight,0));
    const score=Math.round(Math.max(0,Math.min(100,raw))); const level=score>=80?'Tốt':score>=65?'Khá':score>=50?'Cần cải thiện':'Rủi ro cao'; const confidence=Math.round(Math.min(96,Math.max(42,completeness*.8+(p.goals?.length?10:0))));
    return{score,level,confidence,completeness,factors,note:'Đây là chỉ số mô phỏng khả năng quản lý nghĩa vụ tài chính của DeciFin, không phải điểm tín dụng chính thức và không dự đoán quyết định của ngân hàng.'};
  }
  function buildTwin(p){
    const b=base(p||{}), old=twinStore(), events=Array.isArray(old.lifeEvents)?old.lifeEvents:[]; const goals=(p?.goals||[]).map(g=>({name:g.name,target:num(g.target),saved:num(g.saved),progress:num(g.target)>0?Math.min(100,num(g.saved)/num(g.target)*100):0,deadline:g.deadlineMonth??null,priority:g.priority??'normal'}));
    const projection=[]; let liquid=Math.max(0,num(p?.liquidAssets)); const growth=num(safeJson('decifin.plus.v1',{}).growth,0); const inflation=num(safeJson('decifin.plus.v1',{}).inflation,.04); const monthlyGrowth=Math.pow(1+growth,1/12)-1; const monthlyInflation=Math.pow(1+inflation,1/12)-1;
    const today=new Date(); const eventMap={}; events.forEach(ev=>{const d=ev.date?new Date(ev.date):null;if(d&&!Number.isNaN(d.getTime())){const diff=(d.getFullYear()-today.getFullYear())*12+(d.getMonth()-today.getMonth());if(diff>=1&&diff<=60)eventMap[diff]=(eventMap[diff]||0)+num(ev.estimatedCost);}}); for(let m=0;m<=60;m++){if(m>0){const income=num(p?.income)*Math.pow(1+monthlyGrowth,m);const expenses=(num(p?.essential)+num(p?.discretionary)+b.debtPayments)*Math.pow(1+monthlyInflation,m);liquid+=income-expenses-(eventMap[m]||0);}projection.push({month:m,liquid:Math.max(0,liquid),plannedEventCost:eventMap[m]||0});}
    return{snapshotDate:new Date().toISOString(),cashFlow:{income:num(p?.income),expenses:num(p?.essential)+num(p?.discretionary)+b.debtPayments,surplus:b.surplus},liquidity:{liquidAssets:num(p?.liquidAssets),runway:b.runway},debt:{totalDebt:(p?.debts||[]).reduce((s,d)=>s+num(d?.monthlyPayment)*Math.max(1,num(d?.remainingMonths,1)),0),monthly:b.debtPayments,dti:b.dti},goals,risk:{riskTolerance:old.riskTolerance||'unknown',financialRiskLevel:b.dti>.4||b.runway<3?'high':b.dti>.3||b.runway<6?'medium':'low'},behavior:{savingsRate:b.savingsRate,spendingPattern:b.surplus<0?'âm surplus':'dòng tiền dương',decisionCount:safeJson('DECIFIN_HISTORY',[]).length||safeJson('decifin.history.v1',[]).length||0},lifeEvents:events,projection,dataCompleteness:Math.round(([p?.income,p?.essential,p?.liquidAssets,b.dti,events.length?1:0,goals.length?1:0].filter(v=>v!==null&&v!==undefined).length/6)*100)};
  }
  function saveSnapshot(twin){const s=safeJson(KEYS.snap,[]);s.unshift({date:twin.snapshotDate,liquidAssets:twin.liquidity.liquidAssets,runway:twin.liquidity.runway,surplus:twin.cashFlow.surplus,dti:twin.debt.dti,score:creditScore(profile(),twin).score});put(KEYS.snap,s.slice(0,24));}
  function scenario(p,kind){const b=base(p||{}),price=35000000,months=12,apr=.12;let monthly=0,total=price,liquid=num(p?.liquidAssets),delay=0; if(kind==='installment'){const i=apr/12;monthly=i?price*i*Math.pow(1+i,months)/(Math.pow(1+i,months)-1):price/months;total=monthly*months;liquid=liquid;} if(kind==='loan'){const principal=price*.2;const i=.14/12;monthly=i?principal*i*Math.pow(1+i,24)/(Math.pow(1+i,24)-1):principal/24;total=monthly*24+price*.8;liquid=liquid-price*.8;} if(kind==='buy'){liquid=Math.max(0,liquid-price);} if(kind==='delay'){delay=47;} const newSurplus=b.surplus-monthly; const newRunway=b.minimumSpend>0?liquid/b.minimumSpend:b.runway; return{kind,monthly,total,liquid,surplus:newSurplus,runway:newRunway,dti:num(p?.income)>0?(b.debtPayments+monthly)/num(p.income):0,delay};}

  function twinView(p){if(!p?.income)return `<div class="df-intel-hero"><div class="df-intel-kicker">DIGITAL TWIN 2.0</div><h3>Chưa đủ dữ liệu để dựng bản sao tài chính.</h3><p>Hãy hoàn thiện hồ sơ để DeciFin có thu nhập, chi phí, tài sản và nghĩa vụ nợ thực tế.</p></div>`;const t=buildTwin(p),s=safeJson(KEYS.snap,[]),e=t.lifeEvents;return `<div class="df-intel-hero"><div class="df-intel-kicker">DIGITAL TWIN 2.0 · CẬP NHẬT ${new Date(t.snapshotDate).toLocaleDateString('vi-VN')}</div><h3>Bản sao tài chính đang phản chiếu trạng thái hiện tại của bạn.</h3><p>Không chỉ nhìn số dư hôm nay: DeciFin theo dõi dòng tiền, thanh khoản, nợ, mục tiêu, khẩu vị rủi ro và các sự kiện dự kiến.</p></div><div class="df-intel-grid"><div class="df-intel-card"><h3>Dòng tiền</h3><div class="df-intel-big">${money(t.cashFlow.surplus)}</div><div class="df-intel-muted">surplus / tháng</div></div><div class="df-intel-card"><h3>Thanh khoản</h3><div class="df-intel-big">${Number.isFinite(t.liquidity.runway)?t.liquidity.runway.toFixed(1):'—'} tháng</div><div class="df-intel-muted">runway hiện tại</div></div><div class="df-intel-card"><h3>Rủi ro</h3><div class="df-intel-big">${t.risk.financialRiskLevel==='low'?'Thấp':t.risk.financialRiskLevel==='medium'?'Vừa':'Cao'}</div><div class="df-intel-muted">Khẩu vị: ${t.risk.riskTolerance==='unknown'?'chưa xác định':t.risk.riskTolerance}</div></div></div><div class="df-intel-grid two" style="margin-top:12px"><div class="df-intel-card"><h3>Khẩu vị rủi ro</h3><p class="df-intel-muted">DeciFin không tự suy đoán khẩu vị rủi ro chỉ từ surplus. Bạn có thể khai báo để mô phỏng phản ánh ưu tiên cá nhân.</p><div class="df-intel-field"><label>Khẩu vị</label><select id="df-twin-risk"><option value="unknown" ${t.risk.riskTolerance==='unknown'?'selected':''}>Chưa xác định</option><option value="conservative" ${t.risk.riskTolerance==='conservative'?'selected':''}>Thận trọng</option><option value="balanced" ${t.risk.riskTolerance==='balanced'?'selected':''}>Cân bằng</option><option value="aggressive" ${t.risk.riskTolerance==='aggressive'?'selected':''}>Chấp nhận rủi ro cao</option></select></div><div class="df-intel-actions"><button class="df-intel-btn" data-twin-risk-save>Lưu khẩu vị</button></div></div><div class="df-intel-card"><h3>Sự kiện đời sống 6–24 tháng</h3><p class="df-intel-muted">Thêm các khoản chi dự kiến để Digital Twin không chỉ nhìn dữ liệu hiện tại.</p><div class="df-intel-form"><div class="df-intel-field"><label>Sự kiện</label><input id="df-event-title" placeholder="Ví dụ: mua xe"></div><div class="df-intel-field"><label>Ngày</label><input id="df-event-date" type="date"></div><div class="df-intel-field"><label>Chi phí</label><input id="df-event-cost" type="number" min="0" placeholder="0"></div></div><div class="df-intel-actions"><button class="df-intel-btn" data-event-add>Thêm sự kiện</button></div>${e.map(x=>`<div class="df-intel-event"><div><strong>${esc(x.title)}</strong><small>${esc(x.date||'Chưa có ngày')} · ${money(x.estimatedCost)} · ${esc(x.priority||'normal')}</small></div><button class="df-intel-btn secondary" data-event-del="${esc(x.id)}">Xóa</button></div>`).join('')}</div></div><div class="df-intel-card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h3>Projection 60 tháng</h3><div class="df-intel-muted">Kịch bản cơ sở dựa trên dữ liệu hiện tại + giả định tăng trưởng/lạm phát đang lưu trong Plus.</div></div><span class="df-intel-pill">Độ đầy đủ dữ liệu ${t.dataCompleteness}%</span></div><div class="df-intel-projection" style="margin-top:10px"><table class="df-intel-table"><thead><tr><th>Thời điểm</th><th>Thanh khoản mô phỏng</th><th>Runway</th></tr></thead><tbody>${[0,6,12,24,36,60].map(m=>{const x=t.projection[m];const r=t.cashFlow.expenses>0?x.liquid/t.cashFlow.expenses:0;return `<tr><td>${m===0?'Hiện tại':`Tháng ${m}`}</td><td>${money(x.liquid)}</td><td>${r.toFixed(1)} tháng</td></tr>`}).join('')}</tbody></table></div><div class="df-intel-actions"><button class="df-intel-btn" data-twin-snapshot>Lưu snapshot hiện tại</button><span class="df-intel-pill">${s.length} snapshot đã lưu</span></div></div>`}
  function creditView(p){const c=creditScore(p);if(c.score===null)return `<div class="df-intel-hero"><div class="df-intel-kicker">CREDIT READINESS</div><h3>Chưa đủ dữ liệu</h3><p>DeciFin cần hồ sơ tài chính cơ bản trước khi tính chỉ số.</p></div>`;return `<div class="df-intel-hero"><div class="df-intel-kicker">DECIFIN CREDIT READINESS</div><h3>${c.score}/100 · ${c.level}</h3><p>${esc(c.note)}</p></div><div class="df-intel-grid two"><div class="df-intel-card"><div class="df-intel-score"><div class="df-intel-score-ring" style="--score:${c.score}%"><strong>${c.score}</strong></div><div><h3>Độ tin cậy ${c.confidence}%</h3><div class="df-intel-muted">Độ đầy đủ dữ liệu: ${c.completeness}%. Confidence không phải xác suất được ngân hàng duyệt.</div><div class="df-intel-progress"><i style="width:${c.completeness}%"></i></div></div></div></div><div class="df-intel-card"><h3>Công thức chấm điểm minh bạch</h3><p class="df-intel-muted">Điểm = Σ (điểm thành phần × trọng số) / Σ trọng số. Mỗi thành phần được chuẩn hóa 0–100.</p>${c.factors.map(f=>`<div class="df-intel-factor"><div><b>${esc(f.label)}</b><div class="df-intel-muted">${esc(f.reason)}</div><div class="df-intel-factor-bar"><i style="width:${f.value}%"></i></div></div><strong>${f.value.toFixed(0)} × ${f.weight}%</strong></div>`).join('')}</div></div><div class="df-intel-card" style="margin-top:12px"><h3>Nguyên tắc đọc điểm</h3><div class="df-intel-row"><span>80–100</span><b class="df-intel-good">Tốt</b></div><div class="df-intel-row"><span>65–79</span><b class="df-intel-good">Khá</b></div><div class="df-intel-row"><span>50–64</span><b class="df-intel-warn">Cần cải thiện</b></div><div class="df-intel-row"><span>0–49</span><b class="df-intel-risk">Rủi ro cao</b></div><div class="df-intel-warning">⚠️ Chỉ số này không thay thế CIC, điểm tín dụng ngân hàng hoặc bất kỳ quyết định cấp tín dụng nào. Không dùng nó để cam kết “chắc chắn được duyệt”.</div></div>`}
